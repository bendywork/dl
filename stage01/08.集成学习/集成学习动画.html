<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>集成学习动画演示</title>
<style>
body{font-family:Arial,sans-serif;background:#1a1a2e;color:#eee;margin:0;padding:20px;}
h1{text-align:center;color:#00d4ff;}
.container{max-width:900px;margin:0 auto;}
.section{background:#16213e;border-radius:12px;padding:20px;margin:20px 0;}
h2{color:#00d4ff;border-bottom:1px solid #333;padding-bottom:8px;}
canvas{display:block;margin:10px auto;border-radius:8px;}
.controls{text-align:center;margin:10px 0;}
button{background:#00d4ff;color:#000;border:none;padding:8px 20px;
       border-radius:6px;cursor:pointer;margin:4px;font-weight:bold;}
button:hover{background:#0099bb;}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;}
.dot{width:12px;height:12px;border-radius:50%;}
#log{background:#0d1117;padding:12px;border-radius:8px;font-size:13px;
     color:#7ee787;max-height:120px;overflow-y:auto;margin-top:8px;}
</style>
</head>
<body>
<div class="container">
<h1>🌲 集成学习动画演示</h1>

<div class="section">
<h2>Bagging：Bootstrap 采样 → 多树投票</h2>
<canvas id="cBag" width="820" height="260"></canvas>
<div class="controls">
  <button onclick="animBagging()">▶ 演示 Bagging</button>
  <button onclick="resetBagging()">↺ 重置</button>
</div>
<div id="log">点击"演示 Bagging"查看过程...</div>
</div>

<div class="section">
<h2>Boosting：串行纠错 — 错误样本权重递增</h2>
<canvas id="cBoost" width="820" height="260"></canvas>
<div class="controls">
  <button onclick="animBoosting()">▶ 演示 Boosting</button>
  <button onclick="resetBoosting()">↺ 重置</button>
</div>
</div>
</div>
<script>
const N=20,bag=document.getElementById('cBag'),bctx=bag.getContext('2d');
const boost=document.getElementById('cBoost'),pctx=boost.getContext('2d');
const log=document.getElementById('log');
let pts=[];
function rnd(a,b){return Math.random()*(b-a)+a;}
function initPts(){
  pts=[];
  for(let i=0;i<N;i++) pts.push({x:rnd(40,380),y:rnd(40,220),cls:i<N/2?0:1,w:1});
}
function drawPts(ctx,pts,ox=0){
  pts.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x+ox,p.y,Math.max(4,p.w*6),0,2*Math.PI);
    ctx.fillStyle=p.cls===0?'#4fc3f7':'#ef9a9a';
    ctx.globalAlpha=0.85; ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
  });
}
function resetBagging(){bctx.clearRect(0,0,820,260);initPts();drawPts(bctx,pts);log.textContent='已重置。';}
function resetBoosting(){pctx.clearRect(0,0,820,260);initPts();drawPts(pctx,pts);}
initPts();
async function animBagging(){
  bctx.clearRect(0,0,820,260); initPts(); drawPts(bctx,pts);
  const trees=3; const ox=[0,420,0]; const oy=[0,0,0];
  const labels=['原始数据','Bootstrap子集1','Bootstrap子集2'];
  for(let t=0;t<trees-1;t++){
    await new Promise(r=>setTimeout(r,600));
    let sub=Array.from({length:N},()=>pts[Math.floor(Math.random()*N)]);
    let offx=t===0?420:0; let offy=t===0?0:0;
    bctx.fillStyle='#00d4ff22'; bctx.fillRect(offx+(t===1?420:0),0,380,260);
    bctx.fillStyle='#00d4ff'; bctx.font='14px Arial';
    bctx.fillText('子集'+(t+1),offx+(t===1?430:10),20);
    drawPts(bctx,sub,offx+(t===1?420:0));
    log.textContent+= '\n子集'+(t+1)+'采样完成，训练第'+(t+1)+'棵树...';
    log.scrollTop=log.scrollHeight;
  }
  await new Promise(r=>setTimeout(r,500));
  bctx.fillStyle='#ffd700'; bctx.font='bold 16px Arial';
  bctx.fillText('✅ 多树投票 → 最终预测',280,245);
  log.textContent+='\n全部子树训练完毕，投票集成！';
}
async function animBoosting(){
  pctx.clearRect(0,0,820,260); initPts(); drawPts(pctx,pts);
  for(let rd=0;rd<3;rd++){
    await new Promise(r=>setTimeout(r,800));
    // 模拟：随机将部分样本标记为"错误"并放大权重
    pts.forEach(p=>{if(Math.random()<0.3) p.w=Math.min(p.w+0.8,3);});
    pctx.clearRect(0,0,820,260);
    drawPts(pctx,pts);
    pctx.fillStyle='#ffd700'; pctx.font='14px Arial';
    pctx.fillText('第'+(rd+1)+'轮：错误样本权重↑（圆圈更大）',10,20);
  }
  pctx.fillStyle='#7ee787'; pctx.font='bold 16px Arial';
  pctx.fillText('✅ 串行纠错完成，弱分类器加权融合',240,245);
}
drawPts(bctx,pts); drawPts(pctx,pts);
</script></body></html>
