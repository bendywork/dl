<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM细节动画 — 超白话版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --fg:#e6edf3;--fg2:#8b949e;--fg3:#6e7681;
  --green:#00d98b;--green-bg:rgba(0,217,139,.08);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,.08);
  --blue:#58a6ff;--blue-bg:rgba(88,166,255,.08);
  --gold:#ffd700;--gold-bg:rgba(255,215,0,.08);
  --red:#f85149;--orange:#f0883e;
  --phase-1:#79c0ff;--phase0:#56d364;--phase1:#d2a8ff;--phase2:#f78166;
  --phase3:#ffa657;--phase4:#ff7b72;--phase5:#7ee787;
  --phase6:#a5d6ff;--phase7:#ffc658;--phase8:#d2a8ff;--phase9:#56d364;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:'Noto Sans SC',sans-serif;font-size:14px;}
.mono{font-family:'JetBrains Mono',monospace;}

/* Layout */
#app{display:grid;height:100vh;
  grid-template-rows:48px 1fr 56px;
  grid-template-columns:38% 62%;}

/* Top bar */
#topbar{grid-column:1/-1;display:flex;align-items:center;padding:0 20px;
  background:var(--bg2);border-bottom:1px solid var(--bg3);gap:12px;}
#topbar .title{font-weight:700;font-size:15px;color:var(--fg);white-space:nowrap;}
#progress-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
#progress-bar{height:100%;border-radius:3px;transition:width .3s,background .3s;}
#phase-label{font-size:12px;color:var(--fg2);white-space:nowrap;min-width:120px;text-align:right;}
#step-counter{font-size:12px;color:var(--fg3);white-space:nowrap;font-family:'JetBrains Mono',monospace;}

/* Left panel - SVG */
#left{background:var(--bg);border-right:1px solid var(--bg3);overflow:auto;padding:8px;
  display:flex;flex-direction:column;align-items:center;}
#left svg{width:100%;max-height:calc(100vh - 160px);}

/* Right panel - content */
#right{background:var(--bg);overflow-y:auto;padding:20px 28px 20px 24px;scroll-behavior:smooth;}
#right::-webkit-scrollbar{width:6px;}
#right::-webkit-scrollbar-track{background:var(--bg2);}
#right::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;}

/* Step content */
.step-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.step-num{background:var(--bg3);color:var(--fg2);padding:2px 10px;border-radius:4px;
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;}
.step-title{font-size:17px;font-weight:700;line-height:1.4;}
.step-body{line-height:1.8;font-size:15px;}
.step-body .calc{font-family:'JetBrains Mono',monospace;font-size:16px;
  background:var(--bg2);padding:8px 14px;border-radius:6px;margin:8px 0;
  border-left:3px solid var(--blue);line-height:2;}
.step-body .calc .val{color:var(--blue);font-weight:500;}
.step-body .calc .res{color:var(--green);font-weight:700;}
.step-body .calc .neg{color:var(--red);font-weight:500;}
.step-body .calc .op{color:var(--fg3);}

/* Boxes */
.box{border-radius:8px;padding:12px 16px;margin:10px 0;line-height:1.9;font-size:14.5px;}
.box .label{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;
  border-radius:4px;margin-right:8px;vertical-align:middle;letter-spacing:.5px;}
.analogy-box{border:1.5px solid var(--green);background:var(--green-bg);}
.analogy-box .label{background:var(--green);color:#000;}
.beginner-box{border:1.5px solid var(--purple);background:var(--purple-bg);}
.beginner-box .label{background:var(--purple);color:#000;}
.why-box{border:1.5px solid var(--blue);background:var(--blue-bg);}
.why-box .label{background:var(--blue);color:#000;}
.interpret-box{border:1.5px solid var(--gold);background:var(--gold-bg);}
.interpret-box .label{background:var(--gold);color:#000;}

.phase-check{background:var(--bg2);border:1px solid var(--bg4);border-radius:8px;
  padding:12px 16px;margin:12px 0;font-size:13.5px;line-height:1.7;}
.phase-check .check-title{color:var(--green);font-weight:700;font-size:14px;margin-bottom:6px;}

/* Glossary */
#glossary{position:fixed;top:56px;right:8px;width:220px;max-height:280px;
  background:var(--bg2);border:1px solid var(--bg4);border-radius:8px;
  padding:10px 14px;font-size:12px;z-index:100;overflow-y:auto;
  box-shadow:0 4px 16px rgba(0,0,0,.4);display:none;}
#glossary .gl-title{font-weight:700;font-size:13px;color:var(--gold);margin-bottom:6px;
  border-bottom:1px solid var(--bg4);padding-bottom:4px;}
#glossary .gl-item{margin:5px 0;line-height:1.5;}
#glossary .gl-term{color:var(--purple);font-weight:600;}
#glossary .gl-def{color:var(--fg2);}

/* Bottom bar */
#bottombar{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
  background:var(--bg2);border-top:1px solid var(--bg3);gap:8px;padding:0 16px;}
.nav-btn{background:var(--bg3);color:var(--fg);border:none;padding:6px 18px;border-radius:6px;
  font-size:13px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:background .2s;}
.nav-btn:hover{background:var(--bg4);}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn.play{background:var(--green);color:#000;font-weight:700;}
.nav-btn.play:hover{background:#00f59b;}
#phase-select{background:var(--bg3);color:var(--fg);border:1px solid var(--bg4);
  border-radius:6px;padding:4px 10px;font-size:12px;font-family:'Noto Sans SC',sans-serif;}
.kb-hint{font-size:11px;color:var(--fg3);margin-left:12px;}

/* SVG styles */
.svg-node{rx:6;ry:6;stroke-width:1.5;}
.svg-label{font-size:11px;fill:var(--fg);text-anchor:middle;font-family:'Noto Sans SC',sans-serif;}
.svg-label-sm{font-size:9px;fill:var(--fg2);text-anchor:middle;font-family:'Noto Sans SC',sans-serif;}
.svg-val{font-size:10px;fill:var(--green);text-anchor:middle;font-family:'JetBrains Mono',monospace;}
.svg-arrow{stroke:var(--fg3);stroke-width:1.2;fill:none;marker-end:url(#arrowhead);}
.svg-arrow-active{stroke:var(--blue);stroke-width:2;filter:drop-shadow(0 0 4px rgba(88,166,255,.5));}
.svg-glow{filter:drop-shadow(0 0 8px rgba(88,166,255,.6));}
.svg-glow-green{filter:drop-shadow(0 0 8px rgba(0,217,139,.6));}
.svg-glow-purple{filter:drop-shadow(0 0 8px rgba(192,132,252,.6));}
.svg-glow-gold{filter:drop-shadow(0 0 8px rgba(255,215,0,.6));}

.highlight-flash{animation:flash .6s ease-out;}
@keyframes flash{0%{color:#fff;text-shadow:0 0 8px var(--green);}100%{text-shadow:none;}}

.fade-in{animation:fadeIn .3s ease-out;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">LSTM 细节动画 — 超白话版</span>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <span id="phase-label"></span>
    <span id="step-counter"></span>
  </div>
  <div id="left">
    <svg id="lstm-svg" viewBox="0 0 460 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--fg3)"/>
        </marker>
        <marker id="arrowhead-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="var(--blue)"/>
        </marker>
      </defs>
      <!-- Inputs -->
      <rect id="svg-xt" class="svg-node" x="20" y="10" width="90" height="34" fill="var(--bg3)" stroke="var(--fg3)"/>
      <text class="svg-label" x="65" y="31">x_t 当前输入</text>
      <rect id="svg-hp" class="svg-node" x="130" y="10" width="90" height="34" fill="var(--bg3)" stroke="var(--fg3)"/>
      <text class="svg-label" x="175" y="31">h_{t-1} 上步输出</text>
      <rect id="svg-cp" class="svg-node" x="350" y="10" width="90" height="34" fill="var(--bg3)" stroke="var(--orange)"/>
      <text class="svg-label" x="395" y="31">C_{t-1} 旧记忆</text>
      <!-- Concat -->
      <rect id="svg-concat" class="svg-node" x="60" y="70" width="130" height="34" fill="var(--bg3)" stroke="var(--phase1)"/>
      <text class="svg-label" x="125" y="91">拼接 concat</text>
      <text id="svg-concat-v" class="svg-val" x="125" y="105">[0.1, 0.6, 0.5, -0.3, 0.8]</text>
      <!-- Arrows from inputs to concat -->
      <line class="svg-arrow" x1="65" y1="44" x2="100" y2="70"/>
      <line class="svg-arrow" x1="175" y1="44" x2="140" y2="70"/>
      <!-- Forget gate -->
      <rect id="svg-fgate" class="svg-node" x="30" y="130" width="170" height="50" fill="var(--bg3)" stroke="var(--phase2)"/>
      <text class="svg-label" x="115" y="152">遗忘门 (筛选旧记忆)</text>
      <text id="svg-ft-v" class="svg-val" x="115" y="170">f_t = [?, ?]</text>
      <!-- Input gate -->
      <rect id="svg-igate" class="svg-node" x="230" y="130" width="170" height="50" fill="var(--bg3)" stroke="var(--phase5)"/>
      <text class="svg-label" x="315" y="152">输入门 (写入新信息)</text>
      <text id="svg-it-v" class="svg-val" x="315" y="170">i_t = [?, ?]</text>
      <!-- Candidate -->
      <rect id="svg-cand" class="svg-node" x="230" y="200" width="170" height="50" fill="var(--bg3)" stroke="var(--phase6)"/>
      <text class="svg-label" x="315" y="222">候选值 C~_t (新内容)</text>
      <text id="svg-ct-v" class="svg-val" x="315" y="240">C~_t = [?, ?]</text>
      <!-- Arrows concat to gates -->
      <line class="svg-arrow" x1="125" y1="104" x2="90" y2="130"/>
      <line class="svg-arrow" x1="160" y1="104" x2="280" y2="130"/>
      <line class="svg-arrow" x1="160" y1="104" x2="280" y2="200"/>
      <!-- Cell state line -->
      <line id="svg-c-line-top" x1="395" y1="44" x2="395" y2="280" stroke="var(--orange)" stroke-width="3" stroke-dasharray="6,3"/>
      <!-- Multiply node (forget) -->
      <circle id="svg-mul-f" cx="350" cy="300" r="14" fill="var(--bg2)" stroke="var(--phase2)" stroke-width="2"/>
      <text class="svg-label" x="350" y="304" fill="var(--fg)">x</text>
      <!-- Add node -->
      <circle id="svg-add" cx="395" cy="370" r="14" fill="var(--bg2)" stroke="var(--phase7)" stroke-width="2"/>
      <text class="svg-label" x="395" y="374" fill="var(--fg)">+</text>
      <!-- Multiply node (input) -->
      <circle id="svg-mul-i" cx="310" cy="340" r="14" fill="var(--bg2)" stroke="var(--phase5)" stroke-width="2"/>
      <text class="svg-label" x="310" y="344" fill="var(--fg)">x</text>
      <!-- C_t -->
      <rect id="svg-ct" class="svg-node" x="340" y="410" width="110" height="36" fill="var(--bg3)" stroke="var(--phase7)"/>
      <text class="svg-label" x="395" y="432">C_t 新记忆</text>
      <text id="svg-ct-res" class="svg-val" x="395" y="448">[?, ?]</text>
      <!-- Output gate -->
      <rect id="svg-ogate" class="svg-node" x="60" y="470" width="170" height="50" fill="var(--bg3)" stroke="var(--phase8)"/>
      <text class="svg-label" x="145" y="492">输出门 (选择对外暴露)</text>
      <text id="svg-ot-v" class="svg-val" x="145" y="510">o_t = [?, ?]</text>
      <!-- tanh + multiply for h_t -->
      <rect id="svg-tanh2" x="280" y="470" width="60" height="30" rx="6" fill="var(--bg3)" stroke="var(--phase9)"/>
      <text class="svg-label-sm" x="310" y="489">tanh</text>
      <circle id="svg-mul-o" cx="310" cy="530" r="14" fill="var(--bg2)" stroke="var(--phase9)" stroke-width="2"/>
      <text class="svg-label" x="310" y="534" fill="var(--fg)">x</text>
      <!-- h_t -->
      <rect id="svg-ht" class="svg-node" x="250" y="570" width="120" height="36" fill="var(--bg3)" stroke="var(--phase9)"/>
      <text class="svg-label" x="310" y="592">h_t 当前输出</text>
      <text id="svg-ht-res" class="svg-val" x="310" y="607">[?, ?]</text>
      <!-- Arrow C_t down -->
      <line class="svg-arrow" x1="395" y1="446" x2="395" y2="470"/>
      <!-- More arrows -->
      <line class="svg-arrow" x1="310" y1="500" x2="310" y2="516"/>
      <line class="svg-arrow" x1="395" y1="470" x2="330" y2="470"/>
      <line class="svg-arrow" x1="310" y1="544" x2="310" y2="570"/>
      <!-- f_t arrow to multiply -->
      <path d="M 115 180 Q 115 260 350 286" class="svg-arrow" fill="none"/>
      <!-- i_t arrow to multiply -->
      <path d="M 315 180 Q 315 250 310 326" class="svg-arrow" fill="none"/>
      <!-- C~_t arrow to multiply -->
      <path d="M 315 250 Q 315 290 310 326" class="svg-arrow" fill="none"/>
      <!-- mul-f to add -->
      <line class="svg-arrow" x1="364" y1="300" x2="381" y2="356"/>
      <!-- mul-i to add -->
      <line class="svg-arrow" x1="310" y1="354" x2="381" y2="366"/>
      <!-- add to C_t -->
      <line class="svg-arrow" x1="395" y1="384" x2="395" y2="410"/>
      <!-- C_t to tanh -->
      <path d="M 360 430 Q 310 450 310 470" class="svg-arrow" fill="none"/>
      <!-- o_t to multiply -->
      <path d="M 230 510 Q 270 520 296 530" class="svg-arrow" fill="none"/>
    </svg>
  </div>
  <div id="right"><div id="content"></div></div>
  <div id="bottombar">
    <button class="nav-btn" id="btn-prev5" onclick="jump(-5)">-5步</button>
    <button class="nav-btn" id="btn-prev" onclick="jump(-1)">上一步</button>
    <button class="nav-btn play" id="btn-play" onclick="togglePlay()">自动播放</button>
    <button class="nav-btn" id="btn-next" onclick="jump(1)">下一步</button>
    <button class="nav-btn" id="btn-next5" onclick="jump(5)">+5步</button>
    <select id="phase-select" onchange="jumpPhase(this.value)"></select>
    <span class="kb-hint">← → 单步 | ↑ ↓ 5步 | 空格 播放</span>
  </div>
</div>
<div id="glossary"><div class="gl-title">概念速查</div><div id="gl-items"></div></div>

<script>
// ===== Computations =====
const d=3, h=2;
const x_t=[0.5,-0.3,0.8], h_prev=[0.1,0.6], C_prev=[0.8,-0.2];
const concat=[...h_prev,...x_t]; // [0.1,0.6,0.5,-0.3,0.8]
const W_f=[[0.2,-0.1,0.3,0.1,-0.2],[0.1,0.4,-0.2,0.3,0.1]], b_f=[0,0];
const W_i=[[0.3,0.1,-0.1,0.2,0.4],[-0.2,0.3,0.5,0.1,-0.1]], b_i=[0.1,-0.1];
const W_C=[[0.1,-0.3,0.2,0.4,-0.1],[0.5,0.2,-0.4,0.1,0.3]], b_C=[0,0.1];
const W_o=[[-0.1,0.2,0.3,-0.2,0.1],[0.4,-0.1,0.2,0.3,0.2]], b_o=[0,0];

function sigmoid(z){return 1/(1+Math.exp(-z));}
function tanh_fn(z){return Math.tanh(z);}
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
function matvec(W,v,b){return W.map((row,i)=>dot(row,v)+b[i]);}
function hadamard(a,b){return a.map((x,i)=>x*b[i]);}

const f_raw=matvec(W_f,concat,b_f);
const f_t=f_raw.map(sigmoid);
const i_raw=matvec(W_i,concat,b_i);
const i_t=i_raw.map(sigmoid);
const C_raw=matvec(W_C,concat,b_C);
const C_tilde=C_raw.map(tanh_fn);
const forget_part=hadamard(f_t,C_prev);
const input_part=hadamard(i_t,C_tilde);
const C_t=[forget_part[0]+input_part[0],forget_part[1]+input_part[1]];
const o_raw=matvec(W_o,concat,b_o);
const o_t=o_raw.map(sigmoid);
const tanh_Ct=C_t.map(tanh_fn);
const h_t=hadamard(o_t,tanh_Ct);

function fmt(v,d=4){return v.toFixed(d);}
function vecStr(v){return '['+v.map(x=>fmt(x)).join(', ')+']';}
function signStr(v){return v>=0?`<span class="val">${fmt(v)}</span>`:`<span class="neg">${fmt(v)}</span>`;}

// ===== Phases =====
const phases=[
  {name:'数学前置知识',color:'var(--phase-1)',range:[1,35]},
  {name:'输入理解',color:'var(--phase0)',range:[36,45]},
  {name:'向量拼接',color:'var(--phase1)',range:[46,58]},
  {name:'遗忘门·权重',color:'var(--phase2)',range:[59,70]},
  {name:'遗忘门·计算',color:'var(--phase3)',range:[71,88]},
  {name:'遗忘门·结果',color:'var(--phase4)',range:[89,102]},
  {name:'输入门 i_t',color:'var(--phase5)',range:[103,122]},
  {name:'候选值 C~_t',color:'var(--phase6)',range:[123,138]},
  {name:'细胞状态更新',color:'var(--phase7)',range:[139,152]},
  {name:'输出门 o_t',color:'var(--phase8)',range:[153,168]},
  {name:'最终输出 h_t',color:'var(--phase9)',range:[169,180]},
];
function getPhase(step){return phases.find(p=>step>=p.range[0]&&step<=p.range[1])||phases[0];}

// ===== Glossary data =====
const glossary={
  '向量':'一排数字，如[0.5, -0.3, 0.8]，像购物清单',
  '维度':'向量里有几个数字，3维=3个数字',
  '矩阵':'数字组成的表格，2行5列=10个数',
  '矩阵乘向量':'每行做点积，5维变2维，像"翻译"',
  '点积':'对应位置相乘再全加，像"投票算总分"',
  'e':'自然常数≈2.718，连续增长的极限',
  '指数':'e²=e×e，右上角数字=乘几次',
  'sigmoid':'σ(z)=1/(1+e⁻ᶻ)，把任意数压到0~1',
  'tanh':'输出[-1,1]的压缩器，正→正，负→负',
  '⊙':'逐元素乘法，对应位置乘一下，像"音量旋钮"',
  '偏置':'基础偏好，即使输入为0也有值',
  '梯度消失':'信号逐层衰减，像传话游戏走样',
  'concat':'拼接，两个向量首尾相连',
  '遗忘门':'决定旧记忆保留多少，输出0~1',
  '输入门':'决定写入多少新信息，输出0~1',
  '候选值':'新内容候选，用tanh输出-1~1',
  '细胞状态':'长期记忆，C_t = 遗忘旧+写入新',
  '输出门':'选择哪些信息对外暴露',
};

// ===== SVG highlight groups =====
const svgGroups={
  'xt':['svg-xt'],
  'hp':['svg-hp'],
  'cp':['svg-cp'],
  'concat':['svg-concat'],
  'fgate':['svg-fgate'],
  'igate':['svg-igate'],
  'cand':['svg-cand'],
  'mul-f':['svg-mul-f'],
  'mul-i':['svg-mul-i'],
  'add':['svg-add'],
  'ct':['svg-ct'],
  'ogate':['svg-ogate'],
  'tanh2':['svg-tanh2'],
  'mul-o':['svg-mul-o'],
  'ht':['svg-ht'],
};

function highlightSVG(keys,cls='svg-glow'){
  Object.values(svgGroups).flat().forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    el.classList.remove('svg-glow','svg-glow-green','svg-glow-purple','svg-glow-gold');
  });
  keys.forEach(k=>{
    (svgGroups[k]||[]).forEach(id=>{
      const el=document.getElementById(id);if(el)el.classList.add(cls);
    });
  });
}

// ===== Build steps =====
// Each step: {t:title, body:html, phase:phaseIndex, svg:[keys], glow:'svg-glow', glTerms:[str]}
const S=[];

function add(t,body,svg,glTerms,glow){S.push({t,body,svg:svg||[],glTerms:glTerms||[],glow:glow||'svg-glow'});}

// ── PHASE -1: 数学前置知识 ──
add('什么是向量？',
  `<div class="analogy-box"><span class="label">生活比喻</span>向量就像一个<b>购物清单</b>，每个数字是某样东西的数量。<br>
  x_t = [0.5, -0.3, 0.8] 就像三个商品的评分：<br>

add('什么是矩阵乘向量？',

add('矩阵乘法的直觉',

add('什么是点积？',

add('点积的物理意义',

add('什么是 e（自然常数）？',
  `<div class="analogy-box"><span class="label">生活比喻</span>e ≈ 2.718...，是一个特殊的数字，就像 π ≈ 3.14 一样有名。它有一个神奇的性质：e^x 的变化率还是 e^x（自己不变），这让它在数学里超级好用。</div>
  <div class="beginner-box"><span class="label">小白解释</span>你不需要知道e是怎么推导的，只需要记住：e ≈ 2.718，是一个固定的数字，和 π 一样是数学里的"名人"。</div>`,

add('e 是怎么来的',

  <div class="calc">1次/年: 2.000<br>12次/年: 2.613<br>365次/年: 2.715<br>连续: ≈ <span class="res">2.718</span> = e</div>`,

add('什么是指数/幂？',
  `<div class="analogy-box"><span class="label">生活比喻</span>右上角的小数字 = 乘几次。e² = e×e = 2.718×2.718 ≈ 7.389。e³ = e×e×e。就像"复制粘贴"——e²就是把e复制粘贴2次然后相乘。</div>
  <div class="calc">e¹ = <span class="val">2.718</span><br>e² = 2.718 × 2.718 ≈ <span class="val">7.389</span><br>e³ = 2.718 × 2.718 × 2.718 ≈ <span class="val">20.09</span></div>`,

add('e^{负数}会怎样',
  `<div class="analogy-box"><span class="label">生活比喻</span>负指数 = <b>倒过来</b>。e⁻¹ = 1/e ≈ 0.368。就像"反着增长"——正指数是越乘越大，负指数是越除越小。</div>

add('e⁰ = 1',

add('什么是 Sigmoid 函数？',
  `<div class="analogy-box"><span class="label">生活比喻</span>Sigmoid 就像一个<b>"安检门"</b>，不管你输入什么数字，输出都被压缩到 0~1 之间。大数字 → 接近1（放行），小数字 → 接近0（拦住），0 → 正好0.5（犹豫不决）。</div>
  <div class="beginner-box"><span class="label">小白解释</span>sigmoid 是一个"万能压缩器"，它把任意大小的数字都变成0到1之间的小数。LSTM 用它来控制"开关"——0=关，1=开，0.5=半开。</div>`,

add('Sigmoid 公式逐步拆解',

  ② 再加1：1 + e⁻ᶻ（这个数永远>1）<br>
  ③ 最后取倒数：1/(永远>1的数)（所以结果永远<1且>0）</div>
  <div class="calc">σ(z) = 1 / (1 + e⁻ᶻ)<br>① e⁻ᶻ → 先算这个<br>② 1 + e⁻ᶻ → 再加1<br>③ 1/(②的结果) → 最终答案</div>`,

add('为什么 Sigmoid 输出一定在 [0,1]？',

  <div class="calc">e⁻ᶻ > 0 （永远正数）<br>1 + e⁻ᶻ > 1 （永远大于1）<br>1/(1+e⁻ᶻ) < 1 且 > 0<br>→ 结果 ∈ <span class="res">(0, 1)</span></div>`,

add('Sigmoid 的"开关"效果',

add('计算 σ(-0.08) 的完整过程',

add('什么是 tanh 函数？',

add('tanh vs sigmoid 的区别',

add('为什么候选值用 tanh',

add('⊙ 的效果',

add('⊙ vs 矩阵乘法的区别',

add('什么是偏置（bias）？',

add('什么是"梯度消失"？',

add('LSTM 如何解决梯度消失',
  `<div class="analogy-box"><span class="label">生活比喻</span>LSTM 给传话游戏加了一条<b>"直接电话线"</b>。C_t = f_t×C_{t-1} + i_t×C̃_t。如果 f_t≈1，则 C_t≈C_{t-1}，信息几乎原样传递！就像第1个人直接打电话给第10个人，不走中间9个人了。</div>

add('LSTM 的三个"记忆"',

  <div class="calc">下一时刻：<br>h_{t-1} ← h_t = ${vecStr(h_t)}<br>C_{t-1} ← C_t = ${vecStr(C_t)}<br>x_t ← 新的输入<br>然后重复整个流程！</div>
  <div class="phase-check"><div class="check-title">🎓 恭喜！你已经完整走完了一个LSTM时间步！</div>
  你理解了：<br>
  • 向量、矩阵、点积、sigmoid、tanh、⊙ 等数学工具<br>
  • 拼接操作：把历史和当前合成一个输入<br>
  • 遗忘门：决定旧记忆保留多少<br>
  • 输入门：决定新信息写入多少<br>
  • 候选值：生成新内容（可增可减）<br>
  • 细胞状态更新：旧记忆打折 + 新内容限量 = 更新记忆<br>
  • 输出门：选择对外暴露哪些信息<br>
  • 最终输出h_t = 输出门 × tanh(新记忆)<br><br>
  <b>如果还有不清楚的，可以后退重新看任何步骤！</b></div>`,
  [],[]);

// ===== Rendering Engine =====
let currentStep=0;
let playing=false;
let playTimer=null;

function render(step){
  currentStep=Math.max(0,Math.min(S.length-1,step));
  const s=S[currentStep];
  const phase=getPhase(currentStep+1);

  // Top bar
  const pct=((currentStep+1)/S.length)*100;
  const bar=document.getElementById('progress-bar');
  bar.style.width=pct+'%';
  bar.style.background=phase.color;
  document.getElementById('phase-label').textContent=phase.name;
  document.getElementById('step-counter').textContent=`${currentStep+1}/${S.length}`;

  // Content
  const c=document.getElementById('content');
  c.innerHTML=`<div class="fade-in">
    <div class="step-header">
      <span class="step-num">步骤 ${currentStep+1}</span>
      <span class="step-title">${s.t}</span>
    </div>
    <div class="step-body">${s.body}</div>
  </div>`;
  c.scrollTop=0;

  // SVG highlight
  highlightSVG(s.svg,s.glow);

  // Update SVG values based on current step
  updateSVGValues();

  // Glossary
  const gl=document.getElementById('glossary');
  const glItems=document.getElementById('gl-items');
  if(s.glTerms.length>0){
    gl.style.display='block';
    glItems.innerHTML=s.glTerms.map(t=>{
      const d=glossary[t]||'';
      return `<div class="gl-item"><span class="gl-term">${t}</span>: <span class="gl-def">${d}</span></div>`;
    }).join('');
  }else{
    gl.style.display='none';
  }

  // Buttons
  document.getElementById('btn-prev').disabled=currentStep<=0;
  document.getElementById('btn-prev5').disabled=currentStep<=0;
  document.getElementById('btn-next').disabled=currentStep>=S.length-1;
  document.getElementById('btn-next5').disabled=currentStep>=S.length-1;
}

function updateSVGValues(){
  const step=currentStep+1;
  // Update concat
  if(step>=55) document.getElementById('svg-concat-v').textContent=vecStr(concat);
  // Update forget gate
  if(step>=98) document.getElementById('svg-ft-v').textContent='f_t = '+vecStr(f_t);
  // Update input gate
  if(step>=122){
    const el=document.getElementById('svg-it-v');
    if(el) el.textContent='i_t = '+vecStr(i_t);
  }
  // Update candidate
  if(step>=138){
    const el=document.getElementById('svg-ct-v');
    if(el) el.textContent='C~_t = '+vecStr(C_tilde);
  }
  // Update C_t
  if(step>=152) document.getElementById('svg-ct-res').textContent=vecStr(C_t);
  // Update output gate
  if(step>=163){
    const el=document.getElementById('svg-ot-v');
    if(el) el.textContent='o_t = '+vecStr(o_t);
  }
  // Update h_t
  if(step>=177) document.getElementById('svg-ht-res').textContent=vecStr(h_t);
}

function jump(delta){
  render(currentStep+delta);
}

function jumpPhase(phaseName){
  const p=phases.find(ph=>ph.name===phaseName);
  if(p) render(p.range[0]-1);
}

function togglePlay(){
  playing=!playing;
  const btn=document.getElementById('btn-play');
  if(playing){
    btn.textContent='暂停';
    playTimer=setInterval(()=>{
      if(currentStep<S.length-1) render(currentStep+1);
      else{playing=false;btn.textContent='自动播放';clearInterval(playTimer);}
    },2500);
  }else{
    btn.textContent='自动播放';
    clearInterval(playTimer);
  }
}

// Keyboard navigation
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') jump(1);
  else if(e.key==='ArrowLeft') jump(-1);
  else if(e.key==='ArrowUp'){e.preventDefault();jump(-5);}
  else if(e.key==='ArrowDown'){e.preventDefault();jump(5);}
  else if(e.key===' '){e.preventDefault();togglePlay();}
});

// Phase dropdown
const sel=document.getElementById('phase-select');
phases.forEach(p=>{
  const o=document.createElement('option');
  o.value=p.name;
  o.textContent=`${p.range[0]}-${p.range[1]}: ${p.name}`;
  sel.appendChild(o);
});

// Initial render
render(0);
</script>
</body>
