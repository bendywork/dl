<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM 内部细节动画 — 逐步计算</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--fg:#e6edf3;--fg2:#8b949e;--fg3:#484f58;
  --border:#30363d;--accent:#58a6ff;
  --phase0:#6e7681;--phase1:#8b949e;--phase2:#e94560;--phase3:#ff6b81;--phase4:#c0392b;
  --phase5:#53d8fb;--phase6:#c084fc;--phase7:#00d98b;--phase8:#f5a623;--phase9:#ffd700;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Noto Sans SC',sans-serif}
code,.mono{font-family:'JetBrains Mono',monospace}

#app{display:flex;flex-direction:column;height:100vh;width:100vw}
#topbar{flex:0 0 48px;display:flex;align-items:center;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);gap:16px}
#topbar .phase-label{font-size:13px;color:var(--fg2);white-space:nowrap}
#topbar .step-label{font-size:13px;color:var(--fg);font-weight:500;white-space:nowrap}
#progress-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
#progress-bar{height:100%;width:0%;transition:width 0.4s ease;border-radius:3px}
#main{flex:1;display:flex;overflow:hidden;min-height:0}
#diagram-panel{flex:0 0 42%;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden;border-right:1px solid var(--border)}
#detail-panel{flex:1;overflow-y:auto;padding:24px 32px;scrollbar-width:thin;scrollbar-color:var(--fg3) transparent}
#detail-panel::-webkit-scrollbar{width:6px}
#detail-panel::-webkit-scrollbar-thumb{background:var(--fg3);border-radius:3px}

#navbar{flex:0 0 56px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--bg2);border-top:1px solid var(--border);padding:0 20px}
.nav-btn{background:var(--bg3);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;transition:all .15s}
.nav-btn:hover{background:var(--border);border-color:var(--fg3)}
.nav-btn:active{transform:scale(0.96)}
.nav-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500}
.nav-btn.primary:hover{background:#79b8ff}
#phase-select{background:var(--bg3);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:6px 12px;font-size:13px;font-family:'Noto Sans SC',sans-serif;cursor:pointer}

.step-number{font-size:12px;color:var(--fg3);margin-bottom:4px;letter-spacing:1px}
.step-title{font-size:20px;font-weight:700;margin-bottom:12px;line-height:1.4}
.step-calc{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:15px;line-height:1.8;white-space:pre-wrap}
.step-calc .val{color:var(--accent)}
.step-calc .op{color:var(--fg3)}
.step-calc .res{color:var(--phase7);font-weight:600}
.step-why{background:rgba(0,217,139,0.08);border-left:3px solid var(--phase7);padding:12px 16px;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7}
.step-why .label{color:var(--phase7);font-weight:600;margin-right:6px}
.step-context{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.6;white-space:pre-wrap}
.step-context .current-part{color:var(--accent);font-weight:600;background:rgba(88,166,255,0.12);padding:1px 4px;border-radius:3px}
.step-context .dim-part{color:var(--fg3)}
.step-running{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.step-running .label{color:var(--phase9);font-weight:600;margin-bottom:6px;display:block}
.step-running .acc{font-family:'JetBrains Mono',monospace;color:var(--phase9)}
.step-interpret{background:rgba(192,132,252,0.08);border-left:3px solid var(--phase6);padding:12px 16px;margin-bottom:16px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.7}
.step-interpret .label{color:var(--phase6);font-weight:600;margin-right:6px}

#lstm-svg{width:100%;max-width:520px;height:auto}
#lstm-svg text{font-family:'JetBrains Mono','Noto Sans SC',monospace;fill:var(--fg2)}
#lstm-svg .gate-label{font-family:'Noto Sans SC',sans-serif;font-size:13px}

.phase-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;margin-right:8px}
.detail-section{margin-bottom:8px}
.detail-section-title{font-size:13px;color:var(--fg3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease forwards}

.c0{color:var(--phase0)}.c1{color:var(--phase1)}.c2{color:var(--phase2)}.c3{color:var(--phase3)}
.c4{color:var(--phase4)}.c5{color:var(--phase5)}.c6{color:var(--phase6)}.c7{color:var(--phase7)}
.c8{color:var(--phase8)}.c9{color:var(--phase9)}
.bg0{background:var(--phase0)}.bg1{background:var(--phase1)}.bg2{background:var(--phase2)}.bg3{background:var(--phase3)}
.bg4{background:var(--phase4)}.bg5{background:var(--phase5)}.bg6{background:var(--phase6)}.bg7{background:var(--phase7)}
.bg8{background:var(--phase8)}.bg9{background:var(--phase9)}

.kbd{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:1px 6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--fg2)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="phase-label" id="phase-text">Phase 0/9</span>
    <span class="step-label" id="step-text">Step 1</span>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <span id="phase-name" style="font-size:12px;color:var(--fg3);white-space:nowrap"></span>
  </div>
  <div id="main">
    <div id="diagram-panel">
      <svg id="lstm-svg" viewBox="0 0 540 420"></svg>
    </div>
    <div id="detail-panel"></div>
  </div>
  <div id="navbar">
    <button class="nav-btn" onclick="jump(-5)" title="后退5步">⏪ -5</button>
    <button class="nav-btn" onclick="prev()" title="上一步">◀ 上一步</button>
    <select id="phase-select" onchange="jumpToPhase(this.value)" title="跳转到Phase">
      <option value="0">Phase 0: 输入理解</option>
      <option value="1">Phase 1: 向量拼接</option>
      <option value="2">Phase 2: 遗忘门权重</option>
      <option value="3">Phase 3: 遗忘门矩阵乘</option>
      <option value="4">Phase 4: 遗忘门激活</option>
      <option value="5">Phase 5: 输入门</option>
      <option value="6">Phase 6: 候选值</option>
      <option value="7">Phase 7: 细胞状态更新</option>
      <option value="8">Phase 8: 输出门</option>
      <option value="9">Phase 9: 最终输出</option>
    </select>
    <button class="nav-btn primary" onclick="next()" title="下一步">下一步 ▶</button>
    <button class="nav-btn" onclick="jump(5)" title="快进5步">+5 ⏩</button>
    <button class="nav-btn" id="autoplay-btn" onclick="toggleAutoplay()" title="自动播放">▶ 自动</button>
    <span style="margin-left:12px;font-size:11px;color:var(--fg3)">
      <span class="kbd">&larr;</span><span class="kbd">&rarr;</span> 单步
      <span class="kbd">&uarr;</span><span class="kbd">&darr;</span> 5步
      <span class="kbd">Space</span> 自动
    </span>
  </div>
</div>

<script>
// ============================================================
// NUMERICAL SETUP
// ============================================================
const d = 3, h = 2;
const x_t = [0.5, -0.3, 0.8];
const h_prev = [0.1, 0.6];
const C_prev = [0.8, -0.2];
const concat = [0.1, 0.6, 0.5, -0.3, 0.8];

const W_f = [[0.2, -0.1, 0.3, 0.1, -0.2],[0.1, 0.4, -0.2, 0.3, 0.1]];
const b_f = [0.0, 0.0];
const W_i = [[0.3, 0.1, -0.1, 0.2, 0.4],[-0.2, 0.3, 0.5, 0.1, -0.1]];
const b_i = [0.1, -0.1];
const W_C = [[0.1, -0.3, 0.2, 0.4, -0.1],[0.5, 0.2, -0.4, 0.1, 0.3]];
const b_C = [0.0, 0.1];
const W_o = [[-0.1, 0.2, 0.3, -0.2, 0.1],[0.4, -0.1, 0.2, 0.3, 0.2]];
const b_o = [0.0, 0.0];

function sigmoid(z){ return 1/(1+Math.exp(-z)); }
function fmt(v,d=4){ return Number(v).toFixed(d); }
function fmtS(v,d=4){ return (v>=0?' ':'')+fmt(v,d); }

function dotProduct(W, vec, row){
  let products = [];
  let sum = 0;
  for(let j=0;j<vec.length;j++){
    let p = W[row][j]*vec[j];
    products.push(p);
    sum += p;
  }
  return {products, sum};
}

// Compute all intermediate values
const f_dot0 = dotProduct(W_f, concat, 0);
const f_dot1 = dotProduct(W_f, concat, 1);
const f_raw = [f_dot0.sum + b_f[0], f_dot1.sum + b_f[1]];
const f_t = [sigmoid(f_raw[0]), sigmoid(f_raw[1])];

const i_dot0 = dotProduct(W_i, concat, 0);
const i_dot1 = dotProduct(W_i, concat, 1);
const i_raw = [i_dot0.sum + b_i[0], i_dot1.sum + b_i[1]];
const i_t = [sigmoid(i_raw[0]), sigmoid(i_raw[1])];

const Cc_dot0 = dotProduct(W_C, concat, 0);
const Cc_dot1 = dotProduct(W_C, concat, 1);
const Cc_raw = [Cc_dot0.sum + b_C[0], Cc_dot1.sum + b_C[1]];
const C_tilde = [Math.tanh(Cc_raw[0]), Math.tanh(Cc_raw[1])];

const forget_part = [f_t[0]*C_prev[0], f_t[1]*C_prev[1]];
const input_part = [i_t[0]*C_tilde[0], i_t[1]*C_tilde[1]];
const C_t = [forget_part[0]+input_part[0], forget_part[1]+input_part[1]];

const o_dot0 = dotProduct(W_o, concat, 0);
const o_dot1 = dotProduct(W_o, concat, 1);
const o_raw = [o_dot0.sum + b_o[0], o_dot1.sum + b_o[1]];
const o_t = [sigmoid(o_raw[0]), sigmoid(o_raw[1])];

const tanh_C = [Math.tanh(C_t[0]), Math.tanh(C_t[1])];
const h_t = [o_t[0]*tanh_C[0], o_t[1]*tanh_C[1]];

// ============================================================
// PHASE DEFINITIONS
// ============================================================
const phases = [
  {name:"输入理解", color:"var(--phase0)", ci:0, startStep:1},
  {name:"向量拼接", color:"var(--phase1)", ci:1, startStep:9},
  {name:"遗忘门 · 权重理解", color:"var(--phase2)", ci:2, startStep:19},
  {name:"遗忘门 · 矩阵乘法", color:"var(--phase3)", ci:3, startStep:29},
  {name:"遗忘门 · 偏置与激活", color:"var(--phase4)", ci:4, startStep:43},
  {name:"输入门 i_t", color:"var(--phase5)", ci:5, startStep:55},
  {name:"候选值 C~_t", color:"var(--phase6)", ci:6, startStep:69},
  {name:"细胞状态更新 C_t", color:"var(--phase7)", ci:7, startStep:81},
  {name:"输出门 o_t", color:"var(--phase8)", ci:8, startStep:95},
  {name:"最终隐藏状态 h_t", color:"var(--phase9)", ci:9, startStep:107}
];

function getPhaseForStep(stepN){
  for(let i=phases.length-1;i>=0;i--){
    if(stepN >= phases[i].startStep) return phases[i];
  }
  return phases[0];
}

// ============================================================
// BUILD ALL STEPS
// ============================================================
function buildSteps(){
  const S = [];
  let n = 0;

  function add(obj){ obj.n = ++n; S.push(obj); }

  // ─── PHASE 0: 输入理解 (Steps 1-8) ───
  add({phase:0, title:"时间步 t 的概念",
    calc:"LSTM 按<span class='val'>时间步</span>处理序列数据\n每个时间步 t = 0, 1, 2, ... 处理一个输入",
    why:"RNN/LSTM 的核心是<span class='val'>序列建模</span>——语言是逐词出现的，时序数据是逐时刻产生的。按时间步处理，让模型能捕捉前后依赖关系。",
    context:"LSTM: 对 t = 0, 1, 2, ... 逐步执行",
    active:'inputs'});

  add({phase:0, title:"当前输入 x_t 是什么",
    calc:"x_t = 一个时间步的<span class='val'>特征向量</span>\n例如：一个词的词嵌入 / 一个时刻的传感器读数",
    why:"x_t 是模型在当前时间步看到的<span class='val'>外部信息</span>，相当于\"此刻正在阅读的词\"或\"此刻的观测值\"。",
    context:"LSTM(x_t, h_{t-1}, C_{t-1}) → h_t, C_t\n      <span class='current-part'>x_t</span>",
    active:'inputs'});

  add({phase:0, title:"x_t 的维度 d=3",
    calc:"d = <span class='val'>3</span>（输入维度）\n每个元素代表一个特征维度",
    why:"维度 d 决定了输入向量的长度。本例 d=3 是为教学简化；实际中 NLP 的 d 可能是 300（Word2Vec）或 768（BERT）。",
    context:"x_t ∈ ℝ^<span class='current-part'>d</span> = ℝ^3",
    active:'inputs'});

  add({phase:0, title:"x_t 的具体数值",
    calc:"x_t = [<span class='val'>0.5</span>, <span class='val'>-0.3</span>, <span class='val'>0.8</span>]",
    why:"三个特征值：0.5表示第1特征偏正，-0.3表示第2特征偏负，0.8表示第3特征较强正。这些值来自上游（如词嵌入层）。",
    context:"x_t = <span class='current-part'>[0.5, -0.3, 0.8]</span>",
    active:'inputs'});

  add({phase:0, title:"上一时刻隐藏状态 h_{t-1}",
    calc:"h_{t-1} = LSTM 的<span class='val'>短期记忆</span>\n上一时刻对外输出的信息摘要",
    why:"h_{t-1} 是模型在 t-1 时刻的\"结论\"，携带了到上一刻为止的<span class='val'>序列上下文信息</span>。它如同\"你刚读过前文的印象\"。",
    context:"LSTM(x_t, <span class='current-part'>h_{t-1}</span>, C_{t-1}) → h_t, C_t",
    active:'inputs'});

  add({phase:0, title:"h_{t-1} 的具体数值",
    calc:"h_{t-1} = [<span class='val'>0.1</span>, <span class='val'>0.6</span>]\n维度 h = 2",
    why:"h=2 是隐藏维度（本例简化）。实际中 h 通常是 128、256 甚至 1024。0.1和0.6是上一时间步的输出。",
    context:"h_{t-1} = <span class='current-part'>[0.1, 0.6]</span> ∈ ℝ^h = ℝ^2",
    active:'inputs'});

  add({phase:0, title:"上一时刻细胞状态 C_{t-1}",
    calc:"C_{t-1} = LSTM 的<span class='val'>长期记忆</span>\n跨时间步持续传递的内部状态",
    why:"C_{t-1} 是 LSTM 区别于普通 RNN 的关键！它通过<span class='val'>加法更新</span>（而非乘法）传递，有效缓解梯度消失问题。如同\"你读完一本书记住的深层理解\"。",
    context:"LSTM(x_t, h_{t-1}, <span class='current-part'>C_{t-1}</span>) → h_t, C_t",
    active:'inputs'});

  add({phase:0, title:"C_{t-1} 的具体数值",
    calc:"C_{t-1} = [<span class='val'>0.8</span>, <span class='val'>-0.2</span>]\n维度 h = 2",
    why:"0.8表示第1维长期记忆偏正（保留了正信息），-0.2表示第2维略负。这些值可以是任意实数，不限于[0,1]。",
    context:"C_{t-1} = <span class='current-part'>[0.8, -0.2]</span> ∈ ℝ^h",
    active:'inputs'});

  // ─── PHASE 1: 向量拼接 (Steps 9-18) ───
  add({phase:1, title:"为什么要拼接 [h_{t-1}, x_t]",
    calc:"拼接目的：让<span class='val'>所有门</span>同时看到\"历史\"和\"当前\"",
    why:"LSTM 的四个门（遗忘/输入/候选/输出）都需要根据\"之前的记忆\"和\"当前的输入\"来决策。拼接后只需一次矩阵乘法，而非分别计算两次。",
    context:"<span class='current-part'>concat = [h_{t-1}; x_t]</span> → 供所有门使用",
    active:'concat'});

  add({phase:1, title:"拼接操作：首尾相连",
    calc:"把 h_{t-1} 和 x_t <span class='val'>首尾相连</span>：\n[h_{t-1}[0], h_{t-1}[1], x_t[0], x_t[1], x_t[2]]",
    why:"拼接（concatenation）是最简单的向量合并方式——不改变元素值，只是把它们排列在一起。这不是加权求和，不丢失信息。",
    context:"concat = <span class='current-part'>[h_{t-1}; x_t]</span> = [0.1, 0.6, 0.5, -0.3, 0.8]",
    active:'concat'});

  add({phase:1, title:"h_{t-1} 填入前 h=2 个位置",
    calc:"concat[0] = h_{t-1}[0] = <span class='val'>0.1</span>\nconcat[1] = h_{t-1}[1] = <span class='val'>0.6</span>",
    why:"拼接规则：\"历史\"向量在前。这是因为权重矩阵的前 h 列对应 h_{t-1}，后 d 列对应 x_t，有明确的分工。",
    context:"concat = [<span class='current-part'>0.1, 0.6</span>, _, _, _] ← h_{t-1}",
    active:'concat'});

  add({phase:1, title:"x_t 填入后 d=3 个位置",
    calc:"concat[2] = x_t[0] = <span class='val'>0.5</span>\nconcat[3] = x_t[1] = <span class='val'>-0.3</span>\nconcat[4] = x_t[2] = <span class='val'>0.8</span>",
    why:"\"当前\"向量在后。权重矩阵的后 d 列专门处理 x_t 的贡献。前后分工让模型能区分\"历史影响\"和\"当前影响\"。",
    context:"concat = [0.1, 0.6, <span class='current-part'>0.5, -0.3, 0.8</span>] ← x_t",
    active:'concat'});

  add({phase:1, title:"拼接结果确认",
    calc:"concat = [<span class='val'>0.1</span>, <span class='val'>0.6</span>, <span class='val'>0.5</span>, <span class='val'>-0.3</span>, <span class='val'>0.8</span>]",
    why:"拼接完成！这个5维向量将成为所有四个门的共同输入。",
    context:"<span class='current-part'>concat = [0.1, 0.6, 0.5, -0.3, 0.8]</span>",
    active:'concat'});

  add({phase:1, title:"拼接后的维度",
    calc:"dim(concat) = h + d = <span class='val'>2 + 3 = 5</span>",
    why:"拼接后维度 = 两个源向量维度之和。这使得权重矩阵的列数也变为 h+d=5。",
    context:"concat ∈ ℝ^<span class='current-part'>5</span> = ℝ^{h+d}",
    active:'concat'});

  add({phase:1, title:"为什么不分开乘权重？— 参数量相同",
    calc:"一个大 W: (h)×(h+d) = <span class='val'>2×5 = 10</span> 参数\n两个小 W: W_hh(h×h)+W_xh(h×d) = 2×2+2×3 = <span class='val'>4+6 = 10</span> 参数\n→ 参数量<span class='val'>完全相同</span>！",
    why:"数学上，拼接后用一个大矩阵和分别用两个小矩阵是等价的。大矩阵的前h列就是W_hh，后d列就是W_xh。",
    context:"W_f ∈ ℝ^{<span class='current-part'>h × (h+d)</span>} = ℝ^{2×5}",
    active:'concat'});

  add({phase:1, title:"拼接方式的工程优势",
    calc:"拼接优势：\n1. <span class='val'>代码更简洁</span> — 一行矩阵乘法\n2. <span class='val'>GPU并行效率更高</span> — 单次GEMM调用\n3. <span class='val'>内存访问更连续</span> — 减少缓存未命中",
    why:"在现代GPU上，一次大的矩阵乘法（2×5）比两次小的（2×2 和 2×3）更快，因为GPU的并行计算单元利用率更高。",
    context:"W_f · concat = <span class='current-part'>一次矩阵乘法搞定</span>",
    active:'concat'});

  add({phase:1, title:"concat — 所有门的共享输入",

  // Input gate row 0

  add({phase:5, title:`输入门第1行求和 = ${fmt(i_dot0.sum)}`,

    active:'input', running:`W_i·concat = [${fmt(i_dot0.sum)}, _]`});

  // Input gate row 1
  const i1p = [];
  for(let j=0;j<5;j++){
    let p = W_i[1][j]*concat[j];
    i1p.push(p);
    let acc = i1p.reduce((a,b)=>a+b,0);
    add({phase:5, title:`W_i[1][${j}] × concat[${j}] = ${fmt(W_i[1][j])} × ${fmtS(concat[j])} = ${fmt(p)}`,
      calc:`<span class='val'>${fmt(W_i[1][j])}</span> × <span class='val'>${fmtS(concat[j])}</span> = <span class='res'>${fmt(p)}</span>`,
      why:`W_i[1][${j}]=${fmt(W_i[1][j])} ${W_i[1][j]>0?'(正→促进写入)':'(负→抑制写入)'}。`,

  }
  add({phase:5, title:`输入门第2行求和 = ${fmt(i_dot1.sum)}`,
    calc:`${i1p.map(v=>`<span class='val'>${fmt(v)}</span>`).join(' + ')}\n= <span class='res'>${fmt(i_dot1.sum)}</span>`,
    why:`第2行点积结果为 ${fmt(i_dot1.sum)}。`,
    context:`W_i[1]·concat = <span class='current-part'>${fmt(i_dot1.sum)}</span>`,
    active:'input', running:`W_i·concat = [${fmt(i_dot0.sum)}, ${fmt(i_dot1.sum)}]`});

  add({phase:5, title:`加偏置 b_i = [${fmt(b_i[0])}, ${fmt(b_i[1])}]`,
    calc:`[${fmt(i_dot0.sum)}, ${fmt(i_dot1.sum)}] + [<span class='val'>${fmt(b_i[0])}</span>, <span class='val'>${fmt(b_i[1])}</span>]\n= [<span class='res'>${fmt(i_raw[0])}</span>, <span class='res'>${fmt(i_raw[1])}</span>]`,
    why:`b_i = [${fmt(b_i[0])}, ${fmt(b_i[1])}]。第1维偏置+0.1，增加了写入倾向；第2维偏置-0.1，降低了写入倾向。`,
    context:`i_t = σ(W_i·concat + <span class='current-part'>b_i</span>)\n    = σ([${fmt(i_raw[0])}, ${fmt(i_raw[1])}])`,
    active:'input'});

  add({phase:5, title:`σ(${fmt(i_raw[0])}) 的计算`,
    calc:`e^{${fmt(-i_raw[0])}} = <span class='val'>${fmt(Math.exp(-i_raw[0]))}</span>\nσ(${fmt(i_raw[0])}) = 1/(1+${fmt(Math.exp(-i_raw[0]))}) = <span class='res'>${fmt(i_t[0])}</span>`,
    why:`z=${fmt(i_raw[0])}>0，sigmoid结果>0.5，第1维倾向写入。偏置+0.1起了作用！`,
    context:`i_t[0] = σ(${fmt(i_raw[0])}) = <span class='current-part'>${fmt(i_t[0])}</span>`,

  add({phase:5, title:`σ(${fmt(i_raw[1])}) 的计算`,
    calc:`e^{${fmt(-i_raw[1])}} = <span class='val'>${fmt(Math.exp(-i_raw[1]))}</span>\nσ(${fmt(i_raw[1])}) = 1/(1+${fmt(Math.exp(-i_raw[1]))}) = <span class='res'>${fmt(i_t[1])}</span>`,

  add({phase:5, title:`输入门输出 i_t = [${fmt(i_t[0])}, ${fmt(i_t[1])}]`,

  // ─── PHASE 6: 候选值 C~_t (Steps 69-80) ───
  add({phase:6, title:"候选值的目的 — 生成\"要写入什么新内容\"",
    calc:"C~_t = <span class='val'>候选新内容</span>\n由当前输入和历史共同决定",
    why:"输入门决定\"写多少\"（i_t是比例），候选值决定\"写什么\"（C~_t是内容）。两者配合：i_t ⊙ C~_t = 实际写入量。",

  add({phase:6, title:"为什么用 tanh 而不是 sigmoid？",
    calc:"tanh 输出范围：<span class='val'>[-1, 1]</span>\nsigmoid 输出范围：[0, 1]\n→ 候选值可以是<span class='val'>负数</span>（表示\"减少\"）",
    why:"sigmoid 只能输出正值，意味着候选新内容只能\"增加\"细胞状态。但有时需要\"减少\"——tanh允许负值，让模型可以增加或减少每个维度的值。",
    context:`C~_t = <span class='current-part'>tanh</span>(W_C·concat + b_C)  ∈ [-1, 1]`,
    active:'candidate'});

  add({phase:6, title:"W_C 的维度和含义",
    calc:`W_C ∈ ℝ^{<span class='val'>2×5</span>}\n与 W_f, W_i 同维度\n但学习的是\"内容生成\"规则而非\"门控\"规则`,
    why:"W_C 的结构和其他权重矩阵相同，但它的目的是生成内容而非门控信号。所以它用tanh激活而非sigmoid。",
    context:`C~_t = tanh(<span class='current-part'>W_C</span>·concat + b_C)`,
    active:'candidate'});

  // Candidate row 0
  const C0p = [];
  for(let j=0;j<5;j++){
    let p = W_C[0][j]*concat[j];
    C0p.push(p);
    let acc = C0p.reduce((a,b)=>a+b,0);
    add({phase:6, title:`W_C[0][${j}] × concat[${j}] = ${fmt(W_C[0][j])} × ${fmtS(concat[j])} = ${fmt(p)}`,
      calc:`<span class='val'>${fmt(W_C[0][j])}</span> × <span class='val'>${fmtS(concat[j])}</span> = <span class='res'>${fmt(p)}</span>`,
      why:`权重${fmt(W_C[0][j])}，第${j}个输入。`,
      context:`W_C[0]·concat: ... + <span class='current-part'>${fmt(W_C[0][j])}×${fmtS(concat[j])}=${fmt(p)}</span>`,
      active:'candidate', running:`W_C[0]·concat 累计 = ${fmt(acc)}`});
  }
  add({phase:6, title:`候选值第1行求和 = ${fmt(Cc_dot0.sum)}`,
    calc:`${C0p.map(v=>`<span class='val'>${fmt(v)}</span>`).join(' + ')}\n= <span class='res'>${fmt(Cc_dot0.sum)}</span>`,
    why:`${fmt(Cc_dot0.sum)}，${Cc_dot0.sum>0?'正数→候选值为正(增加)':'负数→候选值为负(减少)'}。`,
    context:`W_C[0]·concat = <span class='current-part'>${fmt(Cc_dot0.sum)}</span>`,
    active:'candidate', running:`W_C·concat = [${fmt(Cc_dot0.sum)}, _]`});

  // Candidate row 1
  const C1p = [];
  for(let j=0;j<5;j++){
    let p = W_C[1][j]*concat[j];
    C1p.push(p);
    let acc = C1p.reduce((a,b)=>a+b,0);

      calc:`<span class='val'>${fmt(W_C[1][j])}</span> × <span class='val'>${fmtS(concat[j])}</span> = <span class='res'>${fmt(p)}</span>`,

      context:`W_C[1]·concat: ... + <span class='current-part'>${fmt(W_C[1][j])}×${fmtS(concat[j])}=${fmt(p)}</span>`,
      active:'candidate', running:`W_C[1]·concat 累计 = ${fmt(acc)}`});
  }
  add({phase:6, title:`候选值第2行求和 = ${fmt(Cc_dot1.sum)}`,
    calc:`${C1p.map(v=>`<span class='val'>${fmt(v)}</span>`).join(' + ')}\n= <span class='res'>${fmt(Cc_dot1.sum)}</span>`,
    why:`${fmt(Cc_dot1.sum)}，${Cc_dot1.sum>0?'正数→候选值为正(增加)':'负数→候选值为负(减少)'}。`,
    context:`W_C[1]·concat = <span class='current-part'>${fmt(Cc_dot1.sum)}</span>`,
    active:'candidate', running:`W_C·concat = [${fmt(Cc_dot0.sum)}, ${fmt(Cc_dot1.sum)}]`});

  add({phase:6, title:`加偏置 b_C = [${fmt(b_C[0])}, ${fmt(b_C[1])}]`,
    calc:`[${fmt(Cc_dot0.sum)}, ${fmt(Cc_dot1.sum)}] + [<span class='val'>${fmt(b_C[0])}</span>, <span class='val'>${fmt(b_C[1])}</span>]\n= [<span class='res'>${fmt(Cc_raw[0])}</span>, <span class='res'>${fmt(Cc_raw[1])}</span>]`,
    why:`b_C[1]=0.1 增加了第2维的候选值（略偏正），b_C[0]=0 不影响第1维。`,
    context:`C~_t = tanh(W_C·concat + <span class='current-part'>b_C</span>)`,
    active:'candidate'});

  add({phase:6, title:`tanh(${fmt(Cc_raw[0])}) 的计算`,
    calc:`tanh(z) = (eᶻ - e⁻ᶻ)/(eᶻ + e⁻ᶻ)\nz = ${fmt(Cc_raw[0])}（负数）\ntanh(${fmt(Cc_raw[0])}) = <span class='res'>${fmt(C_tilde[0])}</span>`,
    why:`z<0 所以tanh结果为负，表示第1维的候选新内容是\"减少\"该维度的值。`,

  // ─── PHASE 7: 细胞状态更新 C_t (Steps 81-94) ───
  add({phase:7, title:"最核心的步骤！C_t 的更新公式",
    calc:`C_t = <span class='val'>f_t ⊙ C_{t-1}</span> + <span class='val'>i_t ⊙ C~_t</span>\n⊙ = 逐元素乘法(Hadamard积)`,
    why:"这是 LSTM 的核心创新！细胞状态通过<span class='val'>加法</span>更新，而非 RNN 的乘法更新。加法更新让梯度可以直接流过（梯度≈1），解决了 RNN 的梯度消失问题。",
    context:`<span class='current-part'>C_t = f_t ⊙ C_{t-1} + i_t ⊙ C~_t</span>`,
    active:'cellstate'});

  add({phase:7, title:"第一部分：f_t ⊙ C_{t-1} — 遗忘旧信息",
    calc:`f_t ⊙ C_{t-1}\n= [${fmt(f_t[0])}, ${fmt(f_t[1])}] ⊙ [${fmt(C_prev[0])}, ${fmt(C_prev[1])}]`,
    why:"遗忘门逐元素乘以旧细胞状态。f_t=1则完全保留，f_t=0则完全遗忘，f_t=0.5则保留一半。",
    context:`C_t = <span class='current-part'>f_t ⊙ C_{t-1}</span> + i_t ⊙ C~_t\n      ↑ 遗忘旧信息`,
    active:'cellstate'});

  add({phase:7, title:`f_t[0] × C_{t-1}[0] = ${fmt(f_t[0])} × ${fmt(C_prev[0])} = ${fmt(forget_part[0])}`,
    calc:`f_t[0] = <span class='val'>${fmt(f_t[0])}</span>\nC_{t-1}[0] = <span class='val'>${fmt(C_prev[0])}</span>\n${fmt(f_t[0])} × ${fmt(C_prev[0])} = <span class='res'>${fmt(forget_part[0])}</span>\n→ 第1维保留 ${fmt(f_t[0]*100,1)}%，从 ${fmt(C_prev[0])} 降到 ${fmt(forget_part[0])}`,
    why:"原始第1维细胞状态0.8（较强的正信号），保留48%后变为0.3840——正信号减弱但未消失。",
    context:`f_t⊙C_{t-1} = [<span class='current-part'>${fmt(forget_part[0])}</span>, _]`,
    active:'cellstate'});

  add({phase:7, title:`f_t[1] × C_{t-1}[1] = ${fmt(f_t[1])} × ${fmt(C_prev[1])} = ${fmt(forget_part[1])}`,
    calc:`f_t[1] = <span class='val'>${fmt(f_t[1])}</span>\nC_{t-1}[1] = <span class='val'>${fmt(C_prev[1])}</span>\n${fmt(f_t[1])} × ${fmt(C_prev[1])} = <span class='res'>${fmt(forget_part[1])}</span>\n→ 第2维保留 ${fmt(f_t[1]*100,1)}%，从 ${fmt(C_prev[1])} 变到 ${fmt(forget_part[1])}`,
    why:"原始第2维-0.2（弱的负信号），保留53%后变为-0.1070——负信号减弱（绝对值变小），向0靠近。",
    context:`f_t⊙C_{t-1} = [${fmt(forget_part[0])}, <span class='current-part'>${fmt(forget_part[1])}</span>]`,
    active:'cellstate'});

  add({phase:7, title:`遗忘部分结果 = [${fmt(forget_part[0])}, ${fmt(forget_part[1])}]`,
    calc:`f_t ⊙ C_{t-1} = [<span class='res'>${fmt(forget_part[0])}</span>, <span class='res'>${fmt(forget_part[1])}</span>]`,
    why:"经过遗忘门后，旧细胞状态的两维都被压缩了——但都没有完全消失（因为f_t≠0），也没有完全保留（因为f_t≠1）。",
    context:`C_t = [<span class='current-part'>${fmt(forget_part[0])}, ${fmt(forget_part[1])}</span>] + i_t⊙C~_t`,
    active:'cellstate'});

  add({phase:7, title:"第二部分：i_t ⊙ C~_t — 写入新信息",
    calc:`i_t ⊙ C~_t\n= [${fmt(i_t[0])}, ${fmt(i_t[1])}] ⊙ [${fmt(C_tilde[0])}, ${fmt(C_tilde[1])}]`,
    why:"输入门逐元素乘以候选值。i_t控制写入比例，C~_t是写入内容。两者相乘得到实际写入量。",
    context:`C_t = f_t⊙C_{t-1} + <span class='current-part'>i_t ⊙ C~_t</span>\n                      ↑ 写入新信息`,
    active:'cellstate'});

  add({phase:7, title:`i_t[0] × C~_t[0] = ${fmt(i_t[0])} × ${fmt(C_tilde[0])} = ${fmt(input_part[0])}`,
    calc:`i_t[0] = <span class='val'>${fmt(i_t[0])}</span>\nC~_t[0] = <span class='val'>${fmt(C_tilde[0])}</span>（负值→减少）\n${fmt(i_t[0])} × ${fmt(C_tilde[0])} = <span class='res'>${fmt(input_part[0])}</span>`,
    why:"第1维写入量为负！这意味着新信息要减少第1维的值。约60%的写入比例 x 负的候选值 = 负的实际写入量。",
    context:`i_t⊙C~_t = [<span class='current-part'>${fmt(input_part[0])}</span>, _]`,
    active:'cellstate'});

  add({phase:7, title:`i_t[1] × C~_t[1] = ${fmt(i_t[1])} × ${fmt(C_tilde[1])} = ${fmt(input_part[1])}`,
    calc:`i_t[1] = <span class='val'>${fmt(i_t[1])}</span>\nC~_t[1] = <span class='val'>${fmt(C_tilde[1])}</span>（正值→增加）\n${fmt(i_t[1])} × ${fmt(C_tilde[1])} = <span class='res'>${fmt(input_part[1])}</span>`,
    why:"第2维写入量为正！新信息要增加第2维的值。约55%的写入比例 x 正的候选值 = 正的实际写入量。",
    context:`i_t⊙C~_t = [${fmt(input_part[0])}, <span class='current-part'>${fmt(input_part[1])}</span>]`,
    active:'cellstate'});

  add({phase:7, title:`写入部分结果 = [${fmt(input_part[0])}, ${fmt(input_part[1])}]`,
    calc:`i_t ⊙ C~_t = [<span class='res'>${fmt(input_part[0])}</span>, <span class='res'>${fmt(input_part[1])}</span>]`,
    why:`第1维写入${fmt(input_part[0])}（减少），第2维写入${fmt(input_part[1])}（增加）。`,
    context:`C_t = [${fmt(forget_part[0])}, ${fmt(forget_part[1])}] + <span class='current-part'>[${fmt(input_part[0])}, ${fmt(input_part[1])}]</span>`,
    active:'cellstate'});

  add({phase:7, title:"两部分相加：逐元素加法",
    calc:`C_t = f_t⊙C_{t-1} + i_t⊙C~_t\n    = [${fmt(forget_part[0])}, ${fmt(forget_part[1])}]\n    + [${fmt(input_part[0])}, ${fmt(input_part[1])}]`,
    why:"加法！不是乘法！这是 LSTM 解决梯度消失的关键——RNN 用乘法更新状态，梯度连乘导致指数衰减；LSTM 用加法更新，梯度可以\"加法流过\"。",
    context:`<span class='current-part'>C_t = 遗忘部分 + 写入部分</span>`,
    active:'cellstate'});

  add({phase:7, title:`C_t[0] = ${fmt(forget_part[0])} + ${fmt(input_part[0])} = ${fmt(C_t[0])}`,
    calc:`C_t[0] = <span class='val'>${fmt(forget_part[0])}</span> + <span class='val'>${fmt(input_part[0])}</span>\n       = <span class='res'>${fmt(C_t[0])}</span>\n旧值0.8 → 遗忘后0.384 → 写入(${fmt(input_part[0])}) → 最终${fmt(C_t[0])}`,
    why:`第1维从0.8降到了${fmt(C_t[0])}。遗忘门减少了约52%，输入门又写入了一个负值，双重下降。`,
    context:`C_t[0] = <span class='current-part'>${fmt(C_t[0])}</span>`,
    active:'cellstate'});

  add({phase:7, title:`C_t[1] = ${fmt(forget_part[1])} + ${fmt(input_part[1])} = ${fmt(C_t[1])}`,
    calc:`C_t[1] = <span class='val'>${fmt(forget_part[1])}</span> + <span class='val'>${fmt(input_part[1])}</span>\n       = <span class='res'>${fmt(C_t[1])}</span>\n旧值-0.2 → 遗忘后(${fmt(forget_part[1])}) → 写入+${fmt(input_part[1])} → 最终${fmt(C_t[1])}`,
    why:`第2维从-0.2升到了${fmt(C_t[1])}。遗忘门减弱了负信号，输入门写入了正值，两个因素共同将其推向正方向。`,
    context:`C_t[1] = <span class='current-part'>${fmt(C_t[1])}</span>`,
    active:'cellstate'});

  add({phase:7, title:`C_t 最终结果 = [${fmt(C_t[0])}, ${fmt(C_t[1])}]`,
    calc:`C_t = [<span class='res'>${fmt(C_t[0])}</span>, <span class='res'>${fmt(C_t[1])}</span>]`,
    why:"新细胞状态已更新完成！C_t 将被传递到下一个时间步作为 C_{t+1} 的输入。这就是LSTM的\"记忆传送带\"。",
    context:`<span class='current-part'>C_t = [${fmt(C_t[0])}, ${fmt(C_t[1])}]</span>`,
    active:'cellstate'});

  add({phase:7, title:"为什么这解决了梯度消失 — 核心洞察",
    calc:`反向传播时：∂C_t/∂C_{t-1} = <span class='val'>f_t</span>\n如果 f_t ≈ 1 → 梯度 ≈ <span class='val'>1 × 旧梯度</span>，不衰减！\n对比 RNN：∂h_t/∂h_{t-1} = W（连乘导致指数衰减）`,
    why:"LSTM 的梯度可以通过 f_t 门控制流过：只要遗忘门决定保留（f_t≈1），梯度就不衰减。这是 LSTM 相比 RNN 的根本优势——让梯度可以穿越很多时间步。",
    context:`∂L/∂C_{t-1} = <span class='current-part'>f_t ⊙ ∂L/∂C_t</span> + ...`,
    active:'cellstate', interpret:"如果遗忘门初始化为1（b_f=1），训练初期几乎所有梯度都能无损流过。即使经过100个时间步，梯度也只有微弱衰减，而RNN在10步后就接近0了。"});

  // ─── PHASE 8: 输出门 (Steps 95-106) ───
  add({phase:8, title:"输出门的目的",
    calc:"o_t = 决定<span class='val'>暴露多少细胞状态</span>给外部\n细胞状态是\"内部记忆\"，输出门控制\"对外分享多少\"",
    why:"细胞状态 C_t 可能包含很多信息，但并非所有信息都需要在当前时刻对外输出。输出门选择性地暴露相关部分，形成隐藏状态 h_t。",
    context:`h_t = <span class='current-part'>o_t</span> ⊙ tanh(C_t)\n      ↑ 控制暴露比例`,
    active:'output'});

  add({phase:8, title:"W_o 的维度和含义",
    calc:`W_o ∈ ℝ^{<span class='val'>2×5</span>}\n与其他门同维度，学习\"输出决策\"规则`,
    why:"输出门的结构与遗忘门、输入门完全一致，只是学习不同的参数。参数不同→不同的门控行为。",
    context:`o_t = σ(<span class='current-part'>W_o</span>·concat + b_o)`,
    active:'output'});

  // Output gate row 0
  const o0p = [];
  for(let j=0;j<5;j++){
    let p = W_o[0][j]*concat[j];
    o0p.push(p);
    let acc = o0p.reduce((a,b)=>a+b,0);
    add({phase:8, title:`W_o[0][${j}] × concat[${j}] = ${fmt(W_o[0][j])} × ${fmtS(concat[j])} = ${fmt(p)}`,
      calc:`<span class='val'>${fmt(W_o[0][j])}</span> × <span class='val'>${fmtS(concat[j])}</span> = <span class='res'>${fmt(p)}</span>`,
      why:`权重${fmt(W_o[0][j])}。`,
      context:`W_o[0]·concat: ... + <span class='current-part'>${fmt(W_o[0][j])}×${fmtS(concat[j])}=${fmt(p)}</span>`,
      active:'output', running:`W_o[0]·concat 累计 = ${fmt(acc)}`});
  }
  add({phase:8, title:`输出门第1行求和 = ${fmt(o_dot0.sum)}`,
    calc:`${o0p.map(v=>`<span class='val'>${fmt(v)}</span>`).join(' + ')}\n= <span class='res'>${fmt(o_dot0.sum)}</span>`,
    why:`第1行点积 = ${fmt(o_dot0.sum)}，${o_dot0.sum>0?'正数→倾向暴露':'负数→倾向隐藏'}第1维。`,
    context:`W_o[0]·concat = <span class='current-part'>${fmt(o_dot0.sum)}</span>`,
    active:'output', running:`W_o·concat = [${fmt(o_dot0.sum)}, _]`});

  // Output gate row 1
  const o1p = [];
  for(let j=0;j<5;j++){
    let p = W_o[1][j]*concat[j];
    o1p.push(p);
    let acc = o1p.reduce((a,b)=>a+b,0);
    add({phase:8, title:`W_o[1][${j}] × concat[${j}] = ${fmt(W_o[1][j])} × ${fmtS(concat[j])} = ${fmt(p)}`,
      calc:`<span class='val'>${fmt(W_o[1][j])}</span> × <span class='val'>${fmtS(concat[j])}</span> = <span class='res'>${fmt(p)}</span>`,
      why:`权重${fmt(W_o[1][j])}。`,
      context:`W_o[1]·concat: ... + <span class='current-part'>${fmt(W_o[1][j])}×${fmtS(concat[j])}=${fmt(p)}</span>`,
      active:'output', running:`W_o[1]·concat 累计 = ${fmt(acc)}`});
  }
  add({phase:8, title:`输出门第2行求和 = ${fmt(o_dot1.sum)}`,
    calc:`${o1p.map(v=>`<span class='val'>${fmt(v)}</span>`).join(' + ')}\n= <span class='res'>${fmt(o_dot1.sum)}</span>`,
    why:`第2行点积 = ${fmt(o_dot1.sum)}。`,
    context:`W_o[1]·concat = <span class='current-part'>${fmt(o_dot1.sum)}</span>`,
    active:'output', running:`W_o·concat = [${fmt(o_dot0.sum)}, ${fmt(o_dot1.sum)}]`});

  add({phase:8, title:`加偏置 b_o = [${fmt(b_o[0])}, ${fmt(b_o[1])}]`,
    calc:`[${fmt(o_dot0.sum)}, ${fmt(o_dot1.sum)}] + [0, 0] = [${fmt(o_raw[0])}, ${fmt(o_raw[1])}]`,
    why:"输出门偏置也为0（简化）。实际训练中偏置会被优化。",
    context:`o_t = σ(W_o·concat + <span class='current-part'>b_o</span>) = σ([${fmt(o_raw[0])}, ${fmt(o_raw[1])}])`,
    active:'output'});

  add({phase:8, title:`σ(${fmt(o_raw[0])}) 和 σ(${fmt(o_raw[1])}) 的计算`,
    calc:`σ(${fmt(o_raw[0])}) = 1/(1+e^{${fmt(-o_raw[0])}}) = 1/(1+${fmt(Math.exp(-o_raw[0]))}) = <span class='res'>${fmt(o_t[0])}</span>\nσ(${fmt(o_raw[1])}) = 1/(1+e^{${fmt(-o_raw[1])}}) = 1/(1+${fmt(Math.exp(-o_raw[1]))}) = <span class='res'>${fmt(o_t[1])}</span>`,
    why:"两个维度的sigmoid值都>0.5，倾向暴露细胞状态。",
    context:`o_t = [<span class='current-part'>${fmt(o_t[0])}</span>, <span class='current-part'>${fmt(o_t[1])}</span>]`,
    active:'output'});

  add({phase:8, title:`输出门 o_t = [${fmt(o_t[0])}, ${fmt(o_t[1])}]`,
    calc:`o_t = [<span class='res'>${fmt(o_t[0])}</span>, <span class='res'>${fmt(o_t[1])}</span>]\n→ 约${fmt(o_t[0]*100,1)}%和${fmt(o_t[1]*100,1)}%的细胞状态将被暴露`,
    why:"输出门决定了当前时间步对外输出的信息量。表示比较积极地输出细胞状态信息。",
    context:`<span class='current-part'>o_t = [${fmt(o_t[0])}, ${fmt(o_t[1])}]</span>`,
    active:'output', interpret:"o_t≈0.6 意味着约60%的内部记忆会对外可见。这类似\"我知道很多，但只分享一部分\"。"});

  // ─── PHASE 9: 最终隐藏状态 h_t (Steps 107-118) ───
  add({phase:9, title:"h_t = o_t ⊙ tanh(C_t) — 最终公式",
    calc:`h_t = <span class='val'>o_t ⊙ tanh(C_t)</span>\ntanh(C_t) 将细胞状态压缩到 [-1, 1]\no_t 控制暴露多少`,
    why:"为什么先 tanh 再乘 o_t？因为 C_t 的值可以是任意实数，而 h_t 需要有界输出（给下一时间步和softmax等使用）。tanh 压缩到 [-1,1]，然后 o_t 选择性地暴露。",
    context:`<span class='current-part'>h_t = o_t ⊙ tanh(C_t)</span>`,
    active:'final'});

  add({phase:9, title:"为什么要 tanh(C_t)？",
    calc:`C_t = [${fmt(C_t[0])}, ${fmt(C_t[1])}]\n这些值可以是<span class='val'>任意实数</span>\ntanh 将其压缩到 <span class='val'>[-1, 1]</span>`,
    why:"C_t 是通过加法更新的，理论上可以无限增长。tanh 做两件事：1) 将值压缩到有界范围，防止数值爆炸；2) 提供非线性，增强表达能力。",
    context:`h_t = o_t ⊙ <span class='current-part'>tanh(C_t)</span>`,
    active:'final'});

  add({phase:9, title:`tanh(C_t[0]) = tanh(${fmt(C_t[0])}) = ${fmt(tanh_C[0])}`,
    calc:`tanh(${fmt(C_t[0])}) = (e^{${fmt(C_t[0])}} - e^{${fmt(-C_t[0])}})/(e^{${fmt(C_t[0])}} + e^{${fmt(-C_t[0])}})\n= <span class='res'>${fmt(tanh_C[0])}</span>`,
    why:`${fmt(C_t[0])} 是较小的正数，tanh 接近线性区，结果约等于原值（因为 tanh(0.23)≈0.23）。`,
    context:`tanh(C_t) = [<span class='current-part'>${fmt(tanh_C[0])}</span>, _]`,
    active:'final'});

  add({phase:9, title:`tanh(C_t[1]) = tanh(${fmt(C_t[1])}) = ${fmt(tanh_C[1])}`,
    calc:`tanh(${fmt(C_t[1])}) = <span class='res'>${fmt(tanh_C[1])}</span>`,
    why:`${fmt(C_t[1])} 非常接近0，tanh几乎线性，结果约等于原值。`,
    context:`tanh(C_t) = [${fmt(tanh_C[0])}, <span class='current-part'>${fmt(tanh_C[1])}</span>]`,
    active:'final'});

  add({phase:9, title:`tanh(C_t) 结果 = [${fmt(tanh_C[0])}, ${fmt(tanh_C[1])}]`,
    calc:`tanh(C_t) = [<span class='res'>${fmt(tanh_C[0])}</span>, <span class='res'>${fmt(tanh_C[1])}</span>]`,
    why:"因为 C_t 的值较小，tanh 几乎是线性变换。但如果 C_t 很大（如 >3），tanh 会饱和到接近1或-1。",
    context:`h_t = o_t ⊙ <span class='current-part'>[${fmt(tanh_C[0])}, ${fmt(tanh_C[1])}]</span>`,
    active:'final'});

  add({phase:9, title:`o_t[0] × tanh(C_t)[0] = ${fmt(o_t[0])} × ${fmt(tanh_C[0])} = ${fmt(h_t[0])}`,
    calc:`o_t[0] = <span class='val'>${fmt(o_t[0])}</span>\ntanh(C_t)[0] = <span class='val'>${fmt(tanh_C[0])}</span>\n${fmt(o_t[0])} × ${fmt(tanh_C[0])} = <span class='res'>${fmt(h_t[0])}</span>`,
    why:"第1维暴露了约60%的细胞状态（压缩后）。输出值较小但为正。",
    context:`h_t[0] = <span class='current-part'>${fmt(h_t[0])}</span>`,
    active:'final'});

  add({phase:9, title:`o_t[1] × tanh(C_t)[1] = ${fmt(o_t[1])} × ${fmt(tanh_C[1])} = ${fmt(h_t[1])}`,
    calc:`o_t[1] = <span class='val'>${fmt(o_t[1])}</span>\ntanh(C_t)[1] = <span class='val'>${fmt(tanh_C[1])}</span>\n${fmt(o_t[1])} × ${fmt(tanh_C[1])} = <span class='res'>${fmt(h_t[1])}</span>`,
    why:"第2维暴露了约54%的细胞状态。输出值接近0——因为 C_t[1] 本身就接近0。",
    context:`h_t[1] = <span class='current-part'>${fmt(h_t[1])}</span>`,
    active:'final'});

  add({phase:9, title:`h_t 最终结果 = [${fmt(h_t[0])}, ${fmt(h_t[1])}]`,
    calc:`h_t = [<span class='res'>${fmt(h_t[0])}</span>, <span class='res'>${fmt(h_t[1])}</span>]`,
    why:"h_t 是当前时间步的\"对外输出\"——它将被传递到下一时间步作为 h_{t+1} 的输入，同时也可以被用于预测（如接一个全连接层做分类）。",
    context:`<span class='current-part'>h_t = [${fmt(h_t[0])}, ${fmt(h_t[1])}]</span>`,
    active:'final'});

  add({phase:9, title:"h_t 的意义 — 当前时间步的\"短期记忆\"",
    calc:`h_t 是<span class='val'>对外可见</span>的隐藏状态\n→ 传递给下一时间步\n→ 用于下游任务（分类/预测等）`,
    why:"h_t 是 LSTM 的\"面孔\"——外部世界只能通过 h_t 了解 LSTM 的内部状态。C_t 是\"内心\"，只有 LSTM 自己知道。",
    context:`下一个时间步:\nLSTM(x_{t+1}, <span class='current-part'>h_t</span>, C_t) → h_{t+1}, C_{t+1}`,
    active:'final'});

  add({phase:9, title:"C_t vs h_t 的区别总结",
    calc:`<span class='val'>C_t</span>（细胞状态）= 长期记忆\n  - 通过<span class='val'>加法</span>更新\n  - 梯度可直接流过\n  - 值域无限制\n\n<span class='val'>h_t</span>（隐藏状态）= 短期记忆\n  - 通过<span class='val'>乘法</span>从 C_t 导出\n  - 值域 [-1, 1]（经 tanh）\n  - 对外可见，参与预测`,
    why:"C_t 和 h_t 的分离是 LSTM 的核心设计：C_t 负责长期存储（梯度无损流过），h_t 负责短期输出（选择性暴露）。这让模型既有\"深度记忆\"又有\"灵活输出\"。",
    context:`C_t → 下一时间步的<span class='current-part'>长期记忆</span>\nh_t → 下一时间步的<span class='current-part'>短期记忆</span> + 当前预测`,
    active:'final'});

  add({phase:9, title:"完整 LSTM 一个时间步的所有计算结果汇总",
    calc:`<span class='val'>输入:</span>\n  x_t = [0.5, -0.3, 0.8]\n  h_{t-1} = [0.1, 0.6],  C_{t-1} = [0.8, -0.2]\n  concat = [0.1, 0.6, 0.5, -0.3, 0.8]\n\n<span class='val'>遗忘门:</span>  f_t = [${fmt(f_t[0])}, ${fmt(f_t[1])}]\n<span class='val'>输入门:</span>  i_t = [${fmt(i_t[0])}, ${fmt(i_t[1])}]\n<span class='val'>候选值:</span>   C~_t = [${fmt(C_tilde[0])}, ${fmt(C_tilde[1])}]\n<span class='val'>细胞状态:</span> C_t = [${fmt(C_t[0])}, ${fmt(C_t[1])}]\n<span class='val'>输出门:</span>  o_t = [${fmt(o_t[0])}, ${fmt(o_t[1])}]\n<span class='val'>隐藏状态:</span> h_t = [${fmt(h_t[0])}, ${fmt(h_t[1])}]`,
    why:"一个完整的 LSTM 时间步到此结束。C_t 和 h_t 将被传递到下一个时间步，循环往复，直到处理完整个序列。",
    context:`<span class='current-part'>一个时间步完成！→ 进入 t+1</span>`,
    active:'final', interpret:"你已完整跟踪了 LSTM 内部的每一步计算。从输入拼接、四个门控决策、到细胞状态更新和隐藏状态输出——每个乘法、每个激活、每个\"为什么\"都已展开。这就是 LSTM 的全部内部机制！"});

  return S;
}

const steps = buildSteps();
const totalSteps = steps.length;
const maxStepN = steps[steps.length-1].n;
let currentIdx = 0;
let autoplayTimer = null;

// ============================================================
// SVG DIAGRAM
// ============================================================
function buildSVG(activeRegion){
  const colors = {
    inputs:'#6e7681', concat:'#8b949e', forget:'#e94560',
    input:'#53d8fb', candidate:'#c084fc', cellstate:'#00d98b',
    output:'#f5a623', final:'#ffd700'
  };
  function op(region){ return region === activeRegion ? 1 : 0.2; }
  function gl(region){ return region === activeRegion ? 'filter="url(#glow)"' : ''; }

  const svg = document.getElementById('lstm-svg');
  svg.innerHTML = `
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- Cell State Highway -->
    <line x1="30" y1="42" x2="510" y2="42" stroke="#00d98b" stroke-width="3.5" opacity="${op('cellstate')}" ${gl('cellstate')}/>
    <text x="270" y="26" text-anchor="middle" font-size="12" fill="#00d98b" opacity="${op('cellstate')}">C_{t-1} ─── 细胞状态传送带 ─── C_t</text>
    <text x="18" y="46" font-size="10" fill="#00d98b" opacity="${op('cellstate')}">[0.8,-0.2]</text>
    <text x="475" y="46" font-size="10" fill="#00d98b" opacity="${op('cellstate')}">[${fmt(C_t[0])},${fmt(C_t[1])}]</text>

    <!-- Forget Gate Region -->
    <rect x="75" y="78" width="105" height="180" rx="8" fill="rgba(233,69,96,0.06)" stroke="#e94560" stroke-width="1.5" opacity="${op('forget')}"/>
    <text x="127" y="96" text-anchor="middle" class="gate-label" fill="#e94560" opacity="${op('forget')}">遗忘门 f_t</text>
    <circle cx="127" cy="130" r="16" fill="rgba(233,69,96,0.12)" stroke="#e94560" stroke-width="1.5" opacity="${op('forget')}" ${gl('forget')}/>
    <text x="127" y="135" text-anchor="middle" font-size="14" fill="#e94560" opacity="${op('forget')}">σ</text>
    <text x="127" y="170" text-anchor="middle" font-size="9" fill="#e94560" opacity="${op('forget')}">W_f·concat+b_f</text>
    <text x="127" y="190" text-anchor="middle" font-size="10" fill="#ff6b81" opacity="${op('forget')}">[${fmt(f_t[0])},${fmt(f_t[1])}]</text>
    <circle cx="127" cy="225" r="11" fill="rgba(233,69,96,0.12)" stroke="#e94560" stroke-width="1.2" opacity="${op('forget')}" ${gl('forget')}/>
    <text x="127" y="229" text-anchor="middle" font-size="13" fill="#e94560" opacity="${op('forget')}">×</text>
    <line x1="127" y1="42" x2="127" y2="214" stroke="#e94560" stroke-width="1" stroke-dasharray="4,3" opacity="${op('forget')}"/>

    <!-- Input Gate Region -->
    <rect x="200" y="78" width="105" height="180" rx="8" fill="rgba(83,216,251,0.06)" stroke="#53d8fb" stroke-width="1.5" opacity="${op('input')}"/>
    <text x="252" y="96" text-anchor="middle" class="gate-label" fill="#53d8fb" opacity="${op('input')}">输入门 i_t</text>
    <circle cx="252" cy="130" r="16" fill="rgba(83,216,251,0.12)" stroke="#53d8fb" stroke-width="1.5" opacity="${op('input')}" ${gl('input')}/>
    <text x="252" y="135" text-anchor="middle" font-size="14" fill="#53d8fb" opacity="${op('input')}">σ</text>
    <text x="252" y="170" text-anchor="middle" font-size="9" fill="#53d8fb" opacity="${op('input')}">W_i·concat+b_i</text>

// ============================================================
// RENDER
// ============================================================
function render(idx){
  if(idx<0) idx=0;
  if(idx>=totalSteps) idx=totalSteps-1;
  currentIdx = idx;
  const step = steps[idx];
  const phase = getPhaseForStep(step.n);

  document.getElementById('phase-text').textContent = `Phase ${phase.ci}/9`;
  document.getElementById('step-text').textContent = `Step ${step.n}/${maxStepN}`;
  document.getElementById('phase-name').textContent = phase.name;
  const pct = ((idx+1)/totalSteps*100).toFixed(1);
  const bar = document.getElementById('progress-bar');
  bar.style.width = pct+'%';
  bar.style.background = phase.color;
  document.getElementById('phase-select').value = phase.ci;

  buildSVG(step.active);

  let html = `<div class="fade-in">`;
  html += `<div class="step-number">STEP ${step.n} / ${maxStepN}</div>`;
  html += `<div class="step-title"><span class="phase-badge bg${phase.ci}" style="color:#fff;font-size:11px">P${phase.ci}</span> ${step.title}</div>`;

  html += `<div class="detail-section"><div class="detail-section-title">当前计算</div>`;
  html += `<div class="step-calc">${step.calc}</div></div>`;

  if(step.why){
    html += `<div class="detail-section"><div class="step-why"><span class="label">为什么？</span>${step.why}</div></div>`;
  }
  if(step.context){
    html += `<div class="detail-section"><div class="detail-section-title">在整体公式中的位置</div>`;
    html += `<div class="step-context">${step.context}</div></div>`;
  }
  if(step.running){
    html += `<div class="detail-section"><div class="step-running"><span class="label">累计结果</span><span class="acc mono">${step.running}</span></div></div>`;
  }
  if(step.interpret){
    html += `<div class="detail-section"><div class="step-interpret"><span class="label">解读</span>${step.interpret}</div></div>`;
  }

  html += `</div>`;
  document.getElementById('detail-panel').innerHTML = html;
  document.getElementById('detail-panel').scrollTop = 0;
}

// ============================================================
// NAVIGATION
// ============================================================
function next(){ render(currentIdx+1); }
function prev(){ render(currentIdx-1); }
function jump(d){ render(currentIdx+d); }
function jumpToPhase(ph){
  ph = parseInt(ph);
  const phase = phases[ph];
  const idx = steps.findIndex(s => s.n >= phase.startStep);
  render(idx >= 0 ? idx : 0);
}
function toggleAutoplay(){
  const btn = document.getElementById('autoplay-btn');
  if(autoplayTimer){
    clearInterval(autoplayTimer);
    autoplayTimer = null;
    btn.textContent = '▶ 自动';
    btn.classList.remove('primary');
  } else {
    autoplayTimer = setInterval(()=>{
      if(currentIdx < totalSteps-1) next();
      else toggleAutoplay();
    }, 2000);
    btn.textContent = '⏸ 暂停';
    btn.classList.add('primary');
  }
}

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') next();
  else if(e.key === 'ArrowLeft') prev();
  else if(e.key === 'ArrowUp'){ e.preventDefault(); jump(-5); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); jump(5); }
  else if(e.key === ' '){ e.preventDefault(); toggleAutoplay(); }
});

render(0);
</script>
