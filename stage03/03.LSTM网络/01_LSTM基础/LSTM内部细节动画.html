<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM 内部机制详解</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #e94560;
    --accent2: #53d8fb;
    --accent3: #00d98b;
    --text: #e0e0e0;
    --text-dim: #8888aa;
    --card: #1e2746;
    --border: #2a3a5c;
    --glow-forget: #e94560;
    --glow-input: #53d8fb;
    --glow-output: #f5a623;
    --glow-cell: #00d98b;
    --glow-candidate: #c084fc;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Title */
  .title-bar {
    text-align: center;
    padding: 18px 20px 10px;
    background: linear-gradient(135deg, var(--bg2), var(--bg3));
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .title-bar h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title-bar .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Main layout */
  .main-container {
    display: flex;
    height: calc(100vh - 80px);
    overflow: hidden;
  }

  /* Left: LSTM Diagram */
  .diagram-panel {
    width: 42%;
    min-width: 420px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at center, rgba(15,52,96,0.4) 0%, transparent 70%);
  }

  /* Right: Step details */
  .detail-panel {
    width: 58%;
    padding: 20px 28px;
    overflow-y: auto;
    border-left: 1px solid var(--border);
    background: var(--bg2);
  }
  .detail-panel::-webkit-scrollbar { width: 6px; }
  .detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .detail-panel::-webkit-scrollbar-track { background: transparent; }

  /* SVG Diagram */
  .lstm-svg-container {
    width: 100%;
    max-width: 480px;
  }
  .lstm-svg-container svg { width: 100%; height: auto; }

  /* Step indicator */
  .step-indicator {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
  }
  .step-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.4s ease;
    cursor: pointer;
  }
  .step-dot.active {
    background: var(--accent2);
    box-shadow: 0 0 10px var(--accent2);
    transform: scale(1.3);
  }
  .step-dot:hover { transform: scale(1.2); }

  /* Step content */
  .step-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 500;
  }
  .step-desc {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* Formula box */
  .formula-box {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .formula-box .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .formula {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 17px;
    line-height: 1.7;
    color: #fff;
    white-space: pre-wrap;
  }
  .formula .op { color: var(--accent2); }
  .formula .fn { color: var(--accent3); font-weight: 700; }
  .formula .dim { color: var(--accent); font-size: 12px; vertical-align: sub; }
  .formula .highlight {
    padding: 1px 4px;
    border-radius: 3px;
    background: rgba(83, 216, 251, 0.15);
  }

  /* Numerical example */
  .numerical-box {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 14px;
  }
  .numerical-box .label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .num-row {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.8;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .num-row .varname {
    color: var(--accent2);
    min-width: 70px;
    text-align: right;
  }
  .num-row .eq { color: var(--text-dim); }
  .num-row .val { color: #fff; }
  .num-row .note { color: var(--text-dim); font-size: 12px; margin-left: 8px; }

  /* Intuition box */
  .intuition-box {
    background: linear-gradient(135deg, rgba(0,217,139,0.08), rgba(83,216,251,0.08));
    border: 1px solid rgba(0,217,139,0.3);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 14px;
  }
  .intuition-box .label {
    font-size: 12px;
    color: var(--accent3);
    margin-bottom: 6px;
    font-weight: 700;
  }
  .intuition-box p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  /* Matrix display */
  .matrix-display {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    line-height: 1.5;
    color: #ccc;
    margin: 6px 0;
    white-space: pre;
  }
  .matrix-display .bracket { color: var(--text-dim); }
  .matrix-display .num { color: #fff; }
  .matrix-display .pos { color: var(--accent3); }
  .matrix-display .neg { color: var(--accent); }

  /* Small curve plot */
  .curve-container {
    display: inline-block;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin: 8px 0;
  }
  .curve-container canvas { display: block; }

  /* Navigation */
  .nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 52px;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    z-index: 100;
    padding-bottom: 4px;
  }
  .nav-btn {
    padding: 8px 28px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.25s ease;
    user-select: none;
  }
  .nav-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn.primary {
    background: linear-gradient(135deg, var(--bg3), #1a5276);
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .nav-btn.primary:hover { background: var(--bg3); }
  .step-counter {
    color: var(--text-dim);
    font-size: 13px;
    min-width: 60px;
    text-align: center;
  }

  /* Animated elements */
  .fade-in { animation: fadeIn 0.5s ease forwards; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .pulse-glow {
    animation: pulseGlow 1.5s ease-in-out infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 3px currentColor); }
    50% { filter: drop-shadow(0 0 12px currentColor); }
  }

  /* Data flow animation on SVG */
  .flow-particle {
    fill: var(--accent2);
    opacity: 0;
  }
  .flow-particle.animate {
    animation: flowMove 1.5s ease-in-out infinite;
  }

  /* Color coding for forget/keep */
  .tag-forget {
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
  }
  .tag-keep {
    color: var(--accent3);
    font-weight: 700;
    font-size: 13px;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .main-container { flex-direction: column; height: auto; }
    .diagram-panel, .detail-panel { width: 100%; min-width: unset; }
    .diagram-panel { min-height: 360px; }
    .detail-panel { border-left: none; border-top: 1px solid var(--border); min-height: 400px; }
  }
</style>
</head>
<body>

<div class="title-bar">
  <h1>LSTM 内部机制详解</h1>
  <div class="subtitle">长短期记忆网络 — 逐步动画演示与矩阵计算</div>
</div>

<div class="main-container">
  <!-- Left: LSTM Diagram -->
  <div class="diagram-panel">
    <div class="lstm-svg-container" id="svgContainer"></div>
    <div class="step-indicator" id="stepIndicator"></div>
  </div>

  <!-- Right: Step Details -->
  <div class="detail-panel" id="detailPanel">
    <!-- Dynamic content injected by JS -->
  </div>
</div>

<!-- Navigation -->
<div class="nav-bar">
  <button class="nav-btn" id="btnPrev" onclick="prevStep()">上一步</button>
  <span class="step-counter" id="stepCounter">0 / 4</span>
  <button class="nav-btn primary" id="btnNext" onclick="nextStep()">下一步</button>
  <button class="nav-btn" onclick="resetSteps()">重置</button>
</div>

<script>
// ============ CONSTANTS & NUMERICAL DATA ============
const d = 3, h = 2;

// Inputs
const x_t = [0.5, -0.3, 0.8];
const h_prev = [0.1, 0.6];
const C_prev = [0.8, -0.2];

// Concatenated input [h_{t-1}, x_t]
const concat = [...h_prev, ...x_t]; // [0.1, 0.6, 0.5, -0.3, 0.8]

// Weight matrices (2x5)
const W_f = [[0.2, -0.1, 0.3, 0.1, -0.2],
             [0.1,  0.4,-0.2, 0.3,  0.1]];
const b_f = [0.0, 0.0];

const W_i = [[ 0.3, 0.1,-0.1, 0.2, 0.4],
             [-0.2, 0.3, 0.5, 0.1,-0.1]];
const b_i = [0.1, -0.1];

const W_C = [[ 0.1,-0.3, 0.2, 0.4,-0.1],
             [ 0.5, 0.2,-0.4, 0.1, 0.3]];
const b_C = [0.0, 0.1];

const W_o = [[-0.1, 0.2, 0.3,-0.2, 0.1],
             [ 0.4,-0.1, 0.2, 0.3, 0.2]];
const b_o = [0.0, 0.0];

// ============ MATH HELPERS ============
function matVecMul(M, v) {
  return M.map(row => row.reduce((s, w, j) => s + w * v[j], 0));
}
function vecAdd(a, b) { return a.map((v, i) => v + b[i]); }
function sigmoid(z) { return 1 / (1 + Math.exp(-z)); }
function tanh_fn(z) { return Math.tanh(z); }
function hadamard(a, b) { return a.map((v, i) => v * b[i]); }

function fmt(v, decimals=4) {
  return v.toFixed(decimals);
}
function fmtArr(arr, decimals=4) {
  return '[ ' + arr.map(v => fmt(v, decimals)).join(', ') + ' ]';
}

// ============ COMPUTE ALL VALUES ============
const f_t = vecAdd(matVecMul(W_f, concat), b_f).map(sigmoid);
const i_t = vecAdd(matVecMul(W_i, concat), b_i).map(sigmoid);
const C_tilde = vecAdd(matVecMul(W_C, concat), b_C).map(tanh_fn);
const C_t = vecAdd(hadamard(f_t, C_prev), hadamard(i_t, C_tilde));
const o_t = vecAdd(matVecMul(W_o, concat), b_o).map(sigmoid);
const tanh_Ct = C_t.map(tanh_fn);
const h_t = hadamard(o_t, tanh_Ct);

// Intermediate raw values (before activation)
const f_raw = vecAdd(matVecMul(W_f, concat), b_f);
const i_raw = vecAdd(matVecMul(W_i, concat), b_i);
const C_raw = vecAdd(matVecMul(W_C, concat), b_C);
const o_raw = vecAdd(matVecMul(W_o, concat), b_o);

// ============ STEP DEFINITIONS ============
const steps = [
  // Step 0
  {
    title: '输入准备',
    badge: 'Step 0',
    badgeColor: '#8888aa',
    desc: 'LSTM 在时间步 t 接收两个输入：当前输入向量 x_t 和上一时刻的隐藏状态 h_{t-1}。LSTM 的核心操作是将二者拼接后统一处理。',
    formulaSection: function() {
      return `
        <div class="formula-box">
          <div class="label">维度说明</div>
          <div class="formula">
<span class="highlight">x_t</span> ∈ R<sup><span class="dim">d</span></sup>    d = ${d} (输入维度)
<span class="highlight">h_{t-1}</span> ∈ R<sup><span class="dim">h</span></sup>    h = ${h} (隐藏维度)
<span class="highlight">[h_{t-1}, x_t]</span> ∈ R<sup><span class="dim">d+h</span></sup> = R<sup><span class="dim">${d+h}</span></sup>  (拼接后)

拼接操作：
  <span class="op">concat</span> = [ h<sub>t-1</sub> , x<sub>t</sub> ]
       = [ ${fmtArr(h_prev)} , ${fmtArr(x_t)} ]
       = ${fmtArr(concat)}
          </div>
        </div>`;
    },
    numericalSection: function() {
      return `
        <div class="numerical-box">
          <div class="label">数值示例</div>
          <div class="num-row"><span class="varname">x_t</span><span class="eq">=</span><span class="val">${fmtArr(x_t)}</span><span class="note">← 当前输入 (d=${d})</span></div>
          <div class="num-row"><span class="varname">h_{t-1}</span><span class="eq">=</span><span class="val">${fmtArr(h_prev)}</span><span class="note">← 上一步隐藏状态 (h=${h})</span></div>
          <div class="num-row"><span class="varname">C_{t-1}</span><span class="eq">=</span><span class="val">${fmtArr(C_prev)}</span><span class="note">← 上一步细胞状态</span></div>
          <div class="num-row"><span class="varname">concat</span><span class="eq">=</span><span class="val">${fmtArr(concat)}</span><span class="note">← 拼接后维度 = ${d+h}</span></div>
        </div>`;
    },
    intuitionSection: function() {
      return `
        <div class="intuition-box">
          <div class="label">直觉理解</div>
          <p>LSTM 把「上一步的输出 h」和「这一步的输入 x」拼在一起，作为一个整体送给所有门。<br>
          这样每个门都能同时参考"历史记忆"和"当前信息"，做出更智能的决策。<br>
          所有权重矩阵 W 的列数都是 ${d+h}，行数都是 ${h}，这样才能与拼接向量相乘。</p>
        </div>`;
    },
    svgHighlight: 'input'
  },
  // Step 1
  {
    title: '遗忘门 (Forget Gate)',
    badge: 'Step 1',
    badgeColor: '#e94560',
    desc: '遗忘门决定从旧细胞状态 C_{t-1} 中丢弃哪些信息。输出 f_t 中每个元素接近 0 表示"遗忘"，接近 1 表示"保留"。',
    formulaSection: function() {
      return `
        <div class="formula-box">
          <div class="label">遗忘门公式</div>
          <div class="formula">
<span class="fn">f_t</span> = <span class="fn">σ</span>( W<sub>f</sub> · [h<sub>t-1</sub>, x<sub>t</sub>] + b<sub>f</sub> )

  W<sub>f</sub> ∈ R<sup><span class="dim">${h}×${d+h}</span></sup> , b<sub>f</sub> ∈ R<sup><span class="dim">${h}</span></sup>

  <span class="fn">σ</span>(z) = 1 / (1 + e<sup>-z</sup>)    ← Sigmoid 函数

  <span class="tag-forget">f_t ≈ 0 → 遗忘</span>     <span class="tag-keep">f_t ≈ 1 → 保留</span>
          </div>
        </div>
        <div class="curve-container">
          <canvas id="sigmoidCurve" width="240" height="120"></canvas>
        </div>`;
    },
    numericalSection: function() {
      return `
        <div class="numerical-box">
          <div class="label">逐步计算</div>
          <div class="num-row"><span class="varname">W_f · concat</span><span class="eq">=</span><span class="val">${fmtArr(matVecMul(W_f, concat))}</span></div>
          <div class="num-row"><span class="varname">+ b_f</span><span class="eq">=</span><span class="val">${fmtArr(f_raw)}</span><span class="note">← sigmoid 输入</span></div>
          <div class="num-row"><span class="varname">σ(...)</span><span class="eq">=</span><span class="val" style="color:var(--accent)">${fmtArr(f_t)}</span><span class="note">← 遗忘门输出</span></div>
        </div>
        <div class="numerical-box">
          <div class="label">权重矩阵 W_f (${h}×${d+h})</div>
          <div class="matrix-display">${matrixToString(W_f)}</div>
        </div>`;
    },
    intuitionSection: function() {
      return `
        <div class="intuition-box">
          <div class="label">直觉理解</div>
          <p>遗忘门就像一个"选择性擦除器"：它对细胞状态中的每个值逐一判断——这个信息还有用吗？<br>
          Sigmoid 把输出压缩到 [0,1]：<br>
          &bull; <span class="tag-forget">接近 0 = 大力遗忘</span>（乘以旧状态后值接近0，相当于删掉）<br>
          &bull; <span class="tag-keep">接近 1 = 完全保留</span>（旧状态原样保留）<br><br>
          在我们的例子中，f_t = ${fmtArr(f_t)}，<br>
          第1维 ${fmt(f_t[0])} → 较强保留，第2维 ${fmt(f_t[1])} → 较强保留。</p>
        </div>`;
    },
    svgHighlight: 'forget'
  },
  // Step 2
  {
    title: '输入门 (Input Gate)',
    badge: 'Step 2',
    badgeColor: '#53d8fb',
    desc: '输入门决定哪些新信息将被写入细胞状态。它包含两部分：i_t 控制写入多少，C_tilde 提供写入的候选内容。',
    formulaSection: function() {
      return `
        <div class="formula-box">
          <div class="label">输入门公式</div>
          <div class="formula">
<span class="fn">i_t</span> = <span class="fn">σ</span>( W<sub>i</sub> · [h<sub>t-1</sub>, x<sub>t</sub>] + b<sub>i</sub> )
          <span class="note" style="color:var(--text-dim);font-size:13px">← 控制写入量</span>

<span class="fn">C̃_t</span> = <span class="fn">tanh</span>( W<sub>C</sub> · [h<sub>t-1</sub>, x<sub>t</sub>] + b<sub>C</sub> )
          <span class="note" style="color:var(--text-dim);font-size:13px">← 候选新内容</span>

  W<sub>i</sub>, W<sub>C</sub> ∈ R<sup><span class="dim">${h}×${d+h}</span></sup>

  <span class="fn">tanh</span>(z) = (e<sup>z</sup> - e<sup>-z</sup>) / (e<sup>z</sup> + e<sup>-z</sup>)    ∈ [-1, +1]
          </div>
        </div>
        <div class="curve-container">
          <canvas id="tanhCurve" width="240" height="120"></canvas>
        </div>`;
    },
    numericalSection: function() {
      return `
        <div class="numerical-box">
          <div class="label">输入门 i_t 计算</div>
          <div class="num-row"><span class="varname">W_i · concat</span><span class="eq">=</span><span class="val">${fmtArr(matVecMul(W_i, concat))}</span></div>
          <div class="num-row"><span class="varname">+ b_i</span><span class="eq">=</span><span class="val">${fmtArr(i_raw)}</span></div>
          <div class="num-row"><span class="varname">σ(...)</span><span class="eq">=</span><span class="val" style="color:var(--accent2)">${fmtArr(i_t)}</span><span class="note">← 输入门输出</span></div>
        </div>
        <div class="numerical-box">
          <div class="label">候选值 C̃_t 计算</div>
          <div class="num-row"><span class="varname">W_C · concat</span><span class="eq">=</span><span class="val">${fmtArr(matVecMul(W_C, concat))}</span></div>
          <div class="num-row"><span class="varname">+ b_C</span><span class="eq">=</span><span class="val">${fmtArr(C_raw)}</span></div>
          <div class="num-row"><span class="varname">tanh(...)</span><span class="eq">=</span><span class="val" style="color:var(--glow-candidate)">${fmtArr(C_tilde)}</span><span class="note">← 候选新值</span></div>
        </div>
        <div class="numerical-box">
          <div class="label">权重矩阵</div>
          <div style="display:flex;gap:20px;flex-wrap:wrap;">
            <div><div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">W_i (${h}×${d+h})</div><div class="matrix-display">${matrixToString(W_i)}</div></div>
            <div><div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">W_C (${h}×${d+h})</div><div class="matrix-display">${matrixToString(W_C)}</div></div>
          </div>
        </div>`;
    },

// ============ MATRIX DISPLAY HELPER ============
function matrixToString(M) {
  return M.map(row => {
    return '[ ' + row.map(v => {
      const s = v >= 0 ? ' ' + fmt(v,1) : fmt(v,1);
      return `<span class="${v >= 0 ? 'pos' : 'neg'}">${s}</span>`;
    }).join(', ') + ' ]';
  }).join('\n');
}

    'text-anchor': 'end' }, hLine).textContent = 'x_t';

  // x_t routing
  el('line', { x1: 80, y1: 300, x2: 80, y2: 330, stroke: '#5a6a8a', 'stroke-width': 1.5 }, hLine);
  el('line', { x1: 80, y1: 330, x2: 380, y2: 330, stroke: '#5a6a8a', 'stroke-width': 1 }, hLine);
  // Branch up from x line to gates
  el('line', { x1: 110, y1: 330, x2: 110, y2: 170, stroke: '#5a6a8a', 'stroke-width': 0.8, 'stroke-dasharray': '4,3' }, hLine);
  el('line', { x1: 145, y1: 330, x2: 145, y2: 170, stroke: '#5a6a8a', 'stroke-width': 0.8, 'stroke-dasharray': '4,3' }, hLine);
  el('line', { x1: 220, y1: 330, x2: 220, y2: 185, stroke: '#5a6a8a', 'stroke-width': 0.8, 'stroke-dasharray': '4,3' }, hLine);
  el('line', { x1: 315, y1: 330, x2: 315, y2: 185, stroke: '#5a6a8a', 'stroke-width': 0.8, 'stroke-dasharray': '4,3' }, hLine);

  // h_t output
  el('line', { x1: 355, y1: 260, x2: 440, y2: 260, stroke: '#f5a623', 'stroke-width': 2.5,
    'marker-end': 'url(#arrow)' }, hLine);
  el('text', { x: 448, y: 257, fill: '#f5a623', 'font-size': 11, 'font-family': 'monospace' }, hLine).textContent = 'h_t';

  // Line from output multiply to h_t
  el('line', { x1: 355, y1: 268, x2: 355, y2: 260, stroke: '#f5a623', 'stroke-width': 2 }, hLine);

  // ---- Concat label ----
  el('text', { x: 55, y: 225, fill: '#5a6a8a', 'font-size': 10, 'text-anchor': 'middle',
    'font-style': 'italic' }, svg).textContent = 'concat';

  // Store SVG for later highlight manipulation
  container.innerHTML = '';
  container.appendChild(svg);
}

// ============ HIGHLIGHT LOGIC ============
const highlightMap = {
  'input': {
    ids: ['fTGate', 'iTGate', 'candidateG', 'outputGateG'],
    glowColor: '#8899bb'
  },
  'forget': {
    ids: ['forgetGateG', 'fTGate'],
    glowColor: '#e94560'
  },
  'inputGate': {
    ids: ['inputGateG', 'iTGate', 'candidateG'],
    glowColor: '#53d8fb'
  },
  'cell': {
    ids: ['forgetGateG', 'inputGateG', 'cellLine'],
    glowColor: '#00d98b'
  },
  'output': {
    ids: ['outputGateG', 'tanhOutG'],
    glowColor: '#f5a623'
  }
};

function highlightStep(stepKey) {
  // Remove all highlights first
  document.querySelectorAll('.gate-group, #cellLine, #tanhOutG, #hLine, #forgetGateG, #inputGateG, #outputGateG, #candidateG, #fTGate, #iTGate').forEach(g => {
    g.style.filter = '';
    g.style.opacity = '0.45';
  });

  // Highlight active
  const map = highlightMap[stepKey];
  if (!map) return;
  map.ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.style.opacity = '1';
      el.style.filter = `drop-shadow(0 0 8px ${map.glowColor})`;
    }
  });

  // Always show cell line prominently for cell step
  if (stepKey === 'cell') {
    const cl = document.getElementById('cellLine');
    if (cl) {
      cl.style.opacity = '1';
      cl.style.filter = 'drop-shadow(0 0 12px #00d98b)';
    }
  }
  if (stepKey === 'output') {
    const hl = document.getElementById('hLine');
    if (hl) {
      hl.style.opacity = '1';
      hl.style.filter = 'drop-shadow(0 0 8px #f5a623)';
    }
  }
}

// ============ CURVE DRAWING ============
function drawSigmoid(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, w, h);

  // Axes
  ctx.strokeStyle = '#3a4a6c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(20, h/2); ctx.lineTo(w-10, h/2);
  ctx.moveTo(w/2, 10); ctx.lineTo(w/2, h-10);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#8888aa';
  ctx.font = '10px monospace';
  ctx.fillText('z', w-15, h/2 - 5);
  ctx.fillText('σ(z)', w/2 + 5, 15);
  ctx.fillText('0', w/2 - 12, h/2 + 12);
  ctx.fillText('1', w/2 + 5, 18);

  // Sigmoid curve
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let px = 20; px < w - 10; px++) {
    const z = (px - w/2) / 25;
    const val = 1 / (1 + Math.exp(-z));
    const py = h/2 - val * (h/2 - 15) + 15;
    if (px === 20) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Dash lines for 0 and 1
  ctx.strokeStyle = '#444466';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(20, 15); ctx.lineTo(w-10, 15);
  ctx.moveTo(20, h - 15); ctx.lineTo(w-10, h - 15);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#e94560';
  ctx.font = '9px monospace';
  ctx.fillText('1', 8, 18);
  ctx.fillText('0', 8, h - 12);
}

function drawTanh(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, w, h);

  // Axes
  ctx.strokeStyle = '#3a4a6c';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(20, h/2); ctx.lineTo(w-10, h/2);
  ctx.moveTo(w/2, 10); ctx.lineTo(w/2, h-10);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#8888aa';
  ctx.font = '10px monospace';
  ctx.fillText('z', w-15, h/2 - 5);
  ctx.fillText('tanh(z)', w/2 + 5, 15);

  // Tanh curve
  ctx.strokeStyle = '#c084fc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let px = 20; px < w - 10; px++) {
    const z = (px - w/2) / 25;
    const val = Math.tanh(z);
    const py = h/2 - val * (h/2 - 15);
    if (px === 20) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // Dashes
  ctx.strokeStyle = '#444466';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(20, 15); ctx.lineTo(w-10, 15);
  ctx.moveTo(20, h - 15); ctx.lineTo(w-10, h - 15);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#c084fc';
  ctx.font = '9px monospace';
  ctx.fillText('+1', 4, 18);
  ctx.fillText('-1', 4, h - 10);
}

// ============ STEP INDICATOR ============
function buildStepIndicator() {
  const container = document.getElementById('stepIndicator');
  container.innerHTML = '';
  steps.forEach((s, i) => {
    const dot = document.createElement('div');
    dot.className = 'step-dot' + (i === currentStep ? ' active' : '');
    dot.onclick = () => goToStep(i);
    dot.title = s.title;
    container.appendChild(dot);
  });
}

// ============ RENDER STEP ============
let currentStep = 0;

function renderStep(idx) {
  currentStep = idx;
  const step = steps[idx];
  const panel = document.getElementById('detailPanel');

  panel.innerHTML = `
    <div class="fade-in">
      <div class="step-title">
        <span class="step-badge" style="background:${step.badgeColor}22;color:${step.badgeColor};border:1px solid ${step.badgeColor}">${step.badge}</span>
        ${step.title}
      </div>
      <div class="step-desc">${step.desc}</div>
      ${step.formulaSection()}
      ${step.numericalSection()}
      ${step.intuitionSection()}
    </div>
  `;

  // Draw curves after DOM update
  if (idx === 1) setTimeout(() => drawSigmoid('sigmoidCurve'), 50);
  if (idx === 2) setTimeout(() => drawTanh('tanhCurve'), 50);

  // Highlight SVG
  highlightStep(step.svgHighlight);

  // Update step indicator
  buildStepIndicator();

  // Update nav
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx === steps.length - 1;
  document.getElementById('stepCounter').textContent = `${idx} / ${steps.length - 1}`;
}

// ============ NAVIGATION ============
function nextStep() {
  if (currentStep < steps.length - 1) renderStep(currentStep + 1);
}
function prevStep() {
  if (currentStep > 0) renderStep(currentStep - 1);
}
function goToStep(i) {
  if (i >= 0 && i < steps.length) renderStep(i);
}
function resetSteps() {
  renderStep(0);
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
});

// ============ INIT ============
buildSVG();
renderStep(0);
</script>
