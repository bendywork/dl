<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word2Vec 基本理解 — 交互式动画演示</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --blue:      #58a6ff;
      --green:     #3fb950;
      --orange:    #d29922;
      --purple:    #bc8cff;
      --pink:      #ff7b72;
      --teal:      #39d353;
      --accent:    #1f6feb;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 600; color: var(--blue); }
    .step-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: .85rem;
      color: var(--muted);
    }
    .step-badge span { color: var(--blue); font-weight: 700; }

    /* ── Progress bar ── */
    .progress-bar {
      height: 3px;
      background: var(--surface2);
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--purple));
      transition: width .5s ease;
    }

    /* ── Main layout ── */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Left panel ── */
    .left-panel {
      width: 360px;
      min-width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 28px 24px;
      gap: 20px;
      overflow-y: auto;
    }
    .module-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 4px;
    }
    .module-title {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .module-desc {
      font-size: .9rem;
      color: var(--muted);
      line-height: 1.7;
    }
    .highlight-box {
      background: var(--surface2);
      border-left: 3px solid var(--blue);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      font-size: .85rem;
      line-height: 1.6;
    }
    .highlight-box.orange { border-color: var(--orange); }
    .highlight-box.green  { border-color: var(--green); }
    .highlight-box.purple { border-color: var(--purple); }
    .tag {
      display: inline-block;
      background: rgba(88,166,255,.15);
      color: var(--blue);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: .78rem;
      font-family: monospace;
    }

    /* ── Right panel ── */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
      position: relative;
    }

    /* Each module's canvas */
    .module-scene {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn .4s ease;
    }
    .module-scene.active { display: flex; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    /* ── Footer nav ── */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-dots { display: flex; gap: 8px; }
    .nav-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: background .3s, transform .2s;
    }
    .nav-dot.active { background: var(--blue); transform: scale(1.3); }
    .btn {
      padding: 8px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      transition: background .2s, opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #388bfd; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-group { display: flex; gap: 10px; }

    /* =========================================================
       MODULE 1 — One-Hot 编码
    ========================================================= */
    .onehot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 640px;
    }
    .vocab-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .vocab-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: .95rem;
      transition: all .3s;
    }
    .vocab-chip.highlight-apple { border-color: #ff7b72; background: rgba(255,123,114,.12); color: #ff7b72; }
    .vocab-chip.highlight-banana { border-color: #d29922; background: rgba(210,153,34,.12); color: #d29922; }

    .onehot-vectors {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
    }
    .vector-row {
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity .5s, transform .5s;
    }
    .vector-row.show { opacity: 1; transform: none; }
    .vector-label {
      width: 50px;
      text-align: right;
      font-weight: 700;
      font-size: .95rem;
    }
    .vector-label.apple { color: #ff7b72; }
    .vector-label.banana { color: #d29922; }
    .vec-cells { display: flex; gap: 5px; }
    .vec-cell {
      width: 44px; height: 44px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      transition: background .4s, transform .3s;
    }
    .vec-cell.zero { background: var(--surface2); color: var(--muted); }
    .vec-cell.one  { background: rgba(88,166,255,.25); color: var(--blue); border: 1.5px solid var(--blue); transform: scale(1.15); }
    .vec-cell.one.apple  { background: rgba(255,123,114,.25); color: #ff7b72; border-color: #ff7b72; }
    .vec-cell.one.banana { background: rgba(210,153,34,.25); color: #d29922; border-color: #d29922; }

    .dot-product-row {
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transition: opacity .5s;
      font-size: .9rem;
    }
    .dot-product-row.show { opacity: 1; }
    .dot-eq {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-family: monospace;
      font-size: 1rem;
    }
    .dot-zero { color: var(--pink); font-weight: 700; font-size: 1.3rem; }
    .problem-box {
      background: rgba(255,123,114,.08);
      border: 1px solid rgba(255,123,114,.3);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: .9rem;
      line-height: 1.6;
      text-align: center;
      opacity: 0;
      transition: opacity .5s;
    }
    .problem-box.show { opacity: 1; }
    .problem-box em { color: var(--pink); font-style: normal; font-weight: 700; }

    /* =========================================================
       MODULE 2 — 词向量 2D
    ========================================================= */
    .m2-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }
    .compression-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: .85rem;
      color: var(--muted);
      opacity: 0;
      transition: opacity .6s;
    }
    .compression-row.show { opacity: 1; }
    .compress-vec {
      display: flex;
      gap: 4px;
    }
    .compress-cell {
      width: 28px; height: 28px;
      border-radius: 4px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem;
      font-family: monospace;
      transition: background .4s;
    }
    .compress-cell.lit { background: rgba(88,166,255,.2); border-color: var(--blue); color: var(--blue); }
    .arrow-anim {
      font-size: 1.4rem;
      color: var(--blue);
      animation: pulse-arrow 1.2s infinite;
    }
    @keyframes pulse-arrow {
      0%,100% { opacity:.4; transform:translateX(0); }
      50% { opacity:1; transform:translateX(4px); }
    }
    .compress-result {
      display: flex;
      gap: 4px;
    }
    .compress-r-cell {
      width: 38px; height: 38px;
      border-radius: 6px;
      background: rgba(63,185,80,.15);
      border: 1.5px solid var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem;
      font-family: monospace;
      color: var(--green);
      font-weight: 700;
    }

    #scatter-canvas {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
      cursor: crosshair;
    }

    /* =========================================================
       MODULE 3 — 余弦相似度
    ========================================================= */
    .m3-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    #cosine-canvas {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
    }
    .cosine-table {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .cosine-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      text-align: center;
      font-size: .85rem;
      min-width: 110px;
      transition: border-color .3s, transform .3s;
    }
    .cosine-card.active { border-color: var(--blue); transform: scale(1.05); }
    .cosine-card .pair { color: var(--muted); font-size: .8rem; }
    .cosine-card .score { font-size: 1.2rem; font-weight: 700; margin-top: 4px; }
    .cosine-card .score.high { color: var(--green); }
    .cosine-card .score.low  { color: var(--orange); }

    /* =========================================================
       MODULE 4 — 训练流程
    ========================================================= */
    .m4-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 680px;
    }
    .pipeline {
      display: flex;
      align-items: center;
      gap: 0;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0;
    }
    .pipe-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .5s, transform .5s;
    }
    .pipe-step.show { opacity: 1; transform: none; }
    .pipe-icon {
      width: 60px; height: 60px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      transition: border-color .2s, background .2s, transform .2s;
    }
    .pipe-step:hover .pipe-icon,
    .pipe-step.expanded .pipe-icon {
      border-color: var(--blue);
      background: rgba(88,166,255,.1);
      transform: scale(1.1);
    }
    .pipe-label { font-size: .78rem; color: var(--muted); text-align: center; max-width: 70px; }
    .pipe-arrow {
      font-size: 1.4rem;
      color: var(--border);
      margin: 0 4px;
      padding-bottom: 22px;
      opacity: 0;
      transition: opacity .5s;
    }
    .pipe-arrow.show { opacity:1; }

    .step-detail {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--blue);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: .87rem;
      line-height: 1.7;
      min-height: 80px;
      display: none;
      animation: fadeIn .3s ease;
    }
    .step-detail.visible { display: block; }
    .step-detail .detail-title { color: var(--blue); font-weight: 700; margin-bottom: 6px; }

    .window-demo {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .wtoken {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: .85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all .3s;
    }
    .wtoken.center { background: rgba(88,166,255,.2); border-color: var(--blue); color: var(--blue); font-weight:700; }
    .wtoken.context { background: rgba(63,185,80,.15); border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>

<header>
  <h1>Word2Vec 基本理解</h1>
  <div class="step-badge">步骤 <span id="step-current">1</span> / <span id="step-total">4</span></div>
</header>
<div class="progress-bar">
  <div class="progress-fill" id="progress-fill" style="width:25%"></div>
</div>

<main>
  <!-- ── Left panel ── -->
  <div class="left-panel" id="left-panel">
    <!-- filled by JS -->
  </div>

  <!-- ── Right panel ── -->
  <div class="right-panel">

    <!-- MODULE 1 -->
    <div class="module-scene active" id="scene-1">
      <div class="onehot-container">
        <div class="vocab-row" id="vocab-row">
          <!-- chips injected by JS -->
        </div>
        <div class="onehot-vectors" id="onehot-vectors"></div>
        <div class="dot-product-row" id="dot-row">
          <div class="dot-eq">苹果 · 香蕉 = <span style="color:var(--muted)">0×0 + 1×0 + 0×0 + 0×0 + 0×1</span> = <span class="dot-zero">0</span></div>
        </div>
        <div class="problem-box" id="problem-box">
          点积为 <em>0</em>，表示两个词<em>完全不相关</em>。<br/>
          但"苹果"和"香蕉"明明都是水果，应该相似才对！<br/>
          One-Hot 编码<em>无法捕捉语义相似性</em>。
        </div>
      </div>
    </div>

    <!-- MODULE 2 -->
    <div class="module-scene" id="scene-2">
      <div class="m2-container">
        <div class="compression-row" id="compress-row">
          <span style="color:var(--muted);font-size:.85rem;">One-Hot (5维)</span>
          <div class="compress-vec" id="compress-onehot"></div>
          <div class="arrow-anim">→</div>
          <span style="color:var(--muted);font-size:.85rem;">词向量 (2维)</span>
          <div class="compress-result" id="compress-result"></div>
        </div>
        <canvas id="scatter-canvas" width="520" height="380"></canvas>
        <p style="font-size:.8rem;color:var(--muted);">鼠标悬停词点查看向量数值</p>
      </div>
    </div>

    <!-- MODULE 3 -->
    <div class="module-scene" id="scene-3">
      <div class="m3-container">
        <canvas id="cosine-canvas" width="480" height="320"></canvas>
        <div class="cosine-table" id="cosine-table"></div>
        <p style="font-size:.8rem;color:var(--muted);">以"苹果"为基准，查看与各词的余弦相似度</p>
      </div>
    </div>

    <!-- MODULE 4 -->
    <div class="module-scene" id="scene-4">
      <div class="m4-container">
        <div class="pipeline" id="pipeline"></div>
        <div class="step-detail" id="step-detail">
          <div class="detail-title" id="detail-title"></div>
          <div id="detail-body"></div>
        </div>
        <p style="font-size:.8rem;color:var(--muted);">点击每个步骤查看详细说明</p>
      </div>
    </div>

  </div>
</main>

<footer>
  <button class="btn btn-secondary" id="btn-prev" disabled>← 上一步</button>
  <div class="nav-dots" id="nav-dots"></div>
  <button class="btn btn-primary" id="btn-next">下一步 →</button>
</footer>

<script>
// ─── Data ──────────────────────────────────────────────────────────────────
const VOCAB = ["苹果","香蕉","手机","电脑","猫"];
const COLORS = ["#ff7b72","#d29922","#58a6ff","#bc8cff","#3fb950"];

// 2D word vectors (hand-crafted for nice layout)
const WORD_VECS = {
  "苹果": [ 0.85,  0.75],
  "香蕉": [ 0.72,  0.88],
  "手机": [-0.80,  0.70],
  "电脑": [-0.92,  0.55],
  "猫":   [ 0.10,  0.20],
};

// ─── State ─────────────────────────────────────────────────────────────────
let currentStep = 1;
const TOTAL = 4;

// Module-1 sub-steps
let m1Sub = 0; // 0=vocab shown, 1=apple vec, 2=banana vec, 3=dot, 4=problem

// Module-2 sub-steps
let m2Ready = false;
let m2HoverWord = null;

// Module-3
let m3AnimFrame = null;
let m3Angle = { apple_banana: 0, apple_phone: 0, apple_pc: 0, apple_cat: 0 };
let m3AnimDone = false;

// Module-4
let m4PipeShown = 0;
let m4Expanded = -1;

// ─── Left panel content ────────────────────────────────────────────────────
const LEFT_CONTENT = [
  {
    label: "模块 1",
    title: "One-Hot 编码的致命缺陷",
    desc: "最直觉的词表示方法：给每个词分配一个唯一的整数位置，该位置置1，其余全0。\n\n这种方式极其简单，但有一个根本性问题。",
    box: { color: "", text: "词表大小 = 向量维度。10万词汇表 → 10万维稀疏向量，计算代价极高，且无法表达任何语义关系。" },
    note: "关键洞察：两个词的 One-Hot 向量点积永远为 0——无论它们多相似，模型都「认为」它们完全不相关。"
  },
  {
    label: "模块 2",
    title: "词向量：低维稠密表示",
    desc: "Word2Vec 的核心思想：把每个词映射到一个低维稠密向量（如 2D / 300D）。\n\n相似的词在向量空间中彼此靠近，语义关系体现为几何距离。",
    box: { color: "green", text: "苹果 → [0.85, 0.75]\n香蕉 → [0.72, 0.88]\n手机 → [-0.80, 0.70]\n\n苹果和香蕉在空间中很近！" },
    note: "维度从 5（词表大小）压缩到 2，信息不仅没丢失，反而蕴含了语义结构。"
  },
  {
    label: "模块 3",
    title: "余弦相似度：量化语义距离",
    desc: "向量之间的相似度用余弦夹角衡量，而不是欧氏距离。\n\ncos(θ) 越接近 1，两词越相似；越接近 0 或负数，越不相关。",
    box: { color: "orange", text: "cos(θ) = (a·b) / (|a||b|)\n\n苹果 & 香蕉：cos ≈ 0.99（极相似）\n苹果 & 手机：cos ≈ 0.08（不相关）" },
    note: "余弦相似度消除了向量长度的影响，只关注方向——更适合语义比较。"
  },
  {
    label: "模块 4",
    title: "Word2Vec 训练流程总览",
    desc: "Word2Vec 通过在大规模语料上预测上下文词来自监督训练，核心假设来自语言学的分布假说：\n\n「一个词的含义由它周围出现的词决定。」",
    box: { color: "purple", text: "两种训练方式：\n• CBOW：用上下文词预测中心词\n• Skip-gram：用中心词预测上下文词" },
    note: "训练完成后，神经网络的权重矩阵就是词向量表——每行对应一个词的向量表示。"
  },
];

// ─── Init ──────────────────────────────────────────────────────────────────
function init() {
  buildNavDots();
  renderLeft(1);
  initModule1();
  document.getElementById('btn-prev').addEventListener('click', prevStep);
  document.getElementById('btn-next').addEventListener('click', nextStep);
}

function buildNavDots() {
  const container = document.getElementById('nav-dots');
  for (let i = 1; i <= TOTAL; i++) {
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === 1 ? ' active' : '');
    dot.addEventListener('click', () => gotoStep(i));
    container.appendChild(dot);
  }
}

function updateNavDots() {
  document.querySelectorAll('.nav-dot').forEach((d, i) => {
    d.classList.toggle('active', i + 1 === currentStep);
  });
}

function updateProgress() {
  document.getElementById('step-current').textContent = currentStep;
  document.getElementById('progress-fill').style.width = (currentStep / TOTAL * 100) + '%';
}

function renderLeft(step) {
  const c = LEFT_CONTENT[step - 1];
  const lp = document.getElementById('left-panel');
  const colorClass = c.box.color ? ` ${c.box.color}` : '';
  lp.innerHTML = `
    <div>
      <div class="module-label">${c.label}</div>
      <div class="module-title">${c.title}</div>
    </div>
    <div class="module-desc" style="white-space:pre-line;">${c.desc}</div>
    <div class="highlight-box${colorClass}" style="white-space:pre-line;">${c.box.text}</div>
    <div style="font-size:.82rem;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:14px;">
      💡 ${c.note}
    </div>
  `;
}

// ─── Navigation ─────────────────────────────────────────────────────────────
function gotoStep(n) {
  if (n < 1 || n > TOTAL) return;
  document.getElementById(`scene-${currentStep}`).classList.remove('active');
  currentStep = n;
  document.getElementById(`scene-${currentStep}`).classList.add('active');
  renderLeft(currentStep);
  updateNavDots();
  updateProgress();
  document.getElementById('btn-prev').disabled = currentStep === 1;
  document.getElementById('btn-next').disabled = currentStep === TOTAL;
  document.getElementById('btn-next').textContent = currentStep === TOTAL ? '完成 ✓' : '下一步 →';

  if (currentStep === 2 && !m2Ready) { initModule2(); m2Ready = true; }
  if (currentStep === 3) initModule3();
  if (currentStep === 4) initModule4();
}

function nextStep() {
  if (currentStep === 1) {
    if (m1Sub < 4) { advanceM1(); return; }
  }
  if (currentStep < TOTAL) gotoStep(currentStep + 1);
}

function prevStep() {
  if (currentStep > 1) gotoStep(currentStep - 1);
}

// ─── MODULE 1 ────────────────────────────────────────────────────────────────
function initModule1() {
  // Build vocab chips
  const vrow = document.getElementById('vocab-row');
  VOCAB.forEach((w, i) => {
    const chip = document.createElement('div');
    chip.className = 'vocab-chip';
    chip.id = `chip-${i}`;
    chip.textContent = w;
    vrow.appendChild(chip);
  });

  // Build vector rows (hidden)
  const container = document.getElementById('onehot-vectors');
  const rows = [
    { label: '苹果', cls: 'apple',  hotIdx: 0 },
    { label: '香蕉', cls: 'banana', hotIdx: 1 },
  ];
  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'vector-row';
    row.id = `vrow-${r.cls}`;
    row.innerHTML = `<div class="vector-label ${r.cls}">${r.label}</div>`;
    const cells = document.createElement('div');
    cells.className = 'vec-cells';
    VOCAB.forEach((_, ci) => {
      const cell = document.createElement('div');
      cell.className = `vec-cell ${ci === r.hotIdx ? 'one ' + r.cls : 'zero'}`;
      cell.textContent = ci === r.hotIdx ? '1' : '0';
      cells.appendChild(cell);
    });
    row.appendChild(cells);
    container.appendChild(row);
  });
}

function advanceM1() {
  m1Sub++;
  if (m1Sub === 1) {
    document.getElementById('chip-0').classList.add('highlight-apple');
    setTimeout(() => document.getElementById('vrow-apple').classList.add('show'), 100);
  } else if (m1Sub === 2) {
    document.getElementById('chip-1').classList.add('highlight-banana');
    setTimeout(() => document.getElementById('vrow-banana').classList.add('show'), 100);
  } else if (m1Sub === 3) {
    setTimeout(() => document.getElementById('dot-row').classList.add('show'), 100);
  } else if (m1Sub === 4) {
    setTimeout(() => document.getElementById('problem-box').classList.add('show'), 100);
  }
}

// ─── MODULE 2 ────────────────────────────────────────────────────────────────
function initModule2() {
  // Compression demo for "苹果"
  const crRow = document.getElementById('compress-row');
  crRow.classList.add('show');
  const ohDiv = document.getElementById('compress-onehot');
  [1,0,0,0,0].forEach(v => {
    const c = document.createElement('div');
    c.className = 'compress-cell' + (v ? ' lit' : '');
    c.textContent = v;
    ohDiv.appendChild(c);
  });
  const rDiv = document.getElementById('compress-result');
  ['0.85','0.75'].forEach(v => {
    const c = document.createElement('div');
    c.className = 'compress-r-cell';
    c.textContent = v;
    rDiv.appendChild(c);
  });

  // Scatter plot
  const canvas = document.getElementById('scatter-canvas');
  const ctx = canvas.getContext('2d');
  drawScatter(ctx, canvas.width, canvas.height, null);

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    let found = null;
    VOCAB.forEach(w => {
      const {cx, cy} = vecToCanvas(WORD_VECS[w], canvas.width, canvas.height);
      if (Math.hypot(mx - cx, my - cy) < 18) found = w;
    });
    if (found !== m2HoverWord) {
      m2HoverWord = found;
      drawScatter(ctx, canvas.width, canvas.height, found);
    }
  });
  canvas.addEventListener('mouseleave', () => {
    m2HoverWord = null;
    drawScatter(ctx, canvas.width, canvas.height, null);
  });
}

function vecToCanvas(vec, W, H) {
  // map [-1.2, 1.2] → canvas
  const pad = 60;
  const cx = pad + (vec[0] + 1.2) / 2.4 * (W - 2 * pad);
  const cy = H - pad - (vec[1] + 0.2) / 1.4 * (H - 2 * pad);
  return { cx, cy };
}

function drawScatter(ctx, W, H, hovered) {
  ctx.clearRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = '#21262d';
  ctx.lineWidth = 1;
  for (let x = 60; x < W - 40; x += 60) {
    ctx.beginPath(); ctx.moveTo(x, 20); ctx.lineTo(x, H - 40); ctx.stroke();
  }
  for (let y = 20; y < H - 20; y += 60) {
    ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W - 20, y); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1.5;
  const cx0 = W / 2, cy0 = H / 2;
  ctx.beginPath(); ctx.moveTo(30, cy0); ctx.lineTo(W - 10, cy0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx0, 10); ctx.lineTo(cx0, H - 10); ctx.stroke();
  ctx.fillStyle = '#8b949e'; ctx.font = '11px sans-serif';
  ctx.fillText('→ dim 0', W - 60, cy0 - 6);
  ctx.fillText('↑ dim 1', cx0 + 6, 22);

  // Connections between fruit and tech clusters
  const pairs = [["苹果","香蕉"],["手机","电脑"]];
  pairs.forEach(([a, b]) => {
    const pa = vecToCanvas(WORD_VECS[a], W, H);
    const pb = vecToCanvas(WORD_VECS[b], W, H);
    ctx.strokeStyle = 'rgba(88,166,255,0.15)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(pa.cx, pa.cy); ctx.lineTo(pb.cx, pb.cy); ctx.stroke();
    ctx.setLineDash([]);
  });

  // Cluster circles
  const clusters = [
    { words: ["苹果","香蕉"], color: 'rgba(255,123,114,0.06)', border: 'rgba(255,123,114,0.3)' },
    { words: ["手机","电脑"], color: 'rgba(88,166,255,0.06)', border: 'rgba(88,166,255,0.3)' },
  ];
  clusters.forEach(cl => {
    const pts = cl.words.map(w => vecToCanvas(WORD_VECS[w], W, H));
    const cx = pts.reduce((s, p) => s + p.cx, 0) / pts.length;
    const cy = pts.reduce((s, p) => s + p.cy, 0) / pts.length;
    ctx.beginPath();
    ctx.arc(cx, cy, 52, 0, Math.PI * 2);
    ctx.fillStyle = cl.color; ctx.fill();
    ctx.strokeStyle = cl.border; ctx.lineWidth = 1.5; ctx.stroke();
  });

  // Dots
  VOCAB.forEach((w, i) => {
    const {cx, cy} = vecToCanvas(WORD_VECS[w], W, H);
    const isHov = hovered === w;
    const r = isHov ? 14 : 10;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = COLORS[i] + (isHov ? 'ff' : 'cc');
    ctx.fill();
    ctx.strokeStyle = isHov ? '#fff' : COLORS[i];
    ctx.lineWidth = isHov ? 2.5 : 1.5;
    ctx.stroke();

    // Label
    ctx.fillStyle = isHov ? '#fff' : COLORS[i];
    ctx.font = `${isHov ? 'bold ' : ''}13px sans-serif`;
    const tx = cx + 15, ty = cy - 4;
    ctx.fillText(w, tx, ty);

    // Hover: show vector
    if (isHov) {
      const v = WORD_VECS[w];
      const label = `[${v[0].toFixed(2)}, ${v[1].toFixed(2)}]`;
      const bw = ctx.measureText(label).width + 16;
      ctx.fillStyle = '#161b22';
      roundRect(ctx, tx - 4, ty + 6, bw, 22, 4);
      ctx.fill();
      ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = COLORS[i]; ctx.font = '11px monospace';
      ctx.fillText(label, tx + 4, ty + 21);
    }
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r);   ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);     ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r);       ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// ─── MODULE 3 ────────────────────────────────────────────────────────────────
const COSINE_PAIRS = [
  { word: "香蕉", cos: 0.989, label: "苹果 & 香蕉", cls: "high" },
  { word: "猫",   cos: 0.661, label: "苹果 & 猫",   cls: "low"  },
  { word: "手机", cos: 0.083, label: "苹果 & 手机", cls: "low"  },
  { word: "电脑", cos: -0.020, label: "苹果 & 电脑", cls: "low" },
];

function initModule3() {
  const canvas = document.getElementById('cosine-canvas');
  const ctx = canvas.getContext('2d');
  const table = document.getElementById('cosine-table');
  table.innerHTML = '';

  COSINE_PAIRS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'cosine-card';
    card.id = `ccard-${i}`;
    card.innerHTML = `<div class="pair">${p.label}</div><div class="score ${p.cls}">${p.cos.toFixed(3)}</div>`;
    table.appendChild(card);
  });

  animateCosine(ctx, canvas.width, canvas.height);
}

function animateCosine(ctx, W, H) {
  if (m3AnimFrame) cancelAnimationFrame(m3AnimFrame);
  const targets = COSINE_PAIRS.map(p => Math.acos(Math.max(-1, Math.min(1, p.cos))));
  const current = [0, 0, 0, 0];
  const speed = 0.02;
  let cardShown = [false, false, false, false];

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const cx = W * 0.35, cy = H * 0.52;
    const r = Math.min(W, H) * 0.28;

    // Background circle
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1; ctx.stroke();

    // Apple vector (fixed, pointing right-ish)
    const appleAngle = -0.65; // radians from x-axis
    const ax = cx + r * Math.cos(appleAngle);
    const ay = cy + r * Math.sin(appleAngle);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ax, ay);
    ctx.strokeStyle = COLORS[0]; ctx.lineWidth = 3; ctx.stroke();
    drawArrowHead(ctx, cx, cy, ax, ay, COLORS[0]);
    ctx.fillStyle = COLORS[0]; ctx.font = 'bold 13px sans-serif';
    ctx.fillText('苹果', ax + 8, ay - 4);

    // Other vectors
    COSINE_PAIRS.forEach((p, i) => {
      const wIdx = VOCAB.indexOf(p.word);
      const tgt = targets[i];
      if (current[i] < tgt) {
        current[i] = Math.min(current[i] + speed, tgt);
      }
      const angle = appleAngle + current[i];
      const bx = cx + r * Math.cos(angle);
      const by = cy + r * Math.sin(angle);

      // Arc for angle
      if (current[i] > 0.01) {
        ctx.beginPath();
        ctx.arc(cx, cy, 36 + i * 12, appleAngle, angle);
        ctx.strokeStyle = COLORS[wIdx] + '88'; ctx.lineWidth = 2; ctx.stroke();
        if (current[i] > 0.1) {
          const midA = appleAngle + current[i] / 2;
          const lr = 36 + i * 12 + 12;
          ctx.fillStyle = COLORS[wIdx]; ctx.font = '10px sans-serif';
          const cosVal = Math.cos(current[i]);
          ctx.fillText(`${cosVal.toFixed(2)}`, cx + lr * Math.cos(midA) - 12, cy + lr * Math.sin(midA) + 4);
        }
      }

      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(bx, by);
      ctx.strokeStyle = COLORS[wIdx]; ctx.lineWidth = 2; ctx.stroke();
      drawArrowHead(ctx, cx, cy, bx, by, COLORS[wIdx]);
      ctx.fillStyle = COLORS[wIdx]; ctx.font = '13px sans-serif';
      ctx.fillText(p.word, bx + 8, by + 4);

      // Show card when near target
      if (current[i] >= tgt * 0.95 && !cardShown[i]) {
        cardShown[i] = true;
        const card = document.getElementById(`ccard-${i}`);
        if (card) { card.classList.add('active'); setTimeout(() => card.classList.remove('active'), 800); }
      }
    });

    // Right-side formula
    ctx.fillStyle = '#8b949e'; ctx.font = '12px monospace';
    ctx.fillText('cos θ = (a·b) / (|a||b|)', W * 0.62, H * 0.3);

    const still = current.every((c, i) => Math.abs(c - targets[i]) < 0.001);
    if (!still) m3AnimFrame = requestAnimationFrame(draw);
  }

  draw();
}

function drawArrowHead(ctx, x1, y1, x2, y2, color) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const len = 10;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - len * Math.cos(angle - 0.4), y2 - len * Math.sin(angle - 0.4));
  ctx.lineTo(x2 - len * Math.cos(angle + 0.4), y2 - len * Math.sin(angle + 0.4));
  ctx.closePath(); ctx.fill();
}

// ─── MODULE 4 ────────────────────────────────────────────────────────────────
const PIPE_STEPS = [
  {
    icon: '📚', label: '语料库',
    title: '语料库 (Corpus)',
    body: '大量文本数据，如维基百科、新闻、书籍。Word2Vec 依靠自监督学习，不需要人工标注。语料越大，学到的词向量越好。',
    extra: null
  },
  {
    icon: '🪟', label: '滑动窗口',
    title: '滑动窗口 (Sliding Window)',
    body: '在句子上滑动一个固定大小的窗口（如 size=2），每次取中心词及其上下文词作为训练对。',
    extra: () => {
      const div = document.createElement('div');
      div.className = 'window-demo';
      const tokens = ["我","喜欢","吃","苹果","和","香蕉"];
      tokens.forEach((t, i) => {
        const s = document.createElement('span');
        s.className = 'wtoken' + (i === 3 ? ' center' : (Math.abs(i-3)<=2 ? ' context' : ''));
        s.textContent = t;
        div.appendChild(s);
      });
      const note = document.createElement('p');
      note.style = 'font-size:.8rem;color:var(--muted);margin-top:6px;';
      note.textContent = '蓝色=中心词 "苹果"，绿色=上下文词（窗口大小=2）';
      div.appendChild(note);
      return div;
    }
  },
  {
    icon: '⚙️', label: '训练对',
    title: '训练对 (Training Pairs)',
    body: 'Skip-gram 生成 (中心词, 上下文词) 对：("苹果","吃"), ("苹果","和"), ("苹果","香蕉")…\nCBOW 反之，用上下文词预测中心词。',
    extra: null
  },
  {
    icon: '🧠', label: '神经网络',
    title: '浅层神经网络 (Shallow Neural Net)',
    body: '单隐层网络：输入 One-Hot → 隐层（embedding 层）→ Softmax 输出。\n\n关键：隐层的权重矩阵 W 就是词向量表，训练完成后直接提取使用。',
    extra: null

  {

    title: '词向量 (Word Embeddings)',
    body: '训练结束后，每个词对应一行 W 矩阵，就是它的词向量。相同语境出现的词，向量方向相近——这正是分布假说的体现。',
    extra: null
  },
];

function initModule4() {
  const pipeline = document.getElementById('pipeline');
  pipeline.innerHTML = '';
  m4PipeShown = 0;
  m4Expanded = -1;
  document.getElementById('step-detail').classList.remove('visible');

  PIPE_STEPS.forEach((s, i) => {
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'pipe-arrow';
      arrow.id = `parrow-${i}`;
      arrow.textContent = '→';
      pipeline.appendChild(arrow);
    }
    const step = document.createElement('div');
    step.className = 'pipe-step';
    step.id = `pstep-${i}`;
    step.innerHTML = `<div class="pipe-icon">${s.icon}</div><div class="pipe-label">${s.label}</div>`;
    step.addEventListener('click', () => expandPipeStep(i));
    pipeline.appendChild(step);
  });

  // Animate steps appearing one by one
  function showNext() {
    if (m4PipeShown >= PIPE_STEPS.length) return;
    const stepEl = document.getElementById(`pstep-${m4PipeShown}`);
    if (stepEl) stepEl.classList.add('show');
    if (m4PipeShown > 0) {
      const arrow = document.getElementById(`parrow-${m4PipeShown}`);
      if (arrow) arrow.classList.add('show');
    }
    m4PipeShown++;
    if (m4PipeShown < PIPE_STEPS.length) setTimeout(showNext, 200);
  }
  setTimeout(showNext, 100);
}

function expandPipeStep(i) {
  const detail = document.getElementById('step-detail');
  const title = document.getElementById('detail-title');
  const body = document.getElementById('detail-body');

  document.querySelectorAll('.pipe-step').forEach(s => s.classList.remove('expanded'));

  if (m4Expanded === i) {
    m4Expanded = -1;
    detail.classList.remove('visible');
    return;
  }

  m4Expanded = i;
  const s = PIPE_STEPS[i];
  document.getElementById(`pstep-${i}`).classList.add('expanded');
  title.textContent = s.title;
  body.innerHTML = `<p style="white-space:pre-line;color:var(--muted)">${s.body}</p>`;
  if (s.extra) body.appendChild(s.extra());
  detail.classList.add('visible');
}
