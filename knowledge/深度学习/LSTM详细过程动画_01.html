<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>LSTM 详细过程动画 — 108步骤精讲</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }

/* ===== 顶部标题 ===== */
.header {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  padding: 20px 40px;
  border-bottom: 2px solid #4a9eff33;
  display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 1.6rem; color: #4a9eff; }
.header .step-counter { font-size: 1.1rem; color: #aaa; }
.progress-bar-wrap { height: 4px; background: #222; }
.progress-bar { height: 4px; background: linear-gradient(90deg, #4a9eff, #a78bfa); transition: width 0.3s; }

/* ===== 主体布局 ===== */
.main { display: flex; height: calc(100vh - 84px); overflow: hidden; }

/* ===== 左侧：LSTM 图示 ===== */
.diagram-panel {
  width: 55%;
  padding: 30px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-right: 1px solid #2a2a3e;
  position: relative;
}

/* ===== 右侧：步骤讲解 ===== */
.explain-panel {
  width: 45%;
  padding: 30px;
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.step-tag { font-size: 0.75rem; color: #4a9eff; font-weight: bold; letter-spacing: 2px; margin-bottom: 8px; }
.step-title { font-size: 1.4rem; font-weight: bold; color: #fff; margin-bottom: 16px; line-height: 1.4; }
.step-body { font-size: 0.95rem; color: #c0c8d8; line-height: 1.9; flex: 1; }
.step-body .formula {
  background: #1a2040; border-left: 3px solid #4a9eff;
  padding: 12px 16px; border-radius: 4px; margin: 12px 0;
  font-family: 'Courier New', monospace; font-size: 1rem; color: #7dd3fc;
}
.step-body .highlight { color: #fcd34d; font-weight: bold; }
.step-body .green { color: #6ee7b7; font-weight: bold; }
.step-body .pink { color: #f9a8d4; font-weight: bold; }
.step-body .orange { color: #fdba74; font-weight: bold; }

/* 底部导航 */
.nav-bar {
  padding: 16px 40px;
  display: flex; align-items: center; justify-content: space-between;
  background: #0f1117; border-top: 1px solid #2a2a3e;
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 1000;
}
.nav-btn {
  padding: 10px 28px; border-radius: 8px; font-size: 0.95rem; font-weight: bold;
  cursor: pointer; border: none; transition: all 0.2s;
}
.nav-btn.prev { background: #2a2a3e; color: #aaa; }
.nav-btn.prev:hover { background: #3a3a5e; color: #fff; }
.nav-btn.next { background: #4a9eff; color: #fff; }
.nav-btn.next:hover { background: #2a7fdf; }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.section-dots { display: flex; gap: 6px; flex-wrap: wrap; max-width: 400px; justify-content: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #333; cursor: pointer; transition: all 0.2s; }
.dot.active { background: #4a9eff; transform: scale(1.4); }
.dot.done { background: #4a9eff44; }

/* ===== SVG 图示样式 ===== */
svg { font-family: 'Segoe UI', sans-serif; }
.cell-box { fill: #1e2d1e; stroke: #4a7c4a; stroke-width: 2; rx: 12; }
.gate-σ { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
.gate-tanh { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
.gate-mult { fill: #fce7f3; stroke: #db2777; stroke-width: 2; }
.gate-add { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }

.highlight-glow { filter: drop-shadow(0 0 8px #4a9eff); }
.highlight-glow-yellow { filter: drop-shadow(0 0 8px #fcd34d); }
.highlight-glow-green { filter: drop-shadow(0 0 8px #6ee7b7); }
.highlight-glow-pink { filter: drop-shadow(0 0 8px #f9a8d4); }
.highlight-glow-orange { filter: drop-shadow(0 0 8px #fdba74); }

.arrow { stroke: #556; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
.arrow-active { stroke: #4a9eff; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
.arrow-yellow { stroke: #fcd34d; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-yellow); }
.arrow-green { stroke: #6ee7b7; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-green); }
.arrow-pink { stroke: #f9a8d4; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-pink); }
</style>
</head>

        <text x="415" y="198" text-anchor="middle" fill="#92400e" font-size="13" font-weight="bold">σ_o</text>
      </g>
      <!-- tanh(C_t) -->
      <g id="tanhOut">
        <rect x="390" y="255" width="50" height="36" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
        <text x="415" y="278" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="bold">tanh</text>
      </g>
      <!-- 输出门 × tanh(C_t) -->
      <g id="multO">
        <circle cx="460" cy="273" r="14" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
        <text x="460" y="278" text-anchor="middle" fill="#db2777" font-size="16" font-weight="bold">×</text>
      </g>

      <!-- 输入 x_t -->
      <g id="nodeX">
        <circle cx="280" cy="380" r="18" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
        <text x="280" y="386" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">x_t</text>
      </g>

      <!-- h_{t-1} 输入 -->
      <g id="nodeHPrev">
        <circle cx="60" cy="250" r="18" fill="#e9d5ff" stroke="#7c3aed" stroke-width="2"/>

      </g>

      <!-- h_t 输出 -->
      <g id="nodeHOut">
        <circle cx="500" cy="250" r="18" fill="#e9d5ff" stroke="#7c3aed" stroke-width="2"/>
        <text x="500" y="256" text-anchor="middle" fill="#4c1d95" font-size="11" font-weight="bold">h_t</text>
      </g>

      <!-- 拼接标注 [h_{t-1}, x_t] -->
      <rect id="concatBox" x="140" y="240" width="230" height="28" rx="6" fill="#1a2040" stroke="#4a9eff33" stroke-width="1"/>
      <text x="255" y="259" text-anchor="middle" fill="#7dd3fc" font-size="11">[h_{t-1}, x_t] 拼接向量</text>

      <!-- 连接线（静态骨架） -->
      <!-- h_{t-1} → 各门 -->
      <line x1="78" y1="250" x2="140" y2="250" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- x_t → 各门 -->
      <line x1="280" y1="362" x2="280" y2="268" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- 各门 → × -->
      <line x1="125" y1="175" x2="125" y2="144" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="215" y1="175" x2="215" y2="144" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="285" y1="175" x2="285" y2="144" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- ×F → C线 -->
      <line x1="125" y1="116" x2="125" y2="110" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- ×I与候选 -->
      <line x1="215" y1="144" x2="250" y2="144" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="285" y1="144" x2="264" y2="144" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="250" y1="116" x2="250" y2="110" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- + → ... -->
      <line x1="370" y1="126" x2="370" y2="255" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="370" y1="255" x2="390" y2="255" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- σ_o → ×O -->
      <line x1="415" y1="211" x2="415" y2="255" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="415" y1="255" x2="446" y2="273" class="arrow" stroke="#445" stroke-width="1.2"/>
      <!-- ×O → h_t -->
      <line x1="474" y1="273" x2="500" y2="268" class="arrow" stroke="#445" stroke-width="1.2"/>
      <line x1="500" y1="250" x2="500" y2="232" class="arrow" stroke="#445" stroke-width="1.2"/>

      <!-- 动态高亮层（初始隐藏） -->
      <g id="dynamicLayer"></g>

      <!-- 标注文字层 -->
      <g id="labelLayer">
        <text x="88" y="128" fill="#f9a8d4" font-size="10">f_t</text>
        <text x="238" y="128" fill="#f9a8d4" font-size="10">i_t·g_t</text>
        <text x="358" y="100" fill="#6ee7b7" font-size="10">C_t</text>
        <text x="468" y="270" fill="#e9d5ff" font-size="10">h_t</text>
      </g>
    </svg>

    <!-- 当前数值显示 -->
    <div id="valDisplay" style="background:#1a2040;border-radius:8px;padding:12px 20px;margin-top:12px;width:100%;font-size:0.85rem;color:#7dd3fc;font-family:'Courier New',monospace;min-height:60px;">
      <span id="valText">▶ 点击"下一步"开始 LSTM 详细讲解</span>
    </div>
  </div>

  <!-- 右侧讲解 -->
  <div class="explain-panel" style="padding-bottom:80px;">
    <div class="step-tag" id="stepTag">SECTION 1 · 背景</div>
    <div class="step-title" id="stepTitle">LSTM 是什么？为什么需要它？</div>
    <div class="step-body" id="stepBody">
      在开始之前，先建立直觉：<br><br>
      <span class="highlight">普通 RNN 的核心缺陷</span>：梯度在时间反传时会指数级消失，
      导致网络只能"记住"最近几步的信息。<br><br>
      <span class="green">LSTM 的解决思路</span>：引入一条"细胞状态高速公路"（Cell State），
      让信息可以<b>无损地</b>在时间轴上传递，同时用三个"门"来精确控制
      哪些信息被遗忘、哪些被写入、哪些被输出。<br><br>
      接下来，我们用 <b>108 步</b>，把每一个计算细节都讲清楚。
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="nav-bar">
  <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)" disabled>← 上一步</button>
  <div class="section-dots" id="sectionDots"></div>
  <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">下一步 →</button>
</div>

<script>
// ===================================================
// 108步骤数据
// ===================================================
const steps = [
  // ──────────────── SECTION 1: 背景与动机 (1-8) ────────────────
  {
    section: "SECTION 1 · 背景", title: "LSTM 是什么？为什么需要它？",
    highlight: [],
    val: "▶ 点击"下一步"开始 LSTM 详细讲解",
    body: `在开始之前，先建立直觉：<br><br>
<span class="highlight">普通 RNN 的核心缺陷</span>：梯度在时间反传时会指数级消失，
导致网络只能"记住"最近几步的信息。<br><br>
<span class="green">LSTM 的解决思路</span>：引入一条"细胞状态高速公路"（Cell State），
让信息可以<b>无损地</b>在时间轴上传递，同时用三个"门"来精确控制
哪些信息被遗忘、哪些被写入、哪些被输出。<br><br>
接下来，我们用 <b>108 步</b>，把每一个计算细节都讲清楚。`
  },
  {
    section: "SECTION 1 · 背景", title: "RNN 梯度消失的根本原因",
    highlight: [],
    val: "∂L/∂h₁ = ∂L/∂h₅ × (Wh)⁴ → 若|λ(Wh)|<1，则趋向0",
    body: `<b>数学上</b>，RNN 的梯度公式是：<br><br>
<div class="formula">∂L/∂h₁ = ∂L/∂h₅ × ∂h₅/∂h₄ × ∂h₄/∂h₃ × ∂h₃/∂h₂ × ∂h₂/∂h₁</div>
每一项 ∂h_t/∂h_{t-1} ≈ Wh^T，如果连乘 T 次：<br><br>
• Wh 特征值 < 1 → 连乘后 → <span class="highlight">梯度消失</span><br>
• Wh 特征值 > 1 → 连乘后 → <span class="orange">梯度爆炸</span><br><br>
这意味着，<span class="green">时间距离越远，梯度越接近0，权重几乎不更新</span>。`
  },
  {
    section: "SECTION 1 · 背景", title: "LSTM 的核心设计哲学",
    highlight: [],
    val: "LSTM = 细胞状态 C_t（高速公路）+ 3个门控",
    body: `LSTM（Long Short-Term Memory，长短期记忆网络）由 Hochreiter & Schmidhuber 于 <b>1997年</b> 提出。<br><br>
核心思想：<br><br>
<span class="green">① 细胞状态 C_t</span>：一条几乎无损的"传送带"，让梯度可以直接流过去<br>
<span class="highlight">② 遗忘门 f_t</span>：决定"忘掉多少旧信息"<br>
<span class="pink">③ 输入门 i_t</span>：决定"写入多少新信息"<br>
<span class="orange">④ 输出门 o_t</span>：决定"输出多少给下一步"`
  },
  {
    section: "SECTION 1 · 背景", title: "LSTM 的输入输出总览",
    highlight: ["nodeX", "nodeHPrev", "nodeHOut", "cLine"],
    val: "输入: x_t, h_{t-1}, C_{t-1} → 输出: h_t, C_t",
    body: `每个 LSTM 时间步接收 <b>3个输入</b>：<br><br>
<span class="highlight">x_t</span>：当前时间步的输入向量（蓝色圆圈）<br>
<span class="pink">h_{t-1}</span>：上一步的隐状态（紫色圆圈，左侧）<br>
<span class="green">C_{t-1}</span>：上一步的细胞状态（绿色虚线，顶部）<br><br>
并输出 <b>2个结果</b>：<br>
<span class="pink">h_t</span>：本步的隐状态（传给下一层或输出层）<br>
<span class="green">C_t</span>：本步的细胞状态（传给下一个时间步）`
  },
  {
    section: "SECTION 1 · 背景", title: "sigmoid 激活函数详解",
    highlight: ["gateF"],
    val: "σ(x) = 1 / (1 + e^(-x))，输出范围 (0, 1)",
    body: `门控机制的核心是 <span class="highlight">sigmoid 函数</span>，记作 σ：<br><br>
<div class="formula">σ(x) = 1 / (1 + e^(-x))</div>
输出范围：<b>(0, 1)</b><br><br>
• 输出接近 <b>0</b> → "关门"：阻止信息通过<br>
• 输出接近 <b>1</b> → "开门"：允许信息通过<br><br>
所以 sigmoid 就像一个<span class="green">可微分的开关</span>，
可以被梯度下降训练，学会在什么时候开、什么时候关。`
  },
  {
    section: "SECTION 1 · 背景", title: "tanh 激活函数详解",
    highlight: ["gateTanhC"],
    val: "tanh(x) = (e^x - e^(-x)) / (e^x + e^(-x))，输出范围(-1,1)",
    body: `tanh 用于生成"候选值"（写入信息）和最终输出转换：<br><br>
<div class="formula">tanh(x) = (eˣ - e⁻ˣ) / (eˣ + e⁻ˣ)</div>
输出范围：<b>(-1, 1)</b><br><br>
• 可以表示<span class="highlight">正向信息</span>（+1附近）和<span class="pink">负向信息</span>（-1附近）<br>
• 零中心，梯度流动比 sigmoid 更稳定<br><br>
<span class="green">记忆口诀</span>：sigmoid 控制"多少"，tanh 控制"方向和强度"`
  },
  {
    section: "SECTION 1 · 背景", title: "逐元素乘法（Hadamard 积）",
    highlight: ["multF", "multI", "multO"],
    val: "⊙ 操作：[0.8, 0.2, 0.9] ⊙ [1.0, -0.5, 0.3] = [0.8, -0.1, 0.27]",
    body: `图中的 <span class="pink">× 圆圈</span> 表示<b>逐元素乘法（⊙）</b>，不是矩阵乘法！<br><br>

    body: `权重矩阵的梯度（以遗忘门为例）：<br><br>
<div class="formula">dz_f = df_t ⊙ f_t ⊙ (1 - f_t)</div>
<div class="formula">dW_f += dz_f · [h_{t-1}; x_t]^T</div>
<div class="formula">db_f += dz_f</div>
<div class="formula">d[h_{t-1}; x_t] += W_f^T · dz_f</div>
<span class="green">注意"+="</span>：对序列中每个时间步 t，梯度都要<b>累加</b>到权重上，
因为所有时间步<span class="highlight">共享同一套权重</span>！`

<b>解决方案：梯度裁剪（Gradient Clipping）</b><br><br>
<div class="formula">if ||g|| > threshold:
    g = g × threshold / ||g||</div>
• 阈值通常设为 1.0 或 5.0<br>
• 保持梯度方向不变，只压缩幅度<br><br>
<span class="green">PyTorch 实现</span>：<br>
<div class="formula">torch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)</div>`

<div class="formula">class LSTMCell(nn.Module):
  def __init__(self, input_size, hidden_size):
    super().__init__()
    # 4个门合并成一个大矩阵
    self.W = nn.Linear(
      input_size + hidden_size,
      4 * hidden_size
    )

  def forward(self, x, h_prev, c_prev):
    combined = torch.cat([h_prev, x], dim=1)
    gates = self.W(combined)  # 4H
    z_f,z_i,z_g,z_o = gates.chunk(4, dim=1)
    f = torch.sigmoid(z_f)
    i = torch.sigmoid(z_i)
    g = torch.tanh(z_g)
    o = torch.sigmoid(z_o)
    c = f * c_prev + i * g
    h = o * torch.tanh(c)
    return h, c</div>`

  def __init__(self, vocab_size, embed_dim,

    self.embed = nn.Embedding(vocab_size, embed_dim)
    self.lstm = nn.LSTM(

<b>GRU 核心公式</b>：<br>
<div class="formula">r_t = σ(W_r·[h_{t-1};x_t])  ← 重置门</div>
<div class="formula">z_t = σ(W_z·[h_{t-1};x_t])  ← 更新门</div>
<div class="formula">h̃_t = tanh(W·[r_t⊙h_{t-1};x_t])  ← 候选</div>
<div class="formula">h_t = z_t⊙h_{t-1} + (1-z_t)⊙h̃_t</div>

// 高亮映射

  "gateF": "#fcd34d",
  "gateI": "#f9a8d4",
  "gateTanhC": "#a78bfa",
  "gateO": "#fdba74",
  "multF": "#f9a8d4",
  "multI": "#f9a8d4",
  "multO": "#f9a8d4",
  "addNode": "#6ee7b7",
  "tanhOut": "#a78bfa",
  "cLine": "#6ee7b7",
  "nodeX": "#4a9eff",
  "nodeHPrev": "#c4b5fd",
  "nodeHOut": "#c4b5fd",
  "concatBox": "#4a9eff",
};

// ===================================================
// 渲染逻辑
// ===================================================
let current = 0;
const total = steps.length;

function buildDots() {
  const container = document.getElementById('sectionDots');
  // 每10步一个点
  const count = Math.ceil(total / 5);
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.onclick = () => { current = i * 5; render(); };
    container.appendChild(d);
  }
}

function updateDots() {
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, i) => {
    d.classList.remove('active', 'done');
    const stepIdx = i * 5;
    if (stepIdx === Math.floor(current / 5) * 5) d.classList.add('active');
    else if (stepIdx < current) d.classList.add('done');
  });
}

function applyHighlights(ids) {
  // 清除所有高亮
  Object.keys(HIGHLIGHT_COLORS).forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.style.filter = '';
      el.style.opacity = '0.7';
    }
  });
  // 如果没有指定高亮，全部设为正常
  if (!ids || ids.length === 0) {
    Object.keys(HIGHLIGHT_COLORS).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.opacity = '1';
    });
    return;
  }
  // 高亮指定元素
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      const color = HIGHLIGHT_COLORS[id] || '#4a9eff';
      el.style.filter = `drop-shadow(0 0 10px ${color})`;
      el.style.opacity = '1';
    }
  });
}

function render() {
  const s = steps[current];
  document.getElementById('stepCounter').textContent = `步骤 ${current + 1} / ${total}`;
  document.getElementById('progressBar').style.width = `${((current + 1) / total) * 100}%`;
  document.getElementById('stepTag').textContent = s.section;
  document.getElementById('stepTitle').textContent = s.title;
  document.getElementById('stepBody').innerHTML = s.body;
  document.getElementById('valText').textContent = s.val;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
  document.getElementById('nextBtn').textContent = current === total - 1 ? '完成 ✓' : '下一步 →';
  applyHighlights(s.highlight);
  updateDots();
  // 滚动右侧面板到顶部
  document.querySelector('.explain-panel').scrollTop = 0;
}

function navigate(dir) {
  const newIdx = current + dir;
  if (newIdx < 0 || newIdx >= total) return;
  current = newIdx;
  render();
}

// 键盘导航
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault(); navigate(1);
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); navigate(-1);
  }
});

// 初始化
buildDots();
render();
</script>
