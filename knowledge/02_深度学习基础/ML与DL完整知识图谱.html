// ========== RENDERING ==========
const container = document.getElementById('tree-container');
const cardPanel = document.getElementById('card-panel');
const cardContent = document.getElementById('card-content');

function getColorClass(c) {
  const map = {red:'dot-red',blue:'dot-blue',green:'dot-green',purple:'dot-purple'};
  return map[c]||'dot-green';
}
function getTagClass(c) {
  const map = {red:'tag-red',blue:'tag-blue',green:'tag-green',purple:'tag-purple'};
  return map[c]||'tag-green';
}
function getColorName(c) {
  const map = {red:'核心基石',blue:'关键算法/模型',green:'重要概念/技巧',purple:'前沿/高级'};
  return map[c]||'';
}

function renderTree(data, parentEl, depth) {
  data.forEach(stage => {
    const block = document.createElement('div');
    block.className = `stage-block s${stage.stage}`;
    block.dataset.stage = stage.stage;
    block.style.background = stage.bg;

    // Stage header
    const hdr = document.createElement('div');
    hdr.className = 'stage-header';
    hdr.innerHTML = `<span class="stage-number">${stage.stage}</span><span class="stage-title stage-title-${stage.stage}">${stage.title}</span><span class="node-toggle" id="toggle-s${stage.stage}">▼</span>`;
    block.appendChild(hdr);

    // Stage summary
    const sum = document.createElement('div');
    sum.className = 'stage-summary';
    sum.textContent = stage.summary;
    block.appendChild(sum);

    // Stage arrow
    if (stage.stage < 8) {
      const arrow = document.createElement('div');
      arrow.className = 'stage-arrow';
      arrow.textContent = '▼ 递进到下一阶段 ▼';
      block.appendChild(arrow);
    }

    // Children tree
    const list = document.createElement('ul');
    list.className = 'tree-list';
    list.id = `children-s${stage.stage}`;
    renderChildren(stage.children, list, depth+1);
    block.appendChild(list);

    // Toggle handler
    hdr.addEventListener('click', () => {
      const ch = document.getElementById(`children-s${stage.stage}`);
      const tg = document.getElementById(`toggle-s${stage.stage}`);
      if (ch.classList.contains('collapsed')) {
        ch.classList.remove('collapsed');
        ch.style.maxHeight = '5000px';
        tg.classList.remove('collapsed');
      } else {
        ch.style.maxHeight = ch.scrollHeight + 'px';
        requestAnimationFrame(() => {
          ch.classList.add('collapsed');
          tg.classList.add('collapsed');
        });
      }
    });

    parentEl.appendChild(block);
  });
}

function renderChildren(children, parentEl, depth) {
  children.forEach(child => {
    const li = document.createElement('li');
    li.className = 'tree-item';
    li.dataset.id = child.id;
    if (child.isLeaf) li.classList.add('leaf-node');

    const hdr = document.createElement('div');
    hdr.className = 'node-header';

    const levelClass = `l${Math.min(depth,4)}`;
    const dotClass = child.triple ? 'dot-red-triple' : getColorClass(child.color);
    const labelClass = child.triple ? `node-label ${levelClass} triple-emphasis` : `node-label ${levelClass}`;

    if (child.children && child.children.length > 0) {
      hdr.innerHTML = `<span class="node-toggle" id="toggle-${child.id}">▼</span><span class="node-dot ${dotClass}"></span><span class="${labelClass}">${child.label}</span>`;
    } else {
      hdr.innerHTML = `<span class="node-dot ${dotClass}"></span><span class="${labelClass}">${child.label}</span>`;
    }
    li.appendChild(hdr);

    if (child.children && child.children.length > 0) {
      const sublist = document.createElement('ul');
      sublist.className = 'tree-list node-children';
      sublist.id = `children-${child.id}`;
      renderChildren(child.children, sublist, depth+1);
      li.appendChild(sublist);

      hdr.addEventListener('click', () => {
        const ch = document.getElementById(`children-${child.id}`);
        const tg = document.getElementById(`toggle-${child.id}`);
        if (ch.classList.contains('collapsed')) {
          ch.classList.remove('collapsed');
          ch.style.maxHeight = '5000px';
          tg.classList.remove('collapsed');
        } else {
          ch.style.maxHeight = ch.scrollHeight + 'px';
          requestAnimationFrame(() => {
            ch.classList.add('collapsed');
            tg.classList.add('collapsed');
          });
        }
      });
    } else if (child.isLeaf && child.card) {
      hdr.addEventListener('click', () => showCard(child));
    }

    parentEl.appendChild(li);
  });
}

// ========== CARD PANEL ==========
function showCard(node) {
  const c = node.card;
  const colorTag = `<span class="card-tag ${getTagClass(node.color)}">${getColorName(node.color)}</span>`;
  let linksHtml = '';
  if (c.links && c.links.length) {
    linksHtml = c.links.map(l => `<a onclick="searchFor('${l}')">${l}</a>`).join(' → ');
  }
  let errorsHtml = '';
  if (c.errors && c.errors.length) {
    errorsHtml = c.errors.map(e => `<li>${e}</li>`).join('');
  }

  cardContent.innerHTML = `
    <div class="card-title">${c.title}</div>
    <div class="card-subtitle">${colorTag}</div>
    <div class="card-section">
      <div class="card-section-title">一句话概括</div>
      <div class="card-summary">${c.summary}</div>
    </div>
    <div class="card-section">
      <div class="card-section-title">核心公式</div>
      <div class="card-formula">${c.formula.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="card-section">
      <div class="card-section-title">关键理解</div>
      <div class="card-key">${c.key}</div>
    </div>
    <div class="card-section">
      <div class="card-section-title">易错点</div>
      <ul class="card-error">${errorsHtml}</ul>
    </div>
    <div class="card-section">
      <div class="card-section-title">代码片段</div>
      <div class="card-code">${c.code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>
    <div class="card-section">
      <div class="card-section-title">关联知识点</div>
      <div class="card-links">${linksHtml}</div>
    </div>
  `;
  cardPanel.classList.add('open');
}

function closeCard() {
  cardPanel.classList.remove('open');
}

// ========== SEARCH ==========
const searchBox = document.getElementById('searchbox');
let searchTimeout;
searchBox.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => doSearch(searchBox.value.trim()), 200);
});

function doSearch(query) {
  // Clear previous highlights
  document.querySelectorAll('.search-highlight').forEach(el => {
    el.classList.remove('search-highlight');
  });

  if (!query) return;

  const allLabels = document.querySelectorAll('.node-label');
  allLabels.forEach(label => {
    if (label.textContent.toLowerCase().includes(query.toLowerCase())) {
      label.classList.add('search-highlight');
      // Expand parents
      let parent = label.closest('.node-children');
      while (parent) {
        parent.classList.remove('collapsed');
        parent.style.maxHeight = '5000px';
        const toggle = parent.previousElementSibling?.querySelector('.node-toggle');
        if (toggle) toggle.classList.remove('collapsed');
        parent = parent.parentElement?.closest('.node-children');
      }
      // Also expand stage-level
      const stageChildren = label.closest('.stage-block')?.querySelector('.tree-list');
      if (stageChildren) {
        stageChildren.classList.remove('collapsed');
        stageChildren.style.maxHeight = '5000px';
        const stg = stageChildren.previousElementSibling?.querySelector('.node-toggle');
        if (stg) stg.classList.remove('collapsed');
      }
    }
  });
}

function searchFor(term) {
  searchBox.value = term;
  doSearch(term);
}

// ========== STAGE FILTER ==========
function filterStage(stageNum) {
  // Update buttons
  document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
  if (stageNum === 'all') {
    document.querySelector('.stage-btn-all').classList.add('active');
  } else {
    document.querySelectorAll('.stage-btn')[stageNum].classList.add('active');
  }

  const blocks = document.querySelectorAll('.stage-block');
  blocks.forEach(block => {
    if (stageNum === 'all') {
      block.style.display = '';
    } else {
      block.style.display = block.dataset.stage == stageNum ? '' : 'none';
    }
  });
}

// ========== INIT ==========
renderTree(DATA, container, 0);

// Set initial max-height for all children containers (expanded by default)
setTimeout(() => {
  document.querySelectorAll('.node-children').forEach(el => {
    el.style.maxHeight = '5000px';
  });
  document.querySelectorAll('.tree-list').forEach(el => {
    if (el.id && el.id.startsWith('children-s')) {
      el.style.maxHeight = '5000px';
    }
  });
}, 50);

// Keyboard: Escape closes card
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCard();
});
</script>
