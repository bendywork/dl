<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>激活函数可视化演示</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}

.topbar{
  background:linear-gradient(90deg,#13151f,#1a1d2e);
  border-bottom:1px solid #2a2d3e;
  padding:0 24px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar h1{font-size:1.1rem;color:#e2e8f0;font-weight:600;letter-spacing:.5px}
.topbar h1 span{color:#6ee7b7;margin-right:6px}
.topbar-right{display:flex;gap:10px;align-items:center}

.toggle-btn{
  padding:5px 14px;border-radius:6px;border:1px solid #3a3d4e;
  background:#1e2130;color:#cbd5e1;font-size:0.8rem;cursor:pointer;
  transition:all .15s;
}
.toggle-btn:hover{background:#2a2d40;border-color:#4a9eff;color:#fff}
.toggle-btn.active{background:#3b82f6;border-color:#3b82f6;color:#fff}

.main{display:flex;flex:1;overflow:hidden;min-height:0}

/* Left selector */
.selector{
  width:160px;flex-shrink:0;
  background:#0c0e16;border-right:1px solid #1e2130;
  padding:12px 8px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
}
.selector h3{font-size:0.72rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;padding:0 4px 8px;border-bottom:1px solid #1e2130;margin-bottom:4px}
.fn-btn{
  padding:8px 10px;border-radius:6px;border:1px solid transparent;
  background:transparent;color:#94a3b8;font-size:0.82rem;cursor:pointer;
  transition:all .15s;text-align:left;
}
.fn-btn:hover{background:#1e2130;color:#e2e8f0;border-color:#2a2d3e}
.fn-btn.active{background:#1a2540;color:#60a5fa;border-color:#3b82f6;font-weight:600}
.fn-btn .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

.compare-btn{
  margin-top:auto;padding:8px 10px;border-radius:6px;
  border:1px solid #3a3d4e;background:#1e2130;color:#cbd5e1;
  font-size:0.8rem;cursor:pointer;transition:all .15s;text-align:center;
}
.compare-btn:hover{background:#2a2d40;border-color:#8b5cf6;color:#a78bfa}
.compare-btn.active{background:#2d1f54;border-color:#8b5cf6;color:#a78bfa}

/* Center canvas area */
.canvas-area{
  flex:1;display:flex;flex-direction:column;background:#0c0e16;
  padding:16px;min-width:0;position:relative;
}
.canvas-title{
  font-size:0.9rem;color:#e2e8f0;margin-bottom:10px;
  display:flex;align-items:center;gap:12px;
}
.canvas-title .fn-name{font-size:1.1rem;font-weight:700;color:#60a5fa}
.canvas-title .fn-formula{color:#94a3b8;font-size:0.82rem;font-family:monospace}

#mainCanvas{
  flex:1;width:100%;border-radius:8px;border:1px solid #1e2130;
  cursor:crosshair;display:block;
}

.hover-info{
  position:absolute;pointer-events:none;
  background:#1a1d2e;border:1px solid #3a3d4e;border-radius:6px;
  padding:8px 12px;font-size:0.78rem;color:#e2e8f0;
  display:none;z-index:10;
}
.hover-info .hi-row{display:flex;gap:8px;align-items:center}
.hover-info .hi-label{color:#64748b}
.hover-info .hi-val{color:#60a5fa;font-family:monospace;font-weight:600}
.hover-info .hi-deriv{color:#f59e0b}

/* Right info panel */
.info-panel{
  width:240px;flex-shrink:0;
  background:#0c0e16;border-left:1px solid #1e2130;
  padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
}
.info-section{}
.info-section h4{
  font-size:0.72rem;color:#64748b;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:8px;
  border-bottom:1px solid #1e2130;padding-bottom:6px;
}
.formula-box{
  background:#13151f;border:1px solid #2a2d3e;border-radius:6px;
  padding:10px;font-family:monospace;font-size:0.82rem;color:#a78bfa;
  line-height:1.6;
}
.formula-box .deriv{color:#f59e0b;margin-top:4px}
.pros-cons{}
.tag{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:0.72rem;margin:2px;
}
.tag.pro{background:#052e16;color:#4ade80;border:1px solid #166534}
.tag.con{background:#2d0a0a;color:#f87171;border:1px solid #7f1d1d}
.use-case{
  background:#13151f;border-left:3px solid #3b82f6;
  padding:8px 10px;border-radius:0 4px 4px 0;
  font-size:0.78rem;color:#94a3b8;line-height:1.5;
}
.range-info{
  font-size:0.78rem;color:#64748b;line-height:1.6;
}
.range-info span{color:#e2e8f0}

@media(max-width:900px){
  .info-panel{display:none}
  .selector{width:120px}
}
@media(max-width:600px){
  .selector{width:100px}
  .selector .fn-btn{font-size:0.72rem;padding:6px 6px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1><span>⚡</span>激活函数可视化演示</h1>
  <div class="topbar-right">
    <button class="toggle-btn active" id="btnShowDeriv">显示导数</button>
    <button class="toggle-btn" id="btnCompare">全部对比</button>
  </div>
</div>

<div class="main">
  <!-- Left: function selector -->
  <div class="selector">
    <h3>激活函数</h3>
    <button class="fn-btn active" data-fn="sigmoid"><span class="dot" style="background:#60a5fa"></span>Sigmoid</button>
    <button class="fn-btn" data-fn="tanh"><span class="dot" style="background:#34d399"></span>Tanh</button>
    <button class="fn-btn" data-fn="relu"><span class="dot" style="background:#f87171"></span>ReLU</button>
    <button class="fn-btn" data-fn="leaky_relu"><span class="dot" style="background:#fb923c"></span>Leaky ReLU</button>
    <button class="fn-btn" data-fn="elu"><span class="dot" style="background:#a78bfa"></span>ELU</button>
    <button class="fn-btn" data-fn="gelu"><span class="dot" style="background:#38bdf8"></span>GELU</button>
    <button class="fn-btn" data-fn="swish"><span class="dot" style="background:#f472b6"></span>Swish</button>
    <button class="fn-btn" data-fn="mish"><span class="dot" style="background:#facc15"></span>Mish</button>
    <button class="fn-btn" data-fn="softplus"><span class="dot" style="background:#4ade80"></span>Softplus</button>
    <button class="fn-btn" data-fn="selu"><span class="dot" style="background:#e879f9"></span>SELU</button>
    <button class="compare-btn" id="compareBtn">⊞ 全部对比</button>
  </div>

  <!-- Center: canvas -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-title">
      <span class="fn-name" id="titleName">Sigmoid</span>
      <span class="fn-formula" id="titleFormula">f(x) = 1 / (1 + e⁻ˣ)</span>
    </div>
    <canvas id="mainCanvas"></canvas>
    <div class="hover-info" id="hoverInfo">
      <div class="hi-row"><span class="hi-label">x =</span><span class="hi-val" id="hiX">0.00</span></div>
      <div class="hi-row"><span class="hi-label">f(x) =</span><span class="hi-val" id="hiY">0.00</span></div>
      <div class="hi-row"><span class="hi-label">f′(x) =</span><span class="hi-deriv" id="hiD">0.00</span></div>
    </div>
  </div>

  <!-- Right: info panel -->
  <div class="info-panel" id="infoPanel">
    <div class="info-section">
      <h4>数学公式</h4>
      <div class="formula-box" id="infoFormula">
        f(x) = 1 / (1 + e⁻ˣ)<br>
        <span class="deriv">f′(x) = σ(x)(1 − σ(x))</span>
      </div>
    </div>
    <div class="info-section">
      <h4>输出范围</h4>
      <div class="range-info" id="infoRange">
        输出：<span>(0, 1)</span><br>
        导数：<span>(0, 0.25]</span>
      </div>
    </div>
    <div class="info-section">
      <h4>优缺点</h4>
      <div class="pros-cons" id="infoPros"></div>
    </div>
    <div class="info-section">
      <h4>适用场景</h4>
      <div class="use-case" id="infoUse"></div>
    </div>
  </div>
</div>

<script>
// ─── Activation functions ───────────────────────────────────────────────────
const sigmoid = x => 1 / (1 + Math.exp(-x));
const FUNCS = {
  sigmoid: {
    name: 'Sigmoid',
    formula: 'f(x) = 1 / (1 + e⁻ˣ)',
    formulaFull: 'f(x) = 1 / (1 + e⁻ˣ)',
    derivFull: "f′(x) = σ(x)(1 − σ(x))",
    range: '输出：<span>(0, 1)</span><br>导数：<span>(0, 0.25]</span>',
    color: '#60a5fa',
    fn: x => sigmoid(x),
    dfn: x => { const s = sigmoid(x); return s * (1 - s); },
    pros: ['概率解释性强','输出有界(0,1)','历史经典'],
    cons: ['梯度消失严重','输出非零中心','计算exp较慢'],
    use: '二分类输出层；逻辑回归；需要概率输出时'
  },
  tanh: {
    name: 'Tanh',
    formula: 'f(x) = tanh(x)',
    formulaFull: 'f(x) = (eˣ − e⁻ˣ) / (eˣ + e⁻ˣ)',
    derivFull: "f′(x) = 1 − tanh²(x)",
    range: '输出：<span>(−1, 1)</span><br>导数：<span>(0, 1]</span>',
    color: '#34d399',
    fn: x => Math.tanh(x),
    dfn: x => { const t = Math.tanh(x); return 1 - t * t; },
    pros: ['零中心输出','梯度比Sigmoid略强','RNN常用'],
    cons: ['仍有梯度消失','饱和区梯度趋近0'],
    use: 'RNN/LSTM隐藏层；特征需要对称分布时'
  },
  relu: {
    name: 'ReLU',
    formula: 'f(x) = max(0, x)',
    formulaFull: 'f(x) = max(0, x)',
    derivFull: "f′(x) = 1 if x>0 else 0",
    range: '输出：<span>[0, +∞)</span><br>导数：<span>{0, 1}</span>',
    color: '#f87171',
    fn: x => Math.max(0, x),
    dfn: x => x > 0 ? 1 : 0,
    pros: ['计算极快','缓解梯度消失','稀疏激活'],
    cons: ['Dead ReLU问题','输出非零中心','x<0梯度为0'],
    use: 'CNN隐藏层默认选择；大多数深度网络的首选'
  },
  leaky_relu: {
    name: 'Leaky ReLU',
    formula: 'f(x) = x if x>0 else 0.01x',
    formulaFull: 'f(x) = x (x>0) | 0.01x (x≤0)',
    derivFull: "f′(x) = 1 if x>0 else 0.01",
    range: '输出：<span>(−∞, +∞)</span><br>导数：<span>{0.01, 1}</span>',
    color: '#fb923c',
    fn: x => x > 0 ? x : 0.01 * x,
    dfn: x => x > 0 ? 1 : 0.01,
    pros: ['解决Dead ReLU','负区有梯度','计算简单'],
    cons: ['α需手动调参','效果不一定优于ReLU'],
    use: '替代ReLU当出现大量神经元死亡时'
  },
  elu: {
    name: 'ELU',
    formula: 'f(x) = x if x>0 else α(eˣ−1)',
    formulaFull: 'f(x) = x (x>0) | α(eˣ−1) (x≤0), α=1',
    derivFull: "f′(x) = 1 if x>0 else f(x)+α",
    range: '输出：<span>(−α, +∞)</span><br>导数：<span>(0, 1]</span>',
    color: '#a78bfa',
    fn: x => x > 0 ? x : (Math.exp(x) - 1),
    dfn: x => x > 0 ? 1 : Math.exp(x),
    pros: ['负区软饱和','均值接近0','噪声鲁棒性好'],
    cons: ['含exp计算较慢','α超参需调节'],
    use: 'CNN/DNN隐藏层；希望负区有软饱和时'
  },
  gelu: {
    name: 'GELU',
    formula: 'f(x) = x·Φ(x)',
    formulaFull: 'f(x) ≈ 0.5x(1+tanh(√(2/π)(x+0.044715x³)))',
    derivFull: "f′(x) = Φ(x) + x·φ(x)",
    range: '输出：<span>≈(−0.17, +∞)</span><br>导数：<span>连续平滑</span>',
    color: '#38bdf8',
    fn: x => {
      const c = Math.sqrt(2 / Math.PI);
      return 0.5 * x * (1 + Math.tanh(c * (x + 0.044715 * x * x * x)));
    },
    dfn: x => {
      const c = Math.sqrt(2 / Math.PI);
      const inner = c * (x + 0.044715 * x * x * x);
      const tanhVal = Math.tanh(inner);
      const dtanh = 1 - tanhVal * tanhVal;
      const dinner = c * (1 + 3 * 0.044715 * x * x);
      return 0.5 * (1 + tanhVal) + 0.5 * x * dtanh * dinner;
    },
    pros: ['平滑非线性','Transformer首选','兼顾正负区'],
    cons: ['计算复杂','近似实现有误差'],
    use: 'BERT / GPT / Transformer系列模型标配激活函数'
  },
  swish: {
    name: 'Swish / SiLU',
    formula: 'f(x) = x · σ(x)',
    formulaFull: 'f(x) = x · sigmoid(x)',
    derivFull: "f′(x) = f(x) + σ(x)(1 − f(x))",
    range: '输出：<span>≈(−0.28, +∞)</span><br>导数：<span>连续平滑</span>',
    color: '#f472b6',
    fn: x => x * sigmoid(x),
    dfn: x => {
      const s = sigmoid(x);
      const sw = x * s;
      return sw + s * (1 - sw);
    },
    pros: ['自门控机制','平滑无界','性能优于ReLU'],
    cons: ['计算含sigmoid','非单调性可能影响优化'],
    use: 'EfficientNet / MobileNet等高效CNN；谷歌推荐替代ReLU'
  },
  mish: {
    name: 'Mish',
    formula: 'f(x) = x · tanh(softplus(x))',
    formulaFull: 'f(x) = x·tanh(ln(1+eˣ))',
    derivFull: "f′(x) = tanh(sp) + x·sech²(sp)·σ(x)",
    range: '输出：<span>≈(−0.31, +∞)</span><br>导数：<span>连续平滑</span>',
    color: '#facc15',
    fn: x => {
      const sp = Math.log(1 + Math.exp(x));
      return x * Math.tanh(sp);
    },
    dfn: x => {
      const sp = Math.log(1 + Math.exp(x));
      const tanhSp = Math.tanh(sp);
      const sech2 = 1 - tanhSp * tanhSp;
      const s = sigmoid(x);
      return tanhSp + x * sech2 * s;
    },
    pros: ['平滑连续','下界≈-0.31','超参数少','YOLOv4首选'],
    cons: ['计算最复杂','比Swish略慢'],
    use: 'YOLOv4目标检测；追求极致精度时替代Swish'
  },
  softplus: {
    name: 'Softplus',
    formula: 'f(x) = ln(1 + eˣ)',
    formulaFull: 'f(x) = ln(1 + eˣ)',
    derivFull: "f′(x) = σ(x) = 1/(1+e⁻ˣ)",
    range: '输出：<span>(0, +∞)</span><br>导数：<span>(0, 1)</span>',
    color: '#4ade80',
    fn: x => Math.log(1 + Math.exp(x)),
    dfn: x => sigmoid(x),
    pros: ['ReLU的平滑版','全局可微','导数即Sigmoid'],
    cons: ['计算含exp+log','实际效果不如ReLU'],
    use: 'VAE输出正值方差参数；需要ReLU平滑版时'
  },
  selu: {
    name: 'SELU',
    formula: 'f(x) = λ(x if x>0 else α(eˣ−1))',
    formulaFull: 'λ≈1.0507, α≈1.6733',
    derivFull: "f′(x) = λ (x>0) | λα·eˣ (x≤0)",
    range: '输出：<span>(−λα, +∞)</span><br>导数：<span>连续</span>',
    color: '#e879f9',
    fn: x => {
      const lam = 1.0507009873554805;
      const alpha = 1.6732631921234396;
      return lam * (x > 0 ? x : alpha * (Math.exp(x) - 1));
    },
    dfn: x => {
      const lam = 1.0507009873554805;
      const alpha = 1.6732631921234396;
      return x > 0 ? lam : lam * alpha * Math.exp(x);
    },
    pros: ['自归一化特性','无需BN层','深网络表现好'],
    cons: ['仅全连接有自归一化','参数固定不灵活'],
    use: '全连接深层网络；无BN的情况下保持激活分布稳定'
  }
};

const FN_KEYS = Object.keys(FUNCS);
const COLORS = FN_KEYS.map(k => FUNCS[k].color);

// ─── State ───────────────────────────────────────────────────────────────────
let currentFn = 'sigmoid';
let showDeriv = true;
let compareMode = false;
let animProgress = 1; // 0→1 animation
let animFrom = null;
let animTo = null;
let animStartTime = null;
const ANIM_DUR = 400; // ms

// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const area = document.getElementById('canvasArea');
  const titleEl = area.querySelector('.canvas-title');
  const w = area.clientWidth - 32;
  const h = area.clientHeight - titleEl.offsetHeight - 32;
  canvas.width = w;
  canvas.height = Math.max(h, 200);
  draw();
}

// ─── Coordinate mapping ──────────────────────────────────────────────────────
const X_MIN = -6, X_MAX = 6;
const PAD = { top: 20, right: 20, bottom: 40, left: 52 };

function toCanvasX(x) {
  return PAD.left + (x - X_MIN) / (X_MAX - X_MIN) * (canvas.width - PAD.left - PAD.right);
}
function toCanvasY(y, yMin, yMax) {
  return PAD.top + (1 - (y - yMin) / (yMax - yMin)) * (canvas.height - PAD.top - PAD.bottom);
}
function fromCanvasX(cx) {
  return X_MIN + (cx - PAD.left) / (canvas.width - PAD.left - PAD.right) * (X_MAX - X_MIN);
}

function getYRange(fns) {
  let mn = Infinity, mx = -Infinity;
  const steps = 600;
  fns.forEach(fn => {
    for (let i = 0; i <= steps; i++) {
      const x = X_MIN + i / steps * (X_MAX - X_MIN);
      const y = fn(x);
      if (isFinite(y)) { mn = Math.min(mn, y); mx = Math.max(mx, y); }
    }
  });
  const pad = (mx - mn) * 0.12 + 0.3;
  return [mn - pad, mx + pad];
}

// ─── Drawing ─────────────────────────────────────────────────────────────────
function drawGrid(yMin, yMax) {
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  // vertical grid
  for (let x = Math.ceil(X_MIN); x <= Math.floor(X_MAX); x++) {
    const cx = toCanvasX(x);
    ctx.beginPath(); ctx.moveTo(cx, PAD.top); ctx.lineTo(cx, canvas.height - PAD.bottom);
    ctx.stroke();
  }
  // horizontal grid
  const yStep = niceStep(yMax - yMin, 6);
  const yStart = Math.ceil(yMin / yStep) * yStep;
  for (let y = yStart; y <= yMax + 1e-9; y += yStep) {
    const cy = toCanvasY(y, yMin, yMax);
    if (cy < PAD.top || cy > canvas.height - PAD.bottom) continue;
    ctx.beginPath(); ctx.moveTo(PAD.left, cy); ctx.lineTo(canvas.width - PAD.right, cy);
    ctx.stroke();
  }
}

function niceStep(range, targetTicks) {
  const rough = range / targetTicks;
  const pow = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / pow;
  let nice = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return nice * pow;
}

function drawAxes(yMin, yMax) {
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;

  // X axis
  const cy0 = toCanvasY(0, yMin, yMax);
  if (cy0 >= PAD.top && cy0 <= canvas.height - PAD.bottom) {
    ctx.beginPath(); ctx.moveTo(PAD.left, cy0); ctx.lineTo(canvas.width - PAD.right, cy0);
    ctx.stroke();
  }
  // Y axis
  const cx0 = toCanvasX(0);
  ctx.beginPath(); ctx.moveTo(cx0, PAD.top); ctx.lineTo(cx0, canvas.height - PAD.bottom);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#64748b';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  for (let x = Math.ceil(X_MIN); x <= Math.floor(X_MAX); x++) {
    if (x === 0) continue;
    const cx = toCanvasX(x);
    const cy = Math.min(Math.max(cy0, PAD.top), canvas.height - PAD.bottom);
    ctx.fillText(x, cx, cy + 14);
  }
  ctx.fillText('0', toCanvasX(0) - 14, cy0 + 14);

  ctx.textAlign = 'right';
  const yStep = niceStep(yMax - yMin, 6);
  const yStart = Math.ceil(yMin / yStep) * yStep;
  for (let y = yStart; y <= yMax + 1e-9; y += yStep) {
    const cy = toCanvasY(y, yMin, yMax);
    if (cy < PAD.top || cy > canvas.height - PAD.bottom) continue;
    const label = Math.abs(y) < 1e-9 ? '0' : (Math.abs(y) >= 10 ? y.toFixed(0) : y.toFixed(1));
    ctx.fillText(label, PAD.left - 6, cy + 4);
  }
}

function drawCurve(fn, color, dashed, yMin, yMax, alpha) {
  const steps = canvas.width * 2;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = dashed ? 2 : 2.5;
  if (dashed) ctx.setLineDash([6, 4]);
  else ctx.setLineDash([]);

  let first = true;
  for (let i = 0; i <= steps; i++) {
    const x = X_MIN + i / steps * (X_MAX - X_MIN);
    const y = fn(x);
    if (!isFinite(y)) { first = true; continue; }
    const cx = toCanvasX(x);
    const cy = toCanvasY(y, yMin, yMax);
    if (first) { ctx.moveTo(cx, cy); first = false; }
    else ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function drawAnimCurve(fnFrom, fnTo, progress, color, dashed, yMin, yMax) {
  const steps = canvas.width * 2;
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = dashed ? 2 : 2.5;
  if (dashed) ctx.setLineDash([6, 4]);
  else ctx.setLineDash([]);

  let first = true;
  for (let i = 0; i <= steps; i++) {
    const x = X_MIN + i / steps * (X_MAX - X_MIN);
    const yA = fnFrom(x), yB = fnTo(x);
    if (!isFinite(yA) || !isFinite(yB)) { first = true; continue; }
    const y = yA + (yB - yA) * easeInOut(progress);
    const cx = toCanvasX(x);
    const cy = toCanvasY(y, yMin, yMax);
    if (first) { ctx.moveTo(cx, cy); first = false; }
    else ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

function draw(ts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (compareMode) {
    drawCompare();
    return;
  }

  const fd = FUNCS[currentFn];
  let yMin, yMax;

  if (animFrom && animProgress < 1) {
    const fnsForRange = [animFrom.fn, animTo.fn];
    if (showDeriv) fnsForRange.push(animFrom.dfn, animTo.dfn);
    [yMin, yMax] = getYRange(fnsForRange);
  } else {
    const fnsForRange = [fd.fn];
    if (showDeriv) fnsForRange.push(fd.dfn);
    [yMin, yMax] = getYRange(fnsForRange);
  }

  drawGrid(yMin, yMax);
  drawAxes(yMin, yMax);

  if (animFrom && animProgress < 1) {
    if (showDeriv) {
      drawAnimCurve(animFrom.dfn, animTo.dfn, animProgress, fd.color, true, yMin, yMax);
    }
    drawAnimCurve(animFrom.fn, animTo.fn, animProgress, fd.color, false, yMin, yMax);
  } else {
    if (showDeriv) {
      drawCurve(fd.dfn, fd.color, true, yMin, yMax, 0.55);
    }
    drawCurve(fd.fn, fd.color, false, yMin, yMax, 1);
  }

  // Legend
  if (showDeriv) {
    drawLegend(fd.color);
  }
}

function drawLegend(color) {
  const lx = canvas.width - PAD.right - 110;
  const ly = PAD.top + 8;
  ctx.fillStyle = 'rgba(13,17,23,0.85)';
  ctx.strokeStyle = '#2a2d3e';
  ctx.lineWidth = 1;
  roundRect(ctx, lx - 8, ly - 6, 118, 44, 5);
  ctx.fill();
  ctx.stroke();

  // solid line
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(lx, ly + 7); ctx.lineTo(lx + 24, ly + 7); ctx.stroke();
  ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('f(x) 函数', lx + 30, ly + 11);

  // dashed line
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 3]);
  ctx.globalAlpha = 0.6;
  ctx.beginPath(); ctx.moveTo(lx, ly + 26); ctx.lineTo(lx + 24, ly + 26); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#94a3b8';
  ctx.fillText("f′(x) 导数", lx + 30, ly + 30);
}

function drawCompare() {
  const allFns = FN_KEYS.map(k => FUNCS[k].fn);
  const allDfns = FN_KEYS.map(k => FUNCS[k].dfn);
  const forRange = showDeriv ? [...allFns, ...allDfns] : allFns;
  const [yMin, yMax] = getYRange(forRange);

  drawGrid(yMin, yMax);
  drawAxes(yMin, yMax);

  FN_KEYS.forEach((k, i) => {
    const fd = FUNCS[k];
    if (showDeriv) drawCurve(fd.dfn, fd.color, true, yMin, yMax, 0.4);
    drawCurve(fd.fn, fd.color, false, yMin, yMax, 0.9);
  });

  // Compare legend
  drawCompareLegend();
}

function drawCompareLegend() {
  const cols = 2;
  const itemH = 20;
  const itemW = 100;
  const rows = Math.ceil(FN_KEYS.length / cols);
  const lw = cols * itemW + 16;
  const lh = rows * itemH + 16;
  const lx = canvas.width - PAD.right - lw - 4;
  const ly = PAD.top + 4;

  ctx.fillStyle = 'rgba(13,17,23,0.9)';
  ctx.strokeStyle = '#2a2d3e';
  ctx.lineWidth = 1;
  roundRect(ctx, lx, ly, lw, lh, 6);
  ctx.fill();
  ctx.stroke();

  FN_KEYS.forEach((k, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const x = lx + 8 + col * itemW;
    const y = ly + 10 + row * itemH;
    ctx.strokeStyle = FUNCS[k].color;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(x, y + 5); ctx.lineTo(x + 16, y + 5); ctx.stroke();
    ctx.fillStyle = '#e2e8f0'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(FUNCS[k].name, x + 20, y + 9);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── Animation loop ───────────────────────────────────────────────────────────
function animate(ts) {
  if (animFrom && animProgress < 1) {
    if (!animStartTime) animStartTime = ts;
    animProgress = Math.min((ts - animStartTime) / ANIM_DUR, 1);
    if (animProgress >= 1) {
      animFrom = null;
      animStartTime = null;
    }
  }
  draw(ts);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ─── UI Updates ───────────────────────────────────────────────────────────────
function switchFn(key) {
  if (key === currentFn && !compareMode) return;
  compareMode = false;
  document.getElementById('btnCompare').classList.remove('active');
  document.getElementById('compareBtn').classList.remove('active');
  document.querySelector('.canvas-title').style.display = '';

  // Setup animation
  const prevFd = FUNCS[currentFn];
  animFrom = { fn: prevFd.fn, dfn: prevFd.dfn };
  animTo = { fn: FUNCS[key].fn, dfn: FUNCS[key].dfn };
  animProgress = 0;
  animStartTime = null;

  currentFn = key;
  updateUI();
}

function updateUI() {
  const fd = FUNCS[currentFn];
  document.getElementById('titleName').textContent = fd.name;
  document.getElementById('titleFormula').textContent = fd.formula;
  document.getElementById('infoFormula').innerHTML =
    fd.formulaFull + '<br><span class="deriv">' + fd.derivFull + '</span>';
  document.getElementById('infoRange').innerHTML = fd.range;

  const prosEl = document.getElementById('infoPros');
  prosEl.innerHTML = fd.pros.map(p => `<span class="tag pro">✓ ${p}</span>`).join('') +
    fd.cons.map(c => `<span class="tag con">✗ ${c}</span>`).join('');
  document.getElementById('infoUse').textContent = fd.use;

  // Buttons
  document.querySelectorAll('.fn-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.fn === currentFn);
  });
}

// ─── Hover tooltip ────────────────────────────────────────────────────────────
const hoverInfo = document.getElementById('hoverInfo');
canvas.addEventListener('mousemove', e => {
  if (compareMode) { hoverInfo.style.display = 'none'; return; }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (mx < PAD.left || mx > canvas.width - PAD.right ||
      my < PAD.top || my > canvas.height - PAD.bottom) {
    hoverInfo.style.display = 'none'; return;
  }

  const fd = FUNCS[currentFn];
  const fnsForRange = [fd.fn]; if (showDeriv) fnsForRange.push(fd.dfn);
  const [yMin, yMax] = getYRange(fnsForRange);

  const x = fromCanvasX(mx);
  const fy = fd.fn(x);
  const dfy = fd.dfn(x);

  document.getElementById('hiX').textContent = x.toFixed(3);
  document.getElementById('hiY').textContent = fy.toFixed(4);
  document.getElementById('hiD').textContent = dfy.toFixed(4);

  const area = document.getElementById('canvasArea');
  const areaRect = area.getBoundingClientRect();
  let tx = e.clientX - areaRect.left + 12;
  let ty = e.clientY - areaRect.top + 12;
  if (tx + 140 > area.clientWidth) tx -= 150;
  if (ty + 80 > area.clientHeight) ty -= 90;
  hoverInfo.style.left = tx + 'px';
  hoverInfo.style.top = ty + 'px';
  hoverInfo.style.display = 'block';

  // Draw crosshair dot
  const cy = toCanvasY(fy, yMin, yMax);
  // The dot is drawn in the next frame automatically; store state
  hoverX = mx; hoverY = cy; hoverActive = true;
});
canvas.addEventListener('mouseleave', () => {
  hoverInfo.style.display = 'none';
  hoverActive = false;
});

let hoverX = 0, hoverY = 0, hoverActive = false;

// Override draw to add crosshair
const origDraw = draw;
function draw(ts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (compareMode) { drawCompare(); }
  else {
    const fd = FUNCS[currentFn];
    let yMin, yMax;
    if (animFrom && animProgress < 1) {
      const fnsForRange = [animFrom.fn, animTo.fn];
      if (showDeriv) fnsForRange.push(animFrom.dfn, animTo.dfn);
      [yMin, yMax] = getYRange(fnsForRange);
    } else {
      const fnsForRange = [fd.fn];
      if (showDeriv) fnsForRange.push(fd.dfn);
      [yMin, yMax] = getYRange(fnsForRange);
    }

    drawGrid(yMin, yMax);
    drawAxes(yMin, yMax);

    if (animFrom && animProgress < 1) {
      if (showDeriv) drawAnimCurve(animFrom.dfn, animTo.dfn, animProgress, fd.color, true, yMin, yMax);
      drawAnimCurve(animFrom.fn, animTo.fn, animProgress, fd.color, false, yMin, yMax);
    } else {
      if (showDeriv) drawCurve(fd.dfn, fd.color, true, yMin, yMax, 0.55);
      drawCurve(fd.fn, fd.color, false, yMin, yMax, 1);
    }
    if (showDeriv) drawLegend(fd.color);

    // Crosshair
    if (hoverActive && !(animFrom && animProgress < 1)) {
      const x = fromCanvasX(hoverX);
      const fy = fd.fn(x);
      const cy = toCanvasY(fy, yMin, yMax);
      ctx.beginPath();
      ctx.arc(hoverX, cy, 5, 0, Math.PI * 2);
      ctx.fillStyle = fd.color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // vertical guide line
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      ctx.moveTo(hoverX, PAD.top);
      ctx.lineTo(hoverX, canvas.height - PAD.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

// ─── Button events ─────────────────────────────────────────────────────────────
document.querySelectorAll('.fn-btn').forEach(btn => {
  btn.addEventListener('click', () => switchFn(btn.dataset.fn));
});

document.getElementById('btnShowDeriv').addEventListener('click', function() {
  showDeriv = !showDeriv;
  this.classList.toggle('active', showDeriv);
});

function enterCompare() {
  compareMode = true;
  document.getElementById('btnCompare').classList.add('active');
  document.getElementById('compareBtn').classList.add('active');
  document.querySelectorAll('.fn-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('titleName').textContent = '全部对比';
  document.getElementById('titleFormula').textContent = '所有激活函数叠加显示';
}

document.getElementById('btnCompare').addEventListener('click', function() {
  if (compareMode) {
    compareMode = false;
    this.classList.remove('active');
    document.getElementById('compareBtn').classList.remove('active');
    updateUI();
  } else {
    enterCompare();
  }
});
document.getElementById('compareBtn').addEventListener('click', function() {
  if (compareMode) {
    compareMode = false;
    this.classList.remove('active');
    document.getElementById('btnCompare').classList.remove('active');
    updateUI();
  } else {
    enterCompare();
  }
});

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
updateUI();
</script>
