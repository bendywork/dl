<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSTM 交互式动画 — TF Playground 风格</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── 顶部标题栏 ── */
.topbar{
  background:linear-gradient(90deg,#13151f,#1a1d2e);
  border-bottom:1px solid #2a2d3e;
  padding:0 24px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.topbar h1{font-size:1.1rem;color:#e2e8f0;font-weight:600;letter-spacing:.5px}
.topbar h1 span{color:#6ee7b7;margin-right:6px}
.ctrl-group{display:flex;gap:10px;align-items:center}
.ctrl-btn{
  padding:6px 16px;border-radius:6px;border:1px solid #3a3d4e;
  background:#1e2130;color:#cbd5e1;font-size:0.82rem;cursor:pointer;
  transition:all .15s;
}
.ctrl-btn:hover{background:#2a2d40;color:#fff;border-color:#4a9eff}
.ctrl-btn.primary{background:#3b82f6;border-color:#3b82f6;color:#fff}
.ctrl-btn.primary:hover{background:#2563eb}
.speed-wrap{display:flex;align-items:center;gap:6px;font-size:.8rem;color:#94a3b8}
.speed-wrap input{width:80px;accent-color:#3b82f6}

/* ── 进度条 ── */
.progress-track{height:3px;background:#1e2130;flex-shrink:0}
.progress-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6,#6ee7b7);transition:width .3s;width:0%}

/* ── 主体 ── */
.main{display:flex;flex:1;overflow:hidden}

/* ── 左侧图示 ── */
.diagram-col{
  width:52%;border-right:1px solid #1e2130;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px;position:relative;background:#0c0e16;
}
#lstmCanvas{width:100%;max-width:600px;max-height:calc(100vh - 120px)}

/* ── 右侧面板 ── */
.right-col{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  padding:20px 24px 0;
}

/* 步骤区 */
.step-area{flex:1;overflow-y:auto;padding-bottom:12px}
.step-section-tag{
  font-size:.7rem;letter-spacing:2px;font-weight:700;
  color:#3b82f6;margin-bottom:6px;text-transform:uppercase;
}
.step-title{font-size:1.25rem;font-weight:700;color:#f1f5f9;margin-bottom:14px;line-height:1.4}
.step-body{font-size:.88rem;color:#94a3b8;line-height:1.85}
.step-body .hl{color:#fcd34d;font-weight:600}
.step-body .gr{color:#6ee7b7;font-weight:600}
.step-body .pk{color:#f472b6;font-weight:600}
.step-body .bl{color:#60a5fa;font-weight:600}
.step-body .or{color:#fb923c;font-weight:600}
.step-body .vl{color:#a78bfa;font-weight:600}
.formula-box{
  background:#141726;border-left:3px solid #3b82f6;
  padding:10px 14px;border-radius:4px;margin:10px 0;
  font-family:'Courier New',monospace;font-size:.9rem;
  color:#7dd3fc;line-height:1.7;
}

/* 数值可视化区 */
.vals-area{
  border-top:1px solid #1e2130;padding:14px 0 16px;
  display:flex;flex-direction:column;gap:10px;
  flex-shrink:0;
}
.val-row{display:flex;align-items:center;gap:10px}
.val-label{font-size:.75rem;color:#64748b;min-width:70px;font-family:monospace}
.vec-bars{display:flex;gap:4px;align-items:flex-end}
.vec-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.vec-bar{
  width:26px;border-radius:3px 3px 0 0;
  transition:height .4s ease,background-color .4s ease;
  min-height:2px;
}
.vec-val{font-size:.65rem;color:#64748b;font-family:monospace}

/* ── 底部导航 ── */
.nav-bar{
  height:54px;background:#0c0e16;border-top:1px solid #1e2130;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0;
}
.nav-btn{
  padding:8px 22px;border-radius:7px;border:none;cursor:pointer;
  font-size:.88rem;font-weight:600;transition:all .15s;
}
.nav-btn.prev{background:#1e2130;color:#94a3b8}
.nav-btn.prev:hover:not(:disabled){background:#2a2d40;color:#fff}
.nav-btn.next{background:#3b82f6;color:#fff}
.nav-btn.next:hover:not(:disabled){background:#2563eb}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.step-counter{font-size:.82rem;color:#64748b}
.dot-row{display:flex;gap:5px;align-items:center}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:#2a2d40;cursor:pointer;transition:all .2s;
}
.dot.done{background:#3b82f640}
.dot.active{background:#3b82f6;transform:scale(1.5)}

/* Canvas 粒子流 */
canvas{display:block}
</style>
</head>
<body>

<div class="topbar">
  <h1><span>🧠</span>LSTM 交互式动画 · 完整原理讲解</h1>
  <div class="ctrl-group">
    <div class="speed-wrap">
      速度 <input type="range" id="speedSlider" min="0.5" max="3" step="0.5" value="1">
      <span id="speedVal">1×</span>
    </div>
    <button class="ctrl-btn" id="autoBtn" onclick="toggleAuto()">▶ 自动播放</button>
    <button class="ctrl-btn" onclick="resetAll()">↺ 重置</button>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progFill"></div></div>

<div class="main">
  <!-- 左侧 Canvas 图示 -->
  <div class="diagram-col">
    <canvas id="lstmCanvas"></canvas>
  </div>

  <!-- 右侧讲解 + 数值 -->
  <div class="right-col">
    <div class="step-area" id="stepArea">
      <div class="step-section-tag" id="sTag">SECTION 0</div>
      <div class="step-title" id="sTitle">加载中...</div>
      <div class="step-body" id="sBody"></div>
    </div>
    <div class="vals-area" id="valsArea">
      <!-- 动态注入 -->
    </div>
  </div>
</div>

<div class="nav-bar">
  <button class="nav-btn prev" id="prevBtn" onclick="go(-1)" disabled>← 上一步</button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div class="step-counter" id="sCnt">步骤 1 / 35</div>
    <div class="dot-row" id="dotRow"></div>
  </div>
  <button class="nav-btn next" id="nextBtn" onclick="go(1)">下一步 →</button>
</div>

<script>
// ════════════════════════════════════════════════════
//  CANVAS 绘图引擎
// ════════════════════════════════════════════════════
const canvas = document.getElementById('lstmCanvas');
const ctx = canvas.getContext('2d');

// 响应式
function resizeCanvas() {
  const col = canvas.parentElement;
  const w = Math.min(col.clientWidth - 32, 580);
  const h = Math.min(col.clientHeight - 32, 520);
  canvas.width = w;
  canvas.height = h;
  draw();
}
window.addEventListener('resize', resizeCanvas);

// ── 布局坐标（归一化到0-1，运行时×宽高）
// 坐标系：(cx, cy) 表示组件中心占画布比例
const LAYOUT = {
  // 输入
  xIn:    { cx:.15, cy:.88, type:'node', label:'x_t',    color:'#3b82f6' },
  hPrev:  { cx:.06, cy:.62, type:'node', label:'h_{t-1}',color:'#8b5cf6' },
  cPrev:  { cx:.06, cy:.15, type:'pass', label:'C_{t-1}',color:'#10b981' },

  // 三个门
  gateF:  { cx:.30, cy:.55, type:'gate', label:'σ', title:'遗忘门 f_t', color:'#f59e0b' },
  gateI:  { cx:.50, cy:.55, type:'gate', label:'σ', title:'输入门 i_t', color:'#ec4899' },
  gateG:  { cx:.65, cy:.55, type:'gate', label:'tanh',title:'候选值 g_t',color:'#8b5cf6' },
  gateO:  { cx:.82, cy:.55, type:'gate', label:'σ', title:'输出门 o_t', color:'#06b6d4' },

  // 乘法/加法节点
  multF:  { cx:.30, cy:.32, type:'op',   label:'×', color:'#f59e0b' },
  multI:  { cx:.58, cy:.32, type:'op',   label:'×', color:'#ec4899' },
  addC:   { cx:.72, cy:.15, type:'op',   label:'+', color:'#10b981' },
  tanhC:  { cx:.82, cy:.32, type:'gate', label:'tanh',title:'tanh(C_t)',color:'#10b981' },
  multO:  { cx:.90, cy:.62, type:'op',   label:'×', color:'#06b6d4' },

  // 输出
  cOut:   { cx:.94, cy:.15, type:'pass', label:'C_t',   color:'#10b981' },
  hOut:   { cx:.94, cy:.75, type:'node', label:'h_t',   color:'#8b5cf6' },
};

// 边（from, to, color）
const EDGES = [
  ['cPrev','multF','#f59e0b'],
  ['multF','addC','#10b981'],
  ['gateI','multI','#ec4899'],
  ['gateG','multI','#8b5cf6'],
  ['multI','addC','#10b981'],
  ['addC','cOut','#10b981'],
  ['addC','tanhC','#10b981'],
  ['tanhC','multO','#06b6d4'],
  ['gateO','multO','#06b6d4'],
  ['multO','hOut','#8b5cf6'],
  ['gateF','multF','#f59e0b'],
  // 输入拼接线（简化）
  ['xIn','gateF','#94a3b830'],
  ['xIn','gateI','#94a3b830'],
  ['xIn','gateG','#94a3b830'],
  ['xIn','gateO','#94a3b830'],
  ['hPrev','gateF','#94a3b830'],
  ['hPrev','gateI','#94a3b830'],
  ['hPrev','gateG','#94a3b830'],
  ['hPrev','gateO','#94a3b830'],
];

// 当前高亮节点集合
let activeNodes = new Set();
let activeEdges = new Set();
let particles = [];

function px(node) {
  return { x: node.cx * canvas.width, y: node.cy * canvas.height };
}

function drawRoundRect(x, y, w, h, r, fill, stroke, glow) {
  ctx.save();
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 18;
  }
  ctx.beginPath();
  ctx.roundRect(x - w/2, y - h/2, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = glow ? 2 : 1.5;
  ctx.stroke();
  ctx.restore();
}

function drawCircle(x, y, r, fill, stroke, glow) {
  ctx.save();
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 18;
  }
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = glow ? 2 : 1.5;
  ctx.stroke();
  ctx.restore();
}

function getNodePos(key) {
  const n = LAYOUT[key];
  return { x: n.cx * canvas.width, y: n.cy * canvas.height };
}

function drawArrow(x1, y1, x2, y2, color, glow) {
  const alpha = glow ? 1 : 0.25;
  ctx.save();
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 8; }
  ctx.strokeStyle = color + Math.round(alpha*255).toString(16).padStart(2,'0');
  ctx.lineWidth = glow ? 2 : 1;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  // 箭头头
  const angle = Math.atan2(y2-y1, x2-x1);
  const al = glow ? 9 : 6;
  ctx.fillStyle = color + Math.round(alpha*255).toString(16).padStart(2,'0');
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - al*Math.cos(angle-0.4), y2 - al*Math.sin(angle-0.4));
  ctx.lineTo(x2 - al*Math.cos(angle+0.4), y2 - al*Math.sin(angle+0.4));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 门的值（用于热力图颜色）
const gateValues = { gateF:0.5, gateI:0.5, gateG:0, gateO:0.5 };
// 细胞状态值
let vecC_prev = [1.2, -0.8, 0.5, 2.1];
let vecF = [0.5,0.5,0.5,0.5];
let vecI = [0.5,0.5,0.5,0.5];
let vecG = [0,0,0,0];
let vecO = [0.5,0.5,0.5,0.5];
let vecC = [1.2,-0.8,0.5,2.1];
let vecH = [0,0,0,0];

function gateColor(val) {
  // 0=蓝, 0.5=绿, 1=橙红
  if (val < 0.5) {
    const t = val * 2;
    const r = Math.round(30 + t * 16);
    const g = Math.round(144 + t * (184-144));
    const b = Math.round(255 - t * (255-88));
    return `rgb(${r},${g},${b})`;
  } else {
    const t = (val - 0.5) * 2;
    const r = Math.round(46 + t * (251-46));
    const g = Math.round(200 - t * (200-140));
    const b = Math.round(100 - t * (100-0));
    return `rgb(${r},${g},${b})`;
  }
}

function draw() {
  if (!canvas.width || !canvas.height) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const W = canvas.width, H = canvas.height;
  const nodeR = Math.min(W, H) * 0.048;
  const gateW = nodeR * 2.2, gateH = nodeR * 1.4;

  // ── 画边
  EDGES.forEach(([from, to, col]) => {
    const p1 = getNodePos(from);
    const p2 = getNodePos(to);
    const isActive = activeEdges.has(`${from}-${to}`);
    drawArrow(p1.x, p1.y, p2.x, p2.y, col.slice(0,7), isActive);
  });

  // ── 细胞状态主线（顶部高速公路）
  ctx.save();
  const cLineY = LAYOUT.cPrev.cy * H;
  const isGreenActive = activeNodes.has('cLine');
  ctx.shadowColor = '#10b981';
  ctx.shadowBlur = isGreenActive ? 14 : 0;
  ctx.strokeStyle = isGreenActive ? '#10b981' : '#10b98150';
  ctx.lineWidth = isGreenActive ? 2.5 : 1.5;
  ctx.setLineDash([8, 4]);
  ctx.beginPath();
  ctx.moveTo(LAYOUT.cPrev.cx * W, cLineY);
  ctx.lineTo(LAYOUT.cOut.cx * W, cLineY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // ── 画节点
  Object.entries(LAYOUT).forEach(([key, n]) => {
    const p = getNodePos(key);
    const isActive = activeNodes.has(key);
    const glow = isActive ? n.color : null;

    if (n.type === 'gate') {
      // 门：圆角矩形，带热力图填充
      let fillColor = '#1a1d2e';
      if ((key === 'gateF' || key === 'gateI' || key === 'gateO') && isActive) {
        fillColor = gateColor(gateValues[key] || 0.5);
      } else if (key === 'gateG' && isActive) {
        const v = (gateValues.gateG + 1) / 2;
        fillColor = gateColor(v);
      }
      drawRoundRect(p.x, p.y, gateW, gateH, 6, fillColor, isActive ? n.color : n.color+'60', glow);
      ctx.fillStyle = isActive ? '#fff' : '#94a3b8';
      ctx.font = `bold ${Math.round(gateH*0.52)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label, p.x, p.y - 2);
      if (n.title) {
        ctx.font = `${Math.round(gateH*0.33)}px sans-serif`;
        ctx.fillStyle = isActive ? n.color : '#475569';
        ctx.fillText(n.title, p.x, p.y + gateH*0.5 + 9);
      }
      // 门值标注
      if (isActive && key !== 'gateG') {
        ctx.font = `bold ${Math.round(gateH*0.38)}px monospace`;
        ctx.fillStyle = '#fcd34d';
        ctx.fillText(gateValues[key]?.toFixed(2) || '', p.x, p.y + gateH*0.28);
      }
    } else if (n.type === 'op') {
      drawCircle(p.x, p.y, nodeR * 0.8, isActive ? '#1e2130' : '#141726', isActive ? n.color : n.color+'50', glow);
      ctx.fillStyle = isActive ? n.color : '#64748b';
      ctx.font = `bold ${Math.round(nodeR * 1.2)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label, p.x, p.y + 1);
    } else {
      // 普通节点
      drawCircle(p.x, p.y, nodeR * 0.9, isActive ? '#1e2130' : '#141726', isActive ? n.color : n.color+'60', glow);
      ctx.fillStyle = isActive ? n.color : '#64748b';
      ctx.font = `bold ${Math.round(nodeR * 0.7)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label, p.x, p.y);
    }
  });

  // ── 粒子
  particles.forEach(p => {
    ctx.save();
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fill();
    ctx.restore();
  });
}

// ── 粒子动画
let animId = null;
function spawnParticles(fromKey, toKey, color, count = 6) {
  const p1 = getNodePos(fromKey);
  const p2 = getNodePos(toKey);
  for (let i = 0; i < count; i++) {
    const t0 = i / count;
    particles.push({
      x: p1.x, y: p1.y,
      tx: p2.x, ty: p2.y,
      t: t0 * -1, speed: 0.012 + Math.random() * 0.008,
      color, r: 3.5, alpha: 1,
    });
  }
}

function tickParticles() {
  particles = particles.filter(p => p.alpha > 0.05);
  particles.forEach(p => {
    p.t += p.speed;
    if (p.t < 0) return;
    if (p.t > 1) { p.alpha -= 0.06; return; }
    p.x = p.x + (p.tx - p.x) * p.speed * 3;
    p.y = p.y + (p.ty - p.y) * p.speed * 3;
    // 实际直线插值
    const prog = Math.min(p.t, 1);
    const src = getNodePos;
    p.x = LAYOUT[Object.keys(LAYOUT).find(k => getNodePos(k).x === p.tx && getNodePos(k).y === p.ty) || 'hOut'].cx;
  });
}

// 简单线性粒子系统
class Particle {
  constructor(x1,y1,x2,y2,color) {
    this.sx=x1; this.sy=y1; this.ex=x2; this.ey=y2;
    this.t=0; this.color=color; this.alive=true;
    this.speed=0.018+Math.random()*0.01;
  }
  update() {
    this.t += this.speed;
    if(this.t>=1){this.alive=false;return;}
    this.x = this.sx + (this.ex-this.sx)*this.t;
    this.y = this.sy + (this.ey-this.sy)*this.t;
  }
  draw(ctx) {
    ctx.save();
    ctx.shadowColor=this.color; ctx.shadowBlur=14;
    ctx.globalAlpha=1-this.t*0.5;
    ctx.beginPath(); ctx.arc(this.x,this.y,4,0,Math.PI*2);
    ctx.fillStyle=this.color; ctx.fill();
    ctx.restore();
  }
}
let liveParticles = [];
function fireParticles(fromKey, toKey, color, n=5) {
  const p1=getNodePos(fromKey), p2=getNodePos(toKey);
  for(let i=0;i<n;i++){
    const p = new Particle(p1.x,p1.y,p2.x,p2.y,color);
    p.t = i/n * -0.3;
    liveParticles.push(p);
  }
}
function animLoop() {
  liveParticles = liveParticles.filter(p=>p.alive);
  liveParticles.forEach(p=>{ p.update(); });
  draw();
  liveParticles.forEach(p=>{ if(p.t>0) p.draw(ctx); });
  animId = requestAnimationFrame(animLoop);
}

// ════════════════════════════════════════════════════
//  步骤数据
// ════════════════════════════════════════════════════
const STEPS = [
{
  section:'SECTION 0 · 概述',
  title:'欢迎！LSTM 是什么？',
  active:[],
  edges:[],
  vals:null,
  particles:[],
  body:`在开始动画之前，先建立<span class="gr">最重要的直觉</span>：<br><br>
<span class="hl">普通 RNN 的致命缺陷</span>：梯度在时间轴反向传播时<b>指数级消失</b>，导致网络只能记住最近 10~20 步。<br><br>
<span class="gr">LSTM 的解决方案</span>：在网络内部建造一条"细胞状态高速公路" C_t，让信息可以几乎无损地沿时间轴传递，同时用三个可学习的"门"精确控制信息流。<br><br>
接下来，我们通过 <b>35 个步骤</b>把每一个计算细节都可视化讲清楚。<br><br>
<span class="bl">操作提示</span>：点击"下一步"或按键盘 → 键逐步推进，左侧图示会实时高亮当前正在计算的组件。`,
},{
  section:'SECTION 0 · 概述',
  title:'LSTM 单元的三个输入、两个输出',
  active:['xIn','hPrev','cPrev','hOut','cOut','cLine'],
  edges:[],
  vals:{
    'C_{t-1}': vecC_prev,
    'h_{t-1}': [0.3, -0.1, 0.7, 0.2],
    'x_t': [1.0, 0.0, -0.5, 0.8],
  },

  body:`<div class="formula-box">class LSTMCell(nn.Module):<br>
&nbsp;&nbsp;def __init__(self, input_size, hidden_size):<br>
&nbsp;&nbsp;&nbsp;&nbsp;super().__init__()<br>
&nbsp;&nbsp;&nbsp;&nbsp;# 4个门合并成一个大矩阵<br>
&nbsp;&nbsp;&nbsp;&nbsp;self.W = nn.Linear(<br>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;input_size + hidden_size, 4 * hidden_size<br>
&nbsp;&nbsp;&nbsp;&nbsp;)<br>
&nbsp;&nbsp;def forward(self, x, h_prev, c_prev):<br>
&nbsp;&nbsp;&nbsp;&nbsp;combined = torch.cat([h_prev, x], dim=1)<br>
&nbsp;&nbsp;&nbsp;&nbsp;gates = self.W(combined)<br>
&nbsp;&nbsp;&nbsp;&nbsp;z_f, z_i, z_g, z_o = gates.chunk(4, dim=1)<br>
&nbsp;&nbsp;&nbsp;&nbsp;f = torch.sigmoid(z_f)<br>
&nbsp;&nbsp;&nbsp;&nbsp;i = torch.sigmoid(z_i)<br>
&nbsp;&nbsp;&nbsp;&nbsp;g = torch.tanh(z_g)<br>
&nbsp;&nbsp;&nbsp;&nbsp;o = torch.sigmoid(z_o)<br>
&nbsp;&nbsp;&nbsp;&nbsp;c = f * c_prev + i * g<br>
&nbsp;&nbsp;&nbsp;&nbsp;h = o * torch.tanh(c)<br>
&nbsp;&nbsp;&nbsp;&nbsp;return h, c</div>`,

// ════════════════════════════════════════════════════
//  步骤控制逻辑
// ════════════════════════════════════════════════════
let cur = 0;
const total = STEPS.length;
let autoTimer = null;
let isAuto = false;

function getSpeed() {
  return parseFloat(document.getElementById('speedSlider').value);
}

document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value + '×';
  if (isAuto) { clearInterval(autoTimer); startAutoTimer(); }
});

function startAutoTimer() {
  autoTimer = setInterval(() => {
    if (cur < total - 1) go(1);
    else stopAuto();
  }, 2800 / getSpeed());
}

function toggleAuto() {
  if (isAuto) stopAuto();
  else { isAuto = true; document.getElementById('autoBtn').textContent = '⏸ 暂停'; startAutoTimer(); }
}
function stopAuto() {
  isAuto = false; clearInterval(autoTimer);
  document.getElementById('autoBtn').textContent = '▶ 自动播放';
}

function resetAll() {
  stopAuto(); cur = 0; render();
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= total) return;
  cur = next;
  render();
}

function render() {
  const s = STEPS[cur];

  // 进度
  document.getElementById('progFill').style.width = `${(cur+1)/total*100}%`;
  document.getElementById('sCnt').textContent = `步骤 ${cur+1} / ${total}`;

  // 文字
  document.getElementById('sTag').textContent = s.section;
  document.getElementById('sTitle').textContent = s.title;
  document.getElementById('sBody').innerHTML = s.body;
  document.querySelector('.step-area').scrollTop = 0;

  // 按钮
  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === total - 1;
  document.getElementById('nextBtn').textContent = cur === total-1 ? '完成 ✓' : '下一步 →';

  // 高亮
  activeNodes = new Set(s.active || []);
  activeEdges = new Set(s.edges || []);

  // 粒子
  liveParticles = [];
  (s.particles || []).forEach(([f, t, c]) => fireParticles(f, t, c, 8));

  // 数值区
  renderVals(s.vals);

  // 点
  updateDots();

  // 门值更新
  if (s.vals) {
    if (s.vals['f_t (遗忘)'] || s.vals['f_t']) {
      const fv = s.vals['f_t (遗忘)'] || s.vals['f_t'];
      gateValues.gateF = fv.reduce((a,b)=>a+b,0)/fv.length;
    }
    if (s.vals['i_t (写多少)'] || s.vals['i_t']) {
      const iv = s.vals['i_t (写多少)'] || s.vals['i_t'];
      gateValues.gateI = iv.reduce((a,b)=>a+b,0)/iv.length;
    }
    if (s.vals['o_t (输出门)'] || s.vals['o_t']) {
      const ov = s.vals['o_t (输出门)'] || s.vals['o_t'];
      gateValues.gateO = ov.reduce((a,b)=>a+b,0)/ov.length;
    }
  }
}

function valToHeight(v, maxH) {
  const abs = Math.abs(v);
  return Math.max(4, Math.min(abs * maxH * 0.45, maxH));
}
function valToColor(v) {
  if (v > 0) {
    const t = Math.min(v / 2, 1);
    return `rgba(52, ${Math.round(211 - t*70)}, ${Math.round(153 - t*80)}, 0.9)`;
  } else {
    const t = Math.min(-v / 2, 1);
    return `rgba(${Math.round(248)}, ${Math.round(113 - t*30)}, ${Math.round(113)}, 0.9)`;
  }
}

function renderVals(valsObj) {
  const area = document.getElementById('valsArea');
  area.innerHTML = '';
  if (!valsObj) return;
  const maxH = 48;
  Object.entries(valsObj).forEach(([label, vec]) => {
    const row = document.createElement('div');
    row.className = 'val-row';
    const lbl = document.createElement('div');
    lbl.className = 'val-label';
    lbl.textContent = label;
    row.appendChild(lbl);
    const bars = document.createElement('div');
    bars.className = 'vec-bars';
    // 显示最多8个维度
    vec.slice(0, 8).forEach(v => {
      const wrap = document.createElement('div');
      wrap.className = 'vec-bar-wrap';
      const bar = document.createElement('div');
      bar.className = 'vec-bar';
      bar.style.height = valToHeight(v, maxH) + 'px';
      bar.style.backgroundColor = valToColor(v);
      const lv = document.createElement('div');
      lv.className = 'vec-val';
      lv.textContent = v.toFixed ? v.toFixed(2) : v;
      wrap.appendChild(bar);
      wrap.appendChild(lv);
      bars.appendChild(wrap);
    });
    row.appendChild(bars);
    area.appendChild(row);
  });
}

function buildDots() {
  const row = document.getElementById('dotRow');
  row.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.onclick = () => { cur = i; render(); };
    row.appendChild(d);
  }
}

function updateDots() {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.remove('active', 'done');
    if (i === cur) d.classList.add('active');
    else if (i < cur) d.classList.add('done');
  });
}

// 键盘
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { e.preventDefault(); go(-1); }
});

// 初始化
buildDots();
resizeCanvas();
animLoop();
render();
</script>
