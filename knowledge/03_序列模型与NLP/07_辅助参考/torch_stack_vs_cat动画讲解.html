<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>torch.stack 数据迁移动画详解</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#d0d8e8;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:24px 20px 14px;background:linear-gradient(135deg,#0f1117,#161b22);border-bottom:1px solid #1e2a3a}
.header h1{font-size:26px;font-weight:700;background:linear-gradient(90deg,#58d1f0,#7ee8a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.header .sub{color:#6b7b8d;font-size:13px;margin-top:4px}
.tab-nav{display:flex;justify-content:center;gap:6px;padding:14px;background:#12151c}
.tab-btn{padding:9px 24px;border:1px solid #2a3545;border-radius:8px;background:#1a1f2e;color:#7b8a9d;font-size:14px;cursor:pointer;transition:all .3s;font-family:inherit}
.tab-btn:hover{border-color:#3a8fd4;color:#a0c4e8}
.tab-btn.active{background:linear-gradient(135deg,#1a3a5c,#1a4a3c);border-color:#4ab8e8;color:#7ee8a8;box-shadow:0 0 12px rgba(74,184,232,.15)}
.main{max-width:1100px;margin:0 auto;padding:16px 20px}

.shape-zone{text-align:center;padding:14px 0;min-height:90px;transition:all .4s}
.shape-row{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.shape-slot{width:64px;height:54px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;transition:all .6s cubic-bezier(.25,.8,.25,1);position:relative}
.shape-slot .dim-label{font-size:10px;font-weight:400;opacity:.7;margin-top:2px}
.shape-slot .src-label{font-size:9px;font-weight:400;opacity:.6;position:absolute;bottom:-14px;white-space:nowrap}
.slot-blue{background:linear-gradient(135deg,#1a3a5c,#1e4a6e);color:#7ec8e8;border:1px solid #2a5a8a}
.slot-green{background:linear-gradient(135deg,#1a4a3c,#1e5e4e);color:#7ee8a8;border:1px solid #2a6a5a}
.slot-gold{background:linear-gradient(135deg,#3a3a1a,#4a4a2a);color:#e8c87e;border:1px dashed #8a7a3a}
.slot-gold.filled{border-style:solid;background:linear-gradient(135deg,#4a4a1a,#5a5a2a);box-shadow:0 0 12px rgba(232,200,126,.2)}
.shape-arrow{font-size:20px;color:#4a6a8a;margin:0 4px}
.shape-bracket{font-size:22px;color:#3a4a5a;font-weight:300}

.anim-container{position:relative;min-height:340px;margin:10px 0}
.anim-container .src-zone{position:absolute;left:20px;top:0;display:flex;gap:28px;align-items:flex-start}
.anim-container .res-zone{position:absolute;right:20px;top:0}

.mat-label{font-size:13px;font-weight:600;margin-bottom:6px}
.mat-label-a{color:#5a9ac8}.mat-label-b{color:#5ab88a}
.mat-grid{display:inline-grid;gap:4px;padding:8px 12px;border:2px solid #2a3a4a;border-radius:8px;background:rgba(20,24,34,.6)}
.mat-grid.cols-2{grid-template-columns:repeat(2,52px)}
.cell{width:52px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:17px;font-weight:600;transition:all .5s cubic-bezier(.25,.8,.25,1)}
.cell-a{background:linear-gradient(135deg,#1a3a5c,#1e4a6e);color:#7ec8e8;border:1px solid #2a5a8a}
.cell-b{background:linear-gradient(135deg,#1a4a3c,#1e5e4e);color:#7ee8a8;border:1px solid #2a6a5a}
.cell-empty{background:rgba(30,34,50,.4);border:1px dashed #2a3a4a;color:#3a4a5a;font-size:14px}
.cell-filled-a{background:linear-gradient(135deg,#1a3a5c,#1e4a6e);color:#7ec8e8;border:1px solid #2a5a8a}
.cell-filled-b{background:linear-gradient(135deg,#1a4a3c,#1e5e4e);color:#7ee8a8;border:1px solid #2a6a5a}
.cell.dimmed{opacity:.25}
.cell.highlight{box-shadow:0 0 16px rgba(74,184,232,.5);transform:scale(1.1);z-index:2}

.res-dim0{display:flex;flex-direction:column;align-items:center;gap:6px}
.res-dim0 .layer-sep{width:120px;height:2px;background:linear-gradient(90deg,transparent,#e8c87e,transparent);margin:2px 0;position:relative}
.res-dim0 .layer-sep::after{content:'新维度 dim=0';position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:9px;color:#c8a84a;white-space:nowrap}
.res-dim0 .layer-label{font-size:11px;color:#5a7a8a}

.res-dim1{display:flex;flex-direction:column;align-items:center;gap:10px}
.res-dim1 .row-group{display:flex;align-items:center;gap:6px}
.res-dim1 .row-group-label{font-size:10px;color:#5a7a8a}
.res-dim1 .half-mat{display:inline-grid;gap:3px;padding:5px 8px;border:2px solid #2a3a4a;border-radius:6px;background:rgba(20,24,34,.4)}
.res-dim1 .half-mat.cols-2{grid-template-columns:repeat(2,44px)}
.res-dim1 .half-mat .cell{width:44px;height:32px;font-size:14px}
.res-dim1 .dim1-sep{width:2px;height:70px;background:linear-gradient(180deg,transparent,#e8c87e,transparent);position:relative;margin:0 2px}
.res-dim1 .dim1-sep::after{content:'dim=1';position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:9px;color:#c8a84a;white-space:nowrap}

.res-dim2{display:flex;flex-direction:column;align-items:center;gap:4px}
.res-dim2 .cell-pair{width:52px;height:56px;display:flex;flex-direction:column;gap:1px;border-radius:5px;overflow:hidden;border:1px solid #2a3a4a}
.res-dim2 .cell-half{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.res-dim2 .cell-half-a{background:#1a3a5c;color:#7ec8e8}
.res-dim2 .cell-half-b{background:#1a4a3c;color:#7ee8a8}
.res-dim2 .cell-pair-empty{background:rgba(30,34,50,.4);border:1px dashed #2a3a4a}
.res-dim2 .cell-pair-empty .cell-half{color:#3a4a5a;font-size:12px}
.res-dim2 .dim2-label{font-size:9px;color:#c8a84a;text-align:center;margin-top:-2px}

.fly-el{position:fixed;z-index:1000;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;pointer-events:none;transition:none;box-shadow:0 0 20px rgba(74,184,232,.4)}
.fly-el-a{background:#1e4a6e;color:#7ec8e8;border:1px solid #4a9ae8}
.fly-el-b{background:#1e5e4e;color:#7ee8a8;border:1px solid #4ae8a0}

.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px 0}
.ctrl-btn{padding:8px 18px;border-radius:6px;border:1px solid #2a3a4a;background:#1a2030;color:#8a9ab0;font-size:13px;cursor:pointer;transition:all .2s;font-family:inherit}
.ctrl-btn:hover{border-color:#3a8fd4;color:#b0d4f0}
.ctrl-btn:disabled{opacity:.3;cursor:not-allowed}
.step-label{font-size:13px;color:#6b7b8d;min-width:80px;text-align:center}

.explain{max-width:740px;margin:10px auto;background:#141822;border:1px solid #1e2a3a;border-radius:10px;padding:16px 22px;min-height:70px}
.explain .formula{font-size:15px;color:#7ee8a8;font-family:"SF Mono","Fira Code",monospace;margin-bottom:6px}
.explain .text{font-size:13px;color:#8a9ab0;line-height:1.7}
.explain .hl{color:#7ee8a8;font-weight:600}
.explain .bl{color:#7ec8e8;font-weight:600}

.mnemonic{max-width:600px;margin:16px auto;background:linear-gradient(135deg,#1a2a3a,#1a3a2a);border:1px solid #2a5a4a;border-radius:12px;padding:20px;text-align:center;opacity:0;transform:translateY(16px);transition:all .5s}
.mnemonic.show{opacity:1;transform:translateY(0)}
.mnemonic .mn-title{font-size:11px;color:#5a8a7a;letter-spacing:2px;margin-bottom:8px}
.mnemonic .mn-text{font-size:16px;color:#7ee8a8;line-height:1.8;font-weight:600}

.cmp-toggle{display:block;margin:16px auto;padding:9px 24px;border-radius:8px;border:1px solid #2a4a5a;background:#1a2535;color:#7ec8e8;font-size:13px;cursor:pointer;transition:all .3s;font-family:inherit}
.cmp-toggle:hover{background:#1e2a3a;border-color:#4ab8e8}
.cmp-panel{max-width:960px;margin:0 auto 24px;background:#141822;border:1px solid #1e2a3a;border-radius:12px;overflow:hidden;max-height:0;transition:max-height .5s,padding .3s}
.cmp-panel.open{max-height:700px;padding:20px}
.cmp-title{text-align:center;font-size:16px;color:#9db8d0;margin-bottom:16px}
.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cmp-col{text-align:center}
.cmp-col h3{font-size:14px;margin-bottom:4px}
.cmp-col .cmp-sub{font-size:11px;color:#5a6a7a;margin-bottom:10px}
.cmp-desc{font-size:12px;color:#6b7b8d;line-height:1.6;margin-top:10px;text-align:center}
.cmp-desc .hl-y{color:#e8c87e;font-weight:600}.cmp-desc .hl-b{color:#7ec8e8;font-weight:600}
.cmp-desc .hl-g{color:#7ee8a8;font-weight:600}

.cat-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.cat-mini{display:inline-grid;gap:2px}
.cat-mini.c2{grid-template-columns:repeat(2,34px)}
.cat-mini.c4{grid-template-columns:repeat(4,34px)}
.cat-c{width:34px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:12px;font-weight:600}
.cat-ca{background:#1a3a5c;color:#7ec8e8;border:1px solid #2a5a8a}
.cat-cb{background:#1a4a3c;color:#7ee8a8;border:1px solid #2a6a5a}
.cat-op{font-size:16px;color:#4a6a8a;margin:0 4px}

.stack-3d{position:relative;width:100px;height:90px;perspective:400px;margin:0 auto}
.s3d-layer{position:absolute;display:grid;gap:2px;grid-template-columns:repeat(2,30px);padding:4px;border-radius:4px;transition:all .6s}
.s3d-a{background:rgba(26,58,92,.9);border:1px solid #2a5a8a;top:0;left:0;transform:rotateX(12deg) rotateY(-4deg)}
.s3d-b{background:rgba(26,74,60,.9);border:1px solid #2a6a5a;top:24px;left:8px;transform:rotateX(12deg) rotateY(-4deg)}
.s3d-cell{width:30px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border-radius:2px}
.s3d-ca{color:#7ec8e8}.s3d-cb{color:#7ee8a8}
.s3d-sep{position:absolute;top:20px;left:-4px;right:-4px;height:1.5px;background:linear-gradient(90deg,transparent,#e8c87e,transparent);opacity:.5}

.footer{text-align:center;padding:16px;font-size:11px;color:#2a3a4a}
</style>
</head>
<body>

<div class="header">
  <h1>torch.stack 数据迁移动画详解</h1>
  <div class="sub">看清楚每个元素从哪来、到哪去、新维度怎么插进去</div>
</div>

<div class="tab-nav">
  <button class="tab-btn active" data-tab="0">dim = 0 上下分层</button>
  <button class="tab-btn" data-tab="1">dim = 1 行内并排</button>
  <button class="tab-btn" data-tab="2">dim = 2 格内配对</button>
</div>

<div class="main">
  <div class="shape-zone" id="shapeZone"></div>
  <div class="anim-container" id="animContainer"></div>
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" disabled>&#9664; 上一步</button>
    <span class="step-label" id="stepLabel">步骤 1 / 5</span>
    <button class="ctrl-btn" id="nextBtn">下一步 &#9654;</button>
  </div>
  <div class="explain"><div class="formula" id="exFormula"></div><div class="text" id="exText"></div></div>
  <div class="mnemonic" id="mnemonic"><div class="mn-title">记 忆 口 诀</div><div class="mn-text">stack 在哪个维度插入，就在哪个粒度上配对<br>dim 越大，配对越细<br>沿新维度切 = 完整的 a 和 b</div></div>
  <button class="cmp-toggle" id="cmpToggle">展开 stack vs cat 对比 ▼</button>
  <div class="cmp-panel" id="cmpPanel"></div>
</div>
<div class="footer">PyTorch 张量操作动画教学 · 纯前端实现</div>

<script>
var A=[[1,2],[3,4]], B=[[5,6],[7,8]];
var curTab=0, curStep=0, flyToken={cancelled:true};
var STEPS=5;

var EXPLAIN={
  0:[
    {f:'a.shape = [2, 2],  b.shape = [2, 2]',t:'两个 <span class="bl">2x2 矩阵</span>，准备在 <span class="hl">dim=0</span> 处插入新维度'},
    {f:'原始 shape: [2, 2]  →  结果 shape: [2, 2, 2]',t:'在 <span style="color:#e8c87e">dim=0 插入金色新槽</span>，蓝色(dim0)和绿色(dim1)都右移一位。新维度值=2，因为有2个张量参与stack'},
    {f:'配对: a 整体 ↔ b 整体',t:'dim=0 在最外层配对 → <span class="bl">a 整体</span>进第0层，<span class="hl">b 整体</span>进第1层'},
    {f:'数据迁移: a → Layer0, b → Layer1',t:'a 的4个元素飞入结果第0层(蓝色)，b 的4个元素飞入结果第1层(绿色)。新维度把两层"隔开"'},
    {f:'结果: r[0,:,:] = a,  r[1,:,:] = b',t:'<span class="bl">r[0] = [[1,2],[3,4]] = a完整</span> <span class="hl">r[1] = [[5,6],[7,8]] = b完整</span><br>沿新维度(dim0)切片，得到完整的 a 和 b'}
  ],
  1:[
    {f:'a.shape = [2, 2],  b.shape = [2, 2]',t:'两个 <span class="bl">2x2 矩阵</span>，准备在 <span class="hl">dim=1</span> 处插入新维度'},
    {f:'原始 shape: [2, 2]  →  结果 shape: [2, 2, 2]',t:'蓝色(dim0)不动，<span style="color:#e8c87e">dim=1 插入金色新槽</span>，绿色(dim1)右移到dim2。新维度值=2'},
    {f:'配对: a[0] ↔ b[0],  a[1] ↔ b[1]',t:'dim=1 在行级别配对 → <span class="bl">a第0行</span>和<span class="hl">b第0行</span>进同一行组，<span class="bl">a第1行</span>和<span class="hl">b第1行</span>进同一行组'},
    {f:'数据迁移: 每行组内 a行(左) + b行(右)',t:'a[0]=[1,2]飞入行组0左侧(蓝)，b[0]=[5,6]飞入行组0右侧(绿)。新维度在行组内左右分隔'},
    {f:'结果: r[:,0,:] = a,  r[:,1,:] = b',t:'<span style="color:#e8c87e">沿新维度(dim1)切</span>：r[:,0,:] = [[1,2],[3,4]] = <span class="bl">a完整</span> r[:,1,:] = [[5,6],[7,8]] = <span class="hl">b完整</span><br>但 r[0] = [[1,2],[5,6]] != a! 它混合了 a[0] 和 b[0]'}
  ],
  2:[
    {f:'a.shape = [2, 2],  b.shape = [2, 2]',t:'两个 <span class="bl">2x2 矩阵</span>，准备在 <span class="hl">dim=2</span> 处插入新维度'},
    {f:'原始 shape: [2, 2]  →  结果 shape: [2, 2, 2]',t:'蓝色(dim0)不动，绿色(dim1)不动，<span style="color:#e8c87e">dim=2 插入金色新槽</span>在最里面。无右移'},
    {f:'配对: a[i][j] ↔ b[i][j] （每个元素）',t:'dim=2 在元素级别配对 → <span class="bl">a[0][0]=1</span>和<span class="hl">b[0][0]=5</span>进同一格，上下叠放'},
    {f:'数据迁移: 每格内 a值(上) + b值(下)',t:'a[0][0]=1飞入[0,0]上层(蓝)，b[0][0]=5飞入[0,0]下层(绿)。新维度在格子内上下分隔'},
    {f:'结果: r[:,:,0] = a,  r[:,:,1] = b',t:'<span style="color:#e8c87e">沿新维度(dim2)切</span>：r[:,:,0] = [[1,2],[3,4]] = <span class="bl">a完整</span> r[:,:,1] = [[5,6],[7,8]] = <span class="hl">b完整</span><br>但 r[0,0] = [1,5] != a的任何行! 它是 a[0][0]+b[0][0] 配对'}
  ]
};

function render(){
  renderShape();renderAnim();renderExplain();
  document.getElementById('stepLabel').textContent='步骤 '+(curStep+1)+' / '+STEPS;
  document.getElementById('prevBtn').disabled=(curStep===0);
  document.getElementById('nextBtn').disabled=(curStep===STEPS-1);
  document.getElementById('mnemonic').classList.toggle('show',curStep===STEPS-1);
}

function renderShape(){
  var z=document.getElementById('shapeZone');
  if(curStep<1){z.innerHTML='<div style="color:#3a4a5a;font-size:13px;text-align:center;padding:10px">点击"下一步"查看 Shape 变换</div>';return;}
  var h='<div class="shape-row">';
  h+='<span style="color:#5a6a7a;font-size:12px;margin-right:4px">原始:</span>';
  h+='<span class="shape-bracket">[</span>';
  h+='<div class="shape-slot slot-blue">2<div class="dim-label">dim=0</div></div>';
  h+='<div class="shape-slot slot-green">2<div class="dim-label">dim=1</div></div>';
  h+='<span class="shape-bracket">]</span>';
  h+='<span class="shape-arrow">→</span>';
  h+='<span style="color:#5a6a7a;font-size:12px;margin-right:4px">结果:</span>';
  h+='<span class="shape-bracket">[</span>';
  if(curTab===0){
    h+='<div class="shape-slot slot-gold'+(curStep>=2?' filled':'')+'">2<div class="dim-label">dim=0</div><div class="src-label">新增</div></div>';
    h+='<div class="shape-slot slot-blue">2<div class="dim-label">dim=1</div><div class="src-label">←原处位0右移</div></div>';
    h+='<div class="shape-slot slot-green">2<div class="dim-label">dim=2</div><div class="src-label">←原处位1右移</div></div>';
  }else if(curTab===1){
    h+='<div class="shape-slot slot-blue">2<div class="dim-label">dim=0</div><div class="src-label">不变</div></div>';
    h+='<div class="shape-slot slot-gold'+(curStep>=2?' filled':'')+'">2<div class="dim-label">dim=1</div><div class="src-label">新增</div></div>';
    h+='<div class="shape-slot slot-green">2<div class="dim-label">dim=2</div><div class="src-label">←原处位1右移</div></div>';
  }else{
    h+='<div class="shape-slot slot-blue">2<div class="dim-label">dim=0</div><div class="src-label">不变</div></div>';
    h+='<div class="shape-slot slot-green">2<div class="dim-label">dim=1</div><div class="src-label">不变</div></div>';
    h+='<div class="shape-slot slot-gold'+(curStep>=2?' filled':'')+'">2<div class="dim-label">dim=2</div><div class="src-label">新增</div></div>';
  }
  h+='<span class="shape-bracket">]</span></div>';
  if(curStep>=2){
    h+='<div style="text-align:center;margin-top:18px;font-size:12px;color:#8a7a3a">';
    h+='<span style="color:#e8c87e">金色 = 新插入的维度</span>，值=2（stack了2个张量）。';
    if(curTab===0) h+='<span style="color:#7ec8e8">蓝</span>和<span style="color:#7ee8a8">绿</span>都右移了一位';
    else if(curTab===1) h+='<span style="color:#7ee8a8">绿</span>右移了一位，<span style="color:#7ec8e8">蓝</span>不动';
    else h+='<span style="color:#7ec8e8">蓝</span>和<span style="color:#7ee8a8">绿</span>都不动，新维度插在最里面';
    h+='</div>';
  }
  z.innerHTML=h;
}

function renderAnim(){
  var c=document.getElementById('animContainer');
  flyToken.cancelled=true;
  c.innerHTML='';
  var srcH='<div class="src-zone" id="srcZone">';
  srcH+=makeSrcMat('a',A);srcH+=makeSrcMat('b',B);
  srcH+='</div>';
  var resH='<div class="res-zone" id="resZone">'+makeResult()+'</div>';
  c.innerHTML=srcH+resH;
  if(curStep===3) setTimeout(function(){startFly();},300);
}

function makeSrcMat(name,data){
  var cls=name==='a'?'mat-label-a':'mat-label-b';
  var cellCls=name==='a'?'cell-a':'cell-b';
  var h='<div><div class="mat-label '+cls+'">'+name+'</div>';
  h+='<div class="mat-grid cols-2">';
  for(var r=0;r<2;r++) for(var cc=0;cc<2;cc++){
    var c=cellCls;
    if(curStep>=4) c+=' dimmed';
    else if(curStep===2||curStep===3) c+=' highlight';
    h+='<div class="cell '+c+'" id="src_'+name+'_'+r+'_'+cc+'">'+data[r][cc]+'</div>';
  }
  h+='</div></div>';
  return h;
}

function makeResult(){
  if(curTab===0) return makeRes0();
  if(curTab===1) return makeRes1();
  return makeRes2();
}

function makeRes0(){
  var filled=curStep>=4;
  var h='<div class="res-dim0">';
  h+='<div class="layer-label">r[0,:,:] ← a</div>';
  h+='<div class="mat-grid cols-2" style="border-color:#3a4a6a">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++){
    if(filled) h+='<div class="cell cell-filled-a">'+A[r][c]+'</div>';
    else h+='<div class="cell cell-empty" id="res_'+r+'_'+c+'">_</div>';
  }
  h+='</div><div class="layer-sep"></div>';
  h+='<div class="layer-label">r[1,:,:] ← b</div>';
  h+='<div class="mat-grid cols-2" style="border-color:#3a4a6a">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++){
    if(filled) h+='<div class="cell cell-filled-b">'+B[r][c]+'</div>';
    else h+='<div class="cell cell-empty" id="res_b_'+r+'_'+c+'">_</div>';
  }
  h+='</div></div>';
  return h;
}

function makeRes1(){
  var filled=curStep>=4;
  var h='<div class="res-dim1">';
  h+='<div class="row-group-label">r[0,:,:] — 第0行组</div>';
  h+='<div class="row-group">';
  h+=makeHalfMat('a',0,filled,'0_0');h+='<div class="dim1-sep"></div>';h+=makeHalfMat('b',0,filled,'0_1');
  h+='</div>';
  h+='<div class="row-group-label" style="margin-top:8px">r[1,:,:] — 第1行组</div>';
  h+='<div class="row-group">';
  h+=makeHalfMat('a',1,filled,'1_0');h+='<div class="dim1-sep"></div>';h+=makeHalfMat('b',1,filled,'1_1');
  h+='</div>';
  h+='<div style="font-size:9px;color:#e8c87e;text-align:center;margin-top:4px">← 沿新维度(dim=1)切开 = a/b的完整行 →</div>';
  h+='</div>';
  return h;
}

function makeHalfMat(name,row,filled,idPrefix){
  var data=name==='a'?A:B;
  var cellCls=name==='a'?'cell-filled-a':'cell-filled-b';
  var h='<div class="half-mat cols-2">';
  for(var c=0;c<2;c++){
    if(filled) h+='<div class="cell '+cellCls+'">'+data[row][c]+'</div>';
    else h+='<div class="cell cell-empty" id="res_'+idPrefix+'_'+c+'">_</div>';
  }
  h+='</div>';
  return h;
}

function makeRes2(){
  var filled=curStep>=4;
  var h='<div class="res-dim2">';
  h+='<div style="font-size:10px;color:#5a7a8a;text-align:center;margin-bottom:4px">每个格子内: 上=a值(蓝), 下=b值(绿)</div>';
  h+='<div class="mat-grid cols-2" style="border-color:#3a4a6a">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++){
    if(filled){
      h+='<div class="cell-pair">';
      h+='<div class="cell-half cell-half-a">'+A[r][c]+'</div>';
      h+='<div class="cell-half cell-half-b">'+B[r][c]+'</div>';
      h+='</div>';
    }else{
      h+='<div class="cell-pair cell-pair-empty">';
      h+='<div class="cell-half" id="res_'+r+'_'+c+'_0">_</div>';
      h+='<div class="cell-half" id="res_'+r+'_'+c+'_1">_</div>';
      h+='</div>';
    }
  }
  h+='</div>';
  h+='<div style="font-size:9px;color:#e8c87e;text-align:center;margin-top:2px">格内分隔 = 新维度 dim=2</div>';
  h+='</div>';
  return h;
}

function getMigrations(){
  var m=[];
  if(curTab===0){
    for(var r=0;r<2;r++) for(var c=0;c<2;c++)
      m.push({from:'src_a_'+r+'_'+c,to:'res_'+r+'_'+c,val:A[r][c],type:'a'});
    for(var r=0;r<2;r++) for(var c=0;c<2;c++)
      m.push({from:'src_b_'+r+'_'+c,to:'res_b_'+r+'_'+c,val:B[r][c],type:'b'});
  }else if(curTab===1){
    for(var r=0;r<2;r++) for(var c=0;c<2;c++)
      m.push({from:'src_a_'+r+'_'+c,to:'res_'+r+'_0_'+c,val:A[r][c],type:'a'});
    for(var r=0;r<2;r++) for(var c=0;c<2;c++)
      m.push({from:'src_b_'+r+'_'+c,to:'res_'+r+'_1_'+c,val:B[r][c],type:'b'});
  }else{
    for(var r=0;r<2;r++) for(var c=0;c<2;c++)
      m.push({from:'src_a_'+r+'_'+c,to:'res_'+r+'_'+c+'_0',val:A[r][c],type:'a'});
    for(var r=0;r<2;r++) for(var c=0;c<2;c++)
      m.push({from:'src_b_'+r+'_'+c,to:'res_'+r+'_'+c+'_1',val:B[r][c],type:'b'});
  }
  return m;
}

function startFly(){
  flyToken.cancelled=false;
  var ms=getMigrations();var idx=0;
  function next(){
    if(flyToken.cancelled||idx>=ms.length) return;
    flyOne(ms[idx],function(){idx++;if(idx<ms.length) setTimeout(next,180);});
  }
  next();
}

function flyOne(m,cb){
  var fEl=document.getElementById(m.from);
  var tEl=document.getElementById(m.to);
  if(!fEl||!tEl){cb();return;}
  var fR=fEl.getBoundingClientRect();
  var tR=tEl.getBoundingClientRect();
  var fly=document.createElement('div');
  fly.className='fly-el fly-el-'+m.type;
  fly.textContent=m.val;
  fly.style.width=fR.width+'px';fly.style.height=fR.height+'px';
  document.body.appendChild(fly);
  var start=null,dur=550;
  var sx=fR.left+fR.width/2,tw=fR.width,sh=fR.height;
  var ex=tR.left+tR.width/2,ey=tR.top+tR.height/2;
  var cx=(sx+ex)/2,cy=Math.min(fR.top,tR.top)-80;
  function frame(ts){
    if(flyToken.cancelled){fly.remove();cb();return;}
    if(!start) start=ts;
    var t=Math.min((ts-start)/dur,1);
    var x=(1-t)*(1-t)*sx+2*(1-t)*t*cx+t*t*ex-tw/2;
    var y=(1-t)*(1-t)*(fR.top+fR.height/2)+2*(1-t)*t*cy+t*t*ey-sh/2;
    fly.style.left=x+'px';fly.style.top=y+'px';
    fly.style.transform='scale('+(1+.15*Math.sin(t*Math.PI))+')';
    if(t<1) requestAnimationFrame(frame);
    else{
      fly.remove();
      tEl.className='cell cell-filled-'+m.type;
      tEl.textContent=m.val;
      tEl.style.transform='scale(1.15)';
      setTimeout(function(){tEl.style.transform='';},200);
      fEl.classList.add('dimmed');
      cb();
    }
  }
  requestAnimationFrame(frame);
}

function renderExplain(){
  var e=EXPLAIN[curTab][curStep];
  document.getElementById('exFormula').innerHTML=e.f;
  document.getElementById('exText').innerHTML=e.t;
}

function initCmpPanel(){
  var p=document.getElementById('cmpPanel');
  var h='<div class="cmp-title">stack vs cat 本质区别</div><div class="cmp-grid">';
  h+='<div class="cmp-col"><h3 style="color:#e8c87e">torch.cat — 拼木板</h3><div class="cmp-sub">沿已有维度拼接，维度数不变</div>';
  h+='<div class="cat-row"><div class="cat-mini c2">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++) h+='<div class="cat-c cat-ca">'+A[r][c]+'</div>';
  h+='</div><span class="cat-op">+</span><div class="cat-mini c2">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++) h+='<div class="cat-c cat-cb">'+B[r][c]+'</div>';
  h+='</div><span class="cat-op">→</span><div class="cat-mini c2">';
  for(var r=0;r<4;r++) for(var c=0;c<2;c++){var cls=r<2?'cat-ca':'cat-cb';h+='<div class="cat-c '+cls+'">'+(r<2?A[r][c]:B[r-2][c])+'</div>';}
  h+='</div></div><div style="font-size:10px;color:#5a6a7a">cat dim=0 → [4,2]</div>';
  h+='<div class="cmp-desc"><span class="hl-y">cat</span> = 两块板沿边缘<span class="hl-y">拼在一起</span><br><span class="hl-y">不新增维度</span>，只是某维度变长</div></div>';
  h+='<div class="cmp-col"><h3 style="color:#7ec8e8">torch.stack — 叠木板</h3><div class="cmp-sub">新增维度后拼接，维度数 +1</div>';
  h+='<div class="stack-3d"><div style="position:absolute;top:-16px;left:6px;font-size:10px;color:#5a9ac8">r[0]=a</div><div class="s3d-layer s3d-a">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++) h+='<div class="s3d-cell s3d-ca">'+A[r][c]+'</div>';
  h+='</div><div class="s3d-sep"></div><div class="s3d-layer s3d-b">';
  for(var r=0;r<2;r++) for(var c=0;c<2;c++) h+='<div class="s3d-cell s3d-cb">'+B[r][c]+'</div>';
  h+='</div><div style="position:absolute;bottom:-16px;left:14px;font-size:10px;color:#5ab88a">r[1]=b</div></div>';
  h+='<div class="cmp-desc"><span class="hl-b">stack</span> = 两块板<span class="hl-b">摂起来加隔层</span><br><span class="hl-b">新增一个维度</span>，就像加了一层分隔</div></div>';
  h+='</div>';
  p.innerHTML=h;
}

document.querySelectorAll('.tab-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active');});
    this.classList.add('active');
    curTab=parseInt(this.dataset.tab);curStep=0;render();
  });
});
document.getElementById('prevBtn').addEventListener('click',function(){if(curStep>0){curStep--;render();}});
document.getElementById('nextBtn').addEventListener('click',function(){if(curStep<STEPS-1){curStep++;render();}});
document.getElementById('cmpToggle').addEventListener('click',function(){
  var p=document.getElementById('cmpPanel');
  if(p.classList.contains('open')){p.classList.remove('open');this.textContent='展开 stack vs cat 对比 ▼';}
  else{p.classList.add('open');this.textContent='收起 stack vs cat 对比 ▲';}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(curStep<STEPS-1){curStep++;render();}}
  else if(e.key==='ArrowLeft'){e.preventDefault();if(curStep>0){curStep--;render();}}
  else if(e.key==='1'){document.querySelectorAll('.tab-btn')[0].click();}
  else if(e.key==='2'){document.querySelectorAll('.tab-btn')[1].click();}
  else if(e.key==='3'){document.querySelectorAll('.tab-btn')[2].click();}
});

initCmpPanel();render();
</script>
</body>
</html>
